basePath: /api
definitions:
  dto.AddParticipantsRequest:
    properties:
      boardId:
        type: string
      userIds:
        items:
          type: string
        maxItems: 50
        minItems: 1
        type: array
    required:
    - boardId
    - userIds
    type: object
  dto.AddParticipantsResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/dto.ParticipantResult'
        type: array
      totalFailed:
        type: integer
      totalRequested:
        type: integer
      totalSuccess:
        type: integer
    type: object
  dto.BoardDetailResponse:
    description: 'Detailed board response with value-based customFields, participants,
      and comments customFields contains field type as key and value string as value
      (not UUIDs) Example: {"importance": "high", "role": "developer", "stage": "in_progress"}'
    properties:
      assigneeId:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      authorId:
        example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        type: string
      boardId:
        example: 1275eac5-f0f9-4bee-8235-576a0042f42b
        type: string
      comments:
        items:
          $ref: '#/definitions/dto.CommentResponse'
        type: array
      content:
        example: Add JWT-based authentication to the API
        type: string
      createdAt:
        example: "2024-01-15T10:30:00Z"
        type: string
      customFields:
        additionalProperties:
          type: string
        example:
          importance: high
        type: object
      dueDate:
        example: "2024-12-31T23:59:59Z"
        type: string
      participantIds:
        example:
        - a1b2c3d4-e5f6-7890-abcd-ef1234567890
        - b2c3d4e5-f6a7-8901-bcde-f12345678901
        items:
          type: string
        type: array
      participants:
        items:
          $ref: '#/definitions/dto.ParticipantResponse'
        type: array
      projectId:
        example: 539167fb-b599-41ba-9ead-344a6d0b3a2f
        type: string
      title:
        example: Implement user authentication
        type: string
      updatedAt:
        example: "2024-01-15T14:20:00Z"
        type: string
    type: object
  dto.BoardFilters:
    properties:
      customFields:
        additionalProperties: true
        type: object
    type: object
  dto.BoardResponse:
    description: 'Board response with value-based customFields and participant IDs
      customFields contains field type as key and value string as value (not UUIDs)
      Example: {"importance": "high", "role": "developer", "stage": "in_progress"}
      participantIds contains an array of user IDs who are participants of the board'
    properties:
      assigneeId:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      authorId:
        example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        type: string
      boardId:
        example: 1275eac5-f0f9-4bee-8235-576a0042f42b
        type: string
      content:
        example: Add JWT-based authentication to the API
        type: string
      createdAt:
        example: "2024-01-15T10:30:00Z"
        type: string
      customFields:
        additionalProperties:
          type: string
        example:
          importance: high
        type: object
      dueDate:
        example: "2024-12-31T23:59:59Z"
        type: string
      participantIds:
        example:
        - a1b2c3d4-e5f6-7890-abcd-ef1234567890
        - b2c3d4e5-f6a7-8901-bcde-f12345678901
        items:
          type: string
        type: array
      projectId:
        example: 539167fb-b599-41ba-9ead-344a6d0b3a2f
        type: string
      title:
        example: Implement user authentication
        type: string
      updatedAt:
        example: "2024-01-15T14:20:00Z"
        type: string
    type: object
  dto.CommentResponse:
    properties:
      boardId:
        type: string
      commentId:
        type: string
      content:
        type: string
      createdAt:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  dto.CreateBoardRequest:
    description: 'Request body for creating a new board with value-based customFields
      customFields should contain field type as key and value string as value Valid
      field types: stage, role, importance Example values: stage="in_progress", role="developer",
      importance="high"'
    properties:
      assigneeId:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      content:
        example: Add JWT-based authentication to the API
        maxLength: 5000
        type: string
      customFields:
        additionalProperties:
          type: string
        example:
          importance: high
        type: object
      dueDate:
        example: "2024-12-31T23:59:59Z"
        type: string
      projectId:
        example: 539167fb-b599-41ba-9ead-344a6d0b3a2f
        type: string
      title:
        example: Implement user authentication
        maxLength: 200
        minLength: 1
        type: string
    required:
    - projectId
    - title
    type: object
  dto.CreateCommentRequest:
    properties:
      boardId:
        type: string
      content:
        minLength: 1
        type: string
    required:
    - boardId
    - content
    type: object
  dto.CreateFieldOptionRequest:
    properties:
      color:
        type: string
      displayOrder:
        type: integer
      fieldType:
        enum:
        - stage
        - role
        - importance
        type: string
      label:
        maxLength: 200
        type: string
      value:
        maxLength: 100
        type: string
    required:
    - color
    - fieldType
    - label
    - value
    type: object
  dto.CreateProjectJoinRequestRequest:
    properties:
      projectId:
        type: string
    required:
    - projectId
    type: object
  dto.CreateProjectRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      workspaceId:
        type: string
    required:
    - name
    - workspaceId
    type: object
  dto.FieldOption:
    properties:
      color:
        type: string
      description:
        type: string
      displayOrder:
        type: integer
      fieldId:
        type: string
      optionId:
        type: string
      optionLabel:
        type: string
      optionValue:
        type: string
    type: object
  dto.FieldOptionResponse:
    properties:
      color:
        type: string
      createdAt:
        type: string
      displayOrder:
        type: integer
      fieldType:
        type: string
      isSystemDefault:
        type: boolean
      label:
        type: string
      optionId:
        type: string
      updatedAt:
        type: string
      value:
        type: string
    type: object
  dto.FieldTypeInfo:
    properties:
      description:
        type: string
      typeId:
        type: string
      typeName:
        type: string
    type: object
  dto.FieldWithOptionsResponse:
    properties:
      description:
        type: string
      fieldId:
        type: string
      fieldName:
        type: string
      fieldType:
        type: string
      isRequired:
        type: boolean
      options:
        items:
          $ref: '#/definitions/dto.FieldOption'
        type: array
    type: object
  dto.MoveBoardRequest:
    properties:
      groupByFieldName:
        example: stage
        type: string
      newFieldValue:
        example: in_progress
        type: string
      projectId:
        example: 539167fb-b599-41ba-9ead-344a6d0b3a2f
        type: string
    required:
    - groupByFieldName
    - projectId
    type: object
  dto.MoveBoardResponse:
    properties:
      boardId:
        type: string
      message:
        type: string
      newFieldValue:
        type: string
    type: object
  dto.PaginatedBoardsResponse:
    properties:
      boards:
        items:
          $ref: '#/definitions/dto.BoardResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  dto.PaginatedProjectsResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      projects:
        items:
          $ref: '#/definitions/dto.ProjectResponse'
        type: array
      total:
        type: integer
    type: object
  dto.ParticipantResponse:
    properties:
      boardId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      userId:
        type: string
    type: object
  dto.ParticipantResult:
    properties:
      error:
        type: string
      success:
        type: boolean
      userId:
        type: string
    type: object
  dto.ProjectBasicInfo:
    properties:
      createdAt:
        type: string
      description:
        type: string
      isPublic:
        type: boolean
      name:
        type: string
      ownerEmail:
        type: string
      ownerId:
        type: string
      ownerName:
        type: string
      projectId:
        type: string
      updatedAt:
        type: string
      workspaceEmail:
        type: string
      workspaceId:
        type: string
      workspaceName:
        type: string
    type: object
  dto.ProjectInitSettingsResponse:
    properties:
      defaultViewId:
        type: string
      fieldTypes:
        items:
          $ref: '#/definitions/dto.FieldTypeInfo'
        type: array
      fields:
        items:
          $ref: '#/definitions/dto.FieldWithOptionsResponse'
        type: array
      project:
        $ref: '#/definitions/dto.ProjectBasicInfo'
    type: object
  dto.ProjectJoinRequestResponse:
    properties:
      projectId:
        type: string
      requestId:
        type: string
      requestedAt:
        type: string
      status:
        type: string
      updatedAt:
        type: string
      userEmail:
        type: string
      userId:
        type: string
      userName:
        type: string
    type: object
  dto.ProjectMemberResponse:
    properties:
      joinedAt:
        type: string
      memberId:
        type: string
      projectId:
        type: string
      roleName:
        type: string
      userEmail:
        type: string
      userId:
        type: string
      userName:
        type: string
    type: object
  dto.ProjectResponse:
    properties:
      createdAt:
        type: string
      description:
        type: string
      isPublic:
        type: boolean
      name:
        type: string
      ownerEmail:
        type: string
      ownerId:
        type: string
      ownerName:
        type: string
      projectId:
        type: string
      updatedAt:
        type: string
      workspaceId:
        type: string
    type: object
  dto.UpdateBoardFieldRequest:
    properties:
      fieldId:
        enum:
        - stage
        - importance
        - role
        type: string
      value:
        type: string
    required:
    - fieldId
    - value
    type: object
  dto.UpdateBoardRequest:
    description: 'Request body for updating a board with value-based customFields
      customFields should contain field type as key and value string as value Valid
      field types: stage, role, importance Example values: stage="completed", role="designer",
      importance="medium"'
    properties:
      assigneeId:
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      content:
        example: Refactor JWT implementation
        maxLength: 5000
        type: string
      customFields:
        additionalProperties:
          type: string
        example:
          importance: medium
        type: object
      dueDate:
        example: "2024-12-31T23:59:59Z"
        type: string
      title:
        example: Update user authentication
        maxLength: 200
        minLength: 1
        type: string
    type: object
  dto.UpdateCommentRequest:
    properties:
      content:
        minLength: 1
        type: string
    required:
    - content
    type: object
  dto.UpdateFieldOptionRequest:
    properties:
      color:
        type: string
      displayOrder:
        type: integer
      label:
        maxLength: 200
        type: string
    type: object
  dto.UpdateProjectJoinRequestRequest:
    properties:
      status:
        enum:
        - APPROVED
        - REJECTED
        type: string
    required:
    - status
    type: object
  dto.UpdateProjectMemberRoleRequest:
    properties:
      roleName:
        enum:
        - OWNER
        - ADMIN
        - MEMBER
        type: string
    required:
    - roleName
    type: object
  dto.UpdateProjectRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  handler.SchemaDocumentation:
    properties:
      boardFilters:
        allOf:
        - $ref: '#/definitions/dto.BoardFilters'
        description: Board related DTOs
      paginatedBoardsResponse:
        $ref: '#/definitions/dto.PaginatedBoardsResponse'
      updateBoardFieldRequest:
        $ref: '#/definitions/dto.UpdateBoardFieldRequest'
    type: object
  response.ErrorResponse:
    properties:
      error: {}
      requestId:
        type: string
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      requestId:
        type: string
    type: object
info:
  contact:
    email: support@example.com
    name: API Support
  description: |-
    프로젝트 보드 관리 시스템 API 서버입니다.
    Board, Project, Comment, Participant 관리 기능을 제공합니다.
    ALB path-based routing with /api/boards prefix
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Project Board Management API
  version: "1.0"
paths:
  /boards:
    get:
      description: |-
        특정 Project에 속한 모든 Board를 조회합니다. 프론트엔드 호환용 엔드포인트
        응답의 customFields는 value 기반 (UUID가 아닌 문자열 값)
        예시: {"importance": "high", "role": "developer", "stage": "in_progress"}
      parameters:
      - description: Project ID (UUID)
        in: query
        name: projectId
        required: true
        type: string
      - description: 'Custom Fields 필터 JSON 객체. 예시: {\'
        in: query
        name: customFields
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Board 목록 조회 성공
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.BoardResponse'
                  type: array
              type: object
        "400":
          description: 잘못된 Project ID 또는 필터 파라미터
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Project를 찾을 수 없음
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Project의 Board 목록 조회 (쿼리 파라미터 방식)
      tags:
      - boards
    post:
      consumes:
      - application/json
      description: |-
        새로운 Board를 생성합니다
        customFields는 value 기반 인터페이스를 사용합니다 (UUID 아님)
        유효한 필드 타입: stage, role, importance
        예시 값: stage="in_progress", role="developer", importance="high"
        잘못된 field value 제공 시 400 에러 반환
      parameters:
      - description: Board 생성 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBoardRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Board 생성 성공
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.BoardResponse'
              type: object
        "400":
          description: 잘못된 요청 또는 유효하지 않은 field value
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Project를 찾을 수 없음
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Board 생성
      tags:
      - boards
  /boards/{boardId}:
    delete:
      description: Board를 소프트 삭제합니다
      parameters:
      - description: Board ID (UUID)
        in: path
        name: boardId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Board 삭제 성공
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: 잘못된 Board ID
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Board를 찾을 수 없음
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Board 삭제
      tags:
      - boards
    get:
      description: |-
        Board ID로 상세 정보를 조회합니다 (참여자, 댓글 포함)
        응답의 customFields는 value 기반 (UUID가 아닌 문자열 값)
        예시: {"importance": "high", "role": "developer", "stage": "in_progress"}
      parameters:
      - description: Board ID (UUID)
        in: path
        name: boardId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Board 조회 성공
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.BoardDetailResponse'
              type: object
        "400":
          description: 잘못된 Board ID
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Board를 찾을 수 없음
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Board 상세 조회
      tags:
      - boards
    put:
      consumes:
      - application/json
      description: |-
        Board 정보를 수정합니다 (제목, 내용, 단계, 중요도, 역할)
        customFields는 value 기반 인터페이스를 사용합니다 (UUID 아님)
        유효한 필드 타입: stage, role, importance
        예시 값: stage="completed", role="designer", importance="medium"
        잘못된 field value 제공 시 400 에러 반환
      parameters:
      - description: Board ID (UUID)
        in: path
        name: boardId
        required: true
        type: string
      - description: Board 수정 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateBoardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Board 수정 성공
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.BoardResponse'
              type: object
        "400":
          description: 잘못된 요청 또는 유효하지 않은 field value
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Board를 찾을 수 없음
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Board 수정
      tags:
      - boards
  /boards/{boardId}/move:
    put:
      consumes:
      - application/json
      description: |-
        Board를 다른 컬럼으로 이동합니다. WebSocket을 통해 실시간으로 다른 클라이언트에게 전파됩니다
        groupByFieldName에 해당하는 필드의 값을 newFieldValue로 변경합니다
      parameters:
      - description: Board ID (UUID)
        in: path
        name: boardId
        required: true
        type: string
      - description: Board 이동 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MoveBoardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Board 이동 성공
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.MoveBoardResponse'
              type: object
        "400":
          description: 잘못된 요청
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Board를 찾을 수 없음
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Board 이동 (실시간 동기화)
      tags:
      - boards
  /boards/project/{projectId}:
    get:
      description: |-
        특정 Project에 속한 모든 Board를 조회합니다. customFields 파라미터로 필터링 가능 (JSON 형식)
        응답의 customFields는 value 기반 (UUID가 아닌 문자열 값)
        예시: {"importance": "high", "role": "developer", "stage": "in_progress"}
      parameters:
      - description: Project ID (UUID)
        in: path
        name: projectId
        required: true
        type: string
      - description: 'Custom Fields 필터 JSON 객체. 예시: {\'
        in: query
        name: customFields
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Board 목록 조회 성공
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.BoardResponse'
                  type: array
              type: object
        "400":
          description: 잘못된 Project ID 또는 필터 파라미터
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Project를 찾을 수 없음
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Project의 Board 목록 조회
      tags:
      - boards
  /comments:
    get:
      description: 특정 Board의 모든 Comment를 조회합니다. 프론트엔드 호환용 엔드포인트
      parameters:
      - description: Board ID (UUID)
        in: query
        name: boardId
        required: true
