basePath: /api
definitions:
  internal_handler.SchemaDocumentation:
    properties:
      boardFilters:
        allOf:
        - $ref: '#/definitions/project-board-api_internal_dto.BoardFilters'
        description: Board related DTOs
      paginatedBoardsResponse:
        $ref: '#/definitions/project-board-api_internal_dto.PaginatedBoardsResponse'
      updateBoardFieldRequest:
        $ref: '#/definitions/project-board-api_internal_dto.UpdateBoardFieldRequest'
    type: object
  project-board-api_internal_dto.AddParticipantRequest:
    properties:
      boardId:
        type: string
      userId:
        type: string
    required:
    - boardId
    - userId
    type: object
  project-board-api_internal_dto.BoardDetailResponse:
    properties:
      assigneeId:
        type: string
      authorId:
        type: string
      boardId:
        type: string
      comments:
        items:
          $ref: '#/definitions/project-board-api_internal_dto.CommentResponse'
        type: array
      content:
        type: string
      createdAt:
        type: string
      customFields:
        additionalProperties: true
        type: object
      dueDate:
        type: string
      participants:
        items:
          $ref: '#/definitions/project-board-api_internal_dto.ParticipantResponse'
        type: array
      projectId:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  project-board-api_internal_dto.BoardFilters:
    properties:
      customFields:
        additionalProperties: true
        type: object
    type: object
  project-board-api_internal_dto.BoardResponse:
    properties:
      assigneeId:
        type: string
      authorId:
        type: string
      boardId:
        type: string
      content:
        type: string
      createdAt:
        type: string
      customFields:
        additionalProperties: true
        type: object
      dueDate:
        type: string
      projectId:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  project-board-api_internal_dto.CommentResponse:
    properties:
      boardId:
        type: string
      commentId:
        type: string
      content:
        type: string
      createdAt:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  project-board-api_internal_dto.CreateBoardRequest:
    properties:
      assigneeId:
        type: string
      content:
        maxLength: 5000
        type: string
      customFields:
        additionalProperties: true
        type: object
      dueDate:
        type: string
      projectId:
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - projectId
    - title
    type: object
  project-board-api_internal_dto.CreateCommentRequest:
    properties:
      boardId:
        type: string
      content:
        minLength: 1
        type: string
    required:
    - boardId
    - content
    type: object
  project-board-api_internal_dto.CreateFieldOptionRequest:
    properties:
      color:
        type: string
      displayOrder:
        type: integer
      fieldType:
        enum:
        - stage
        - role
        - importance
        type: string
      label:
        maxLength: 200
        type: string
      value:
        maxLength: 100
        type: string
    required:
    - color
    - fieldType
    - label
    - value
    type: object
  project-board-api_internal_dto.CreateProjectJoinRequestRequest:
    properties:
      projectId:
        type: string
    required:
    - projectId
    type: object
  project-board-api_internal_dto.CreateProjectRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      workspaceId:
        type: string
    required:
    - name
    - workspaceId
    type: object
  project-board-api_internal_dto.FieldOption:
    properties:
      optionId:
        type: string
      optionLabel:
        type: string
      optionValue:
        type: string
    type: object
  project-board-api_internal_dto.FieldOptionResponse:
    properties:
      color:
        type: string
      createdAt:
        type: string
      displayOrder:
        type: integer
      fieldType:
        type: string
      isSystemDefault:
        type: boolean
      label:
        type: string
      optionId:
        type: string
      updatedAt:
        type: string
      value:
        type: string
    type: object
  project-board-api_internal_dto.FieldTypeInfo:
    properties:
      description:
        type: string
      typeId:
        type: string
      typeName:
        type: string
    type: object
  project-board-api_internal_dto.FieldWithOptionsResponse:
    properties:
      description:
        type: string
      fieldId:
        type: string
      fieldName:
        type: string
      fieldType:
        type: string
      isRequired:
        type: boolean
      options:
        items:
          $ref: '#/definitions/project-board-api_internal_dto.FieldOption'
        type: array
    type: object
  project-board-api_internal_dto.PaginatedBoardsResponse:
    properties:
      boards:
        items:
          $ref: '#/definitions/project-board-api_internal_dto.BoardResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  project-board-api_internal_dto.PaginatedProjectsResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      projects:
        items:
          $ref: '#/definitions/project-board-api_internal_dto.ProjectResponse'
        type: array
      total:
        type: integer
    type: object
  project-board-api_internal_dto.ParticipantResponse:
    properties:
      boardId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      userId:
        type: string
    type: object
  project-board-api_internal_dto.ProjectBasicInfo:
    properties:
      createdAt:
        type: string
      description:
        type: string
      isPublic:
        type: boolean
      name:
        type: string
      ownerId:
        type: string
      projectId:
        type: string
      updatedAt:
        type: string
      workspaceEmail:
        type: string
      workspaceId:
        type: string
      workspaceName:
        type: string
    type: object
  project-board-api_internal_dto.ProjectInitSettingsResponse:
    properties:
      defaultViewId:
        type: string
      fieldTypes:
        items:
          $ref: '#/definitions/project-board-api_internal_dto.FieldTypeInfo'
        type: array
      fields:
        items:
          $ref: '#/definitions/project-board-api_internal_dto.FieldWithOptionsResponse'
        type: array
      project:
        $ref: '#/definitions/project-board-api_internal_dto.ProjectBasicInfo'
    type: object
  project-board-api_internal_dto.ProjectJoinRequestResponse:
    properties:
      projectId:
        type: string
      requestId:
        type: string
      requestedAt:
        type: string
      status:
        type: string
      updatedAt:
        type: string
      userEmail:
        type: string
      userId:
        type: string
      userName:
        type: string
    type: object
  project-board-api_internal_dto.ProjectMemberResponse:
    properties:
      joinedAt:
        type: string
      memberId:
        type: string
      projectId:
        type: string
      roleName:
        type: string
      userEmail:
        type: string
      userId:
        type: string
      userName:
        type: string
    type: object
  project-board-api_internal_dto.ProjectResponse:
    properties:
      createdAt:
        type: string
      description:
        type: string
      isPublic:
        type: boolean
      name:
        type: string
      ownerEmail:
        type: string
      ownerId:
        type: string
      ownerName:
        type: string
      projectId:
        type: string
      updatedAt:
        type: string
      workspaceId:
        type: string
    type: object
  project-board-api_internal_dto.UpdateBoardFieldRequest:
    properties:
      fieldId:
        enum:
        - stage
        - importance
        - role
        type: string
      value:
        type: string
    required:
    - fieldId
    - value
    type: object
  project-board-api_internal_dto.UpdateBoardRequest:
    properties:
      assigneeId:
        type: string
      content:
        maxLength: 5000
        type: string
      customFields:
        additionalProperties: true
        type: object
      dueDate:
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    type: object
  project-board-api_internal_dto.UpdateCommentRequest:
    properties:
      content:
        minLength: 1
        type: string
    required:
    - content
    type: object
  project-board-api_internal_dto.UpdateFieldOptionRequest:
    properties:
      color:
        type: string
      displayOrder:
        type: integer
      label:
        maxLength: 200
        type: string
    type: object
  project-board-api_internal_dto.UpdateProjectJoinRequestRequest:
    properties:
      status:
        enum:
        - APPROVED
        - REJECTED
        type: string
    required:
    - status
    type: object
  project-board-api_internal_dto.UpdateProjectMemberRoleRequest:
    properties:
      roleName:
        enum:
        - OWNER
        - ADMIN
        - MEMBER
        type: string
    required:
    - roleName
    type: object
  project-board-api_internal_dto.UpdateProjectRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  project-board-api_internal_response.ErrorResponse:
    properties:
      error: {}
      requestId:
        type: string
    type: object
  project-board-api_internal_response.SuccessResponse:
    properties:
      data: {}
      requestId:
        type: string
    type: object
info:
  contact:
    email: support@example.com
    name: API Support
  description: |-
    프로젝트 보드 관리 시스템 API 서버입니다.
    Board, Project, Comment, Participant 관리 기능을 제공합니다.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Project Board Management API
  version: "1.0"
paths:
  /boards:
    get:
      description: 특정 Project에 속한 모든 Board를 조회합니다. 프론트엔드 호환용 엔드포인트
      parameters:
      - description: Project ID (UUID)
        in: query
        name: projectId
        required: true
        type: string
      - description: Custom Fields 필터 JSON 객체
        in: query
        name: customFields
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Board 목록 조회 성공
          schema:
            allOf:
            - $ref: '#/definitions/project-board-api_internal_response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/project-board-api_internal_dto.BoardResponse'
                  type: array
              type: object
        "400":
          description: 잘못된 Project ID 또는 필터 파라미터
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "404":
          description: Project를 찾을 수 없음
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
      summary: Project의 Board 목록 조회 (쿼리 파라미터 방식)
      tags:
      - boards
    post:
      consumes:
      - application/json
      description: 새로운 Board를 생성합니다
      parameters:
      - description: Board 생성 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/project-board-api_internal_dto.CreateBoardRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Board 생성 성공
          schema:
            allOf:
            - $ref: '#/definitions/project-board-api_internal_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/project-board-api_internal_dto.BoardResponse'
              type: object
        "400":
          description: 잘못된 요청
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "404":
          description: Project를 찾을 수 없음
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
      summary: Board 생성
      tags:
      - boards
  /boards/{boardId}:
    delete:
      description: Board를 소프트 삭제합니다
      parameters:
      - description: Board ID (UUID)
        in: path
        name: boardId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Board 삭제 성공
          schema:
            $ref: '#/definitions/project-board-api_internal_response.SuccessResponse'
        "400":
          description: 잘못된 Board ID
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "404":
          description: Board를 찾을 수 없음
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
      summary: Board 삭제
      tags:
      - boards
    get:
      description: Board ID로 상세 정보를 조회합니다 (참여자, 댓글 포함)
      parameters:
      - description: Board ID (UUID)
        in: path
        name: boardId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Board 조회 성공
          schema:
            allOf:
            - $ref: '#/definitions/project-board-api_internal_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/project-board-api_internal_dto.BoardDetailResponse'
              type: object
        "400":
          description: 잘못된 Board ID
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "404":
          description: Board를 찾을 수 없음
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
      summary: Board 상세 조회
      tags:
      - boards
    put:
      consumes:
      - application/json
      description: Board 정보를 수정합니다 (제목, 내용, 단계, 중요도, 역할)
      parameters:
      - description: Board ID (UUID)
        in: path
        name: boardId
        required: true
        type: string
      - description: Board 수정 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/project-board-api_internal_dto.UpdateBoardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Board 수정 성공
          schema:
            allOf:
            - $ref: '#/definitions/project-board-api_internal_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/project-board-api_internal_dto.BoardResponse'
              type: object
        "400":
          description: 잘못된 요청
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "404":
          description: Board를 찾을 수 없음
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
      summary: Board 수정
      tags:
      - boards
  /boards/project/{projectId}:
    get:
      description: 특정 Project에 속한 모든 Board를 조회합니다. customFields 파라미터로 필터링 가능 (JSON
        형식)
      parameters:
      - description: Project ID (UUID)
        in: path
        name: projectId
        required: true
        type: string
      - description: 'Custom Fields 필터 JSON 객체. 예시: stage=in_progress, role=developer'
        in: query
        name: customFields
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Board 목록 조회 성공
          schema:
            allOf:
            - $ref: '#/definitions/project-board-api_internal_response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/project-board-api_internal_dto.BoardResponse'
                  type: array
              type: object
        "400":
          description: 잘못된 Project ID 또는 필터 파라미터
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "404":
          description: Project를 찾을 수 없음
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
      summary: Project의 Board 목록 조회
      tags:
      - boards
  /comments:
    get:
      description: 특정 Board의 모든 Comment를 조회합니다. 프론트엔드 호환용 엔드포인트
      parameters:
      - description: Board ID (UUID)
        in: query
        name: boardId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Comment 목록 조회 성공
          schema:
            allOf:
            - $ref: '#/definitions/project-board-api_internal_response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/project-board-api_internal_dto.CommentResponse'
                  type: array
              type: object
        "400":
          description: 잘못된 Board ID
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "404":
          description: Board를 찾을 수 없음
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
      summary: Board의 Comment 목록 조회 (쿼리 파라미터 방식)
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Board에 새로운 Comment를 작성합니다
      parameters:
      - description: Comment 생성 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/project-board-api_internal_dto.CreateCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Comment 생성 성공
          schema:
            allOf:
            - $ref: '#/definitions/project-board-api_internal_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/project-board-api_internal_dto.CommentResponse'
              type: object
        "400":
          description: 잘못된 요청
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "404":
          description: Board를 찾을 수 없음
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
      summary: Comment 생성
      tags:
      - comments
  /comments/{commentId}:
    delete:
      description: Comment를 소프트 삭제합니다
      parameters:
      - description: Comment ID (UUID)
        in: path
        name: commentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Comment 삭제 성공
          schema:
            $ref: '#/definitions/project-board-api_internal_response.SuccessResponse'
        "400":
          description: 잘못된 Comment ID
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "404":
          description: Comment를 찾을 수 없음
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
        "500":
          description: 서버 에러
          schema:
            $ref: '#/definitions/project-board-api_internal_response.ErrorResponse'
      summary: Comment 삭제
      tags:
      - comments
    put:
      consumes:
      - application/json
      description: Comment 내용을 수정합니다
      parameters:
      - description: Comment ID (UUID)
        in: path
        name: commentId
        required: true
        type: string
      - description: Comment 수정 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/project-board-api_internal_dto.UpdateCommentRequest'
      produces:
