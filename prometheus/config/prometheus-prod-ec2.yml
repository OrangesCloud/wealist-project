global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Percona RDS Exporter (AWS RDS 모니터링)
  - job_name: 'rds-exporter'
    static_configs:
      - targets: ['rds_exporter:9042'] 
    scrape_interval: 15s

  # 2. Elasticsearch Exporter (Elasticsearch 모니터링)
  - job_name: 'elasticsearch-exporter'
    static_configs:
      - targets: ['elasticsearch_exporter:9114']
    scrape_interval: 15s

  # Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:{{NODE_EXPORTER_PORT}}']
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:{{PROMETHEUS_PORT}}']
    scrape_interval: 15s

  # --- [새로 추가된 User/Board Service 동적 수집] ---

  # 🔔 User & Board Service 동적 수집 (Auto Scaling 대응)
  - job_name: 'wealist-app-services'
    ec2_sd_configs:
      - region: ap-northeast-2
        # User Service 포트(8080)를 기본 포트로 설정합니다.
        port: 8080 
        filters:
          # 🛑 User/Board Service가 배포된 인스턴스를 식별하는 태그를 사용합니다.
          # (실제 환경의 태그 값으로 변경해야 합니다. 예: Wealist-App)
          - name: tag:ServiceGroup
            values: ['Wealist-App'] 
          - name: instance-state-name
            values: [running]
            
    relabel_configs:
      
      # 1. User Service (8080 포트) 타겟 구성:
      # 최종 주소: Private_IP:8080
      - source_labels: [__meta_ec2_private_ip]
        target_label: __address__
        regex: '(.+)'
        replacement: '$1:8080' 
        action: replace
      # User Service의 Metrics Path 설정
      - target_label: __metrics_path__
        replacement: '/api/users/actuator/prometheus' 
        action: replace
      # service_name 레이블 추가
      - target_label: service_name
        replacement: 'user-service'
        action: replace

      # 2. Board Service (8000 포트) 타겟 복사 및 생성:
      
      # __address__ (8080)를 임시로 복사하여 원본 타겟 유지
      - source_labels: [__address__]
        target_label: __tmp_address_copy
        regex: '(.+)'
        action: replace
        
      # 새로운 타겟 주소: Private_IP:8000 생성
      - source_labels: [__meta_ec2_private_ip]
        target_label: __address__
        regex: '(.+)'
        replacement: '$1:8000' 
        action: replace
        
      # Board Service metrics_path와 service_name 레이블 추가
      - target_label: __metrics_path__
        replacement: '/metrics' 
        action: replace
      - target_label: service_name
        replacement: 'board-service' 
        action: replace

      # 3. 인스턴스 이름/ID 레이블 변환 (기존 설정 유지)
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance_name
        action: replace
        
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id
        action: replace

  # --- [기존 Node Exporter 동적 수집] ---

  - job_name: 'ec2-discovery'
    ec2_sd_configs:
# ... (기존 ec2-discovery 설정 유지)