global:
  scrape_interval: 30s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rds-basic
    scrape_interval: 60s
    scrape_timeout: 55s
    metrics_path: '/basic'
    honor_labels: true
    static_configs:
      - targets: ['wealist-rds-exporter:9042']

  - job_name: rds-enhanced
    scrape_interval: 10s
    scrape_timeout: 9s
    metrics_path: '/enhanced'
    honor_labels: true
    static_configs:
      - targets: ['wealist-rds-exporter:9042']

  - job_name: 'elasticsearch-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['wealist-elasticsearch-exporter:9114']

  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['wealist-node-exporter:9100']

  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'wealist-user-service'
    scrape_interval: 15s
    metrics_path: '/api/users/actuator/prometheus'
    static_configs:
      - targets: ['api.wealist.co.kr']

  - job_name: 'wealist-board-service'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api.wealist.co.kr']