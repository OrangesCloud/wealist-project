server:
  http_listen_port: 9080
# Promtail 자신의 상태 확인을 위한 포트입니다.

positions:
  filename: /tmp/positions.yaml
# [아주 중요] "책갈피" 기능입니다.
# 로그는 계속 쌓이는데, Promtail이 재부팅되면 처음부터 다시 읽으면 안 되겠죠?
# "나 여기까지 읽었어"라고 기록해두는 파일입니다. 중복 수집을 막아줍니다.

clients:
  - url: http://loki:3100/loki/api/v1/push
# 배달지 주소입니다.
# "http://loki:3100"에서 "loki"는 docker-compose에서 정의한 서비스 이름입니다.
# 같은 도커 네트워크 안에 있으니 이름으로 통신이 가능합니다.

scrape_configs: # 수집 규칙
  - job_name: wealist-services
    # 도커 데몬에게 직접 물어보는 설정
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    # 가져온 정보 중 '컨테이너 이름'을 라벨로 예쁘게 만드는 설정
    relabel_configs:
      # wealist 서비스들만 수집 (다른 컨테이너는 무시)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(wealist-(user|board|postgres|redis|minio|nginx|frontend)-.*)"
        action: keep
      
      # 컨테이너 이름을 깔끔하게 정리
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(wealist-(.+))"
        target_label: "container_name"
        replacement: "${2}"
      
      # 서비스별로 job 라벨 설정
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(wealist-user-service.*)"
        target_label: "job"
        replacement: "user-service"
      
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(wealist-board-service.*)"
        target_label: "job"
        replacement: "board-service"
      
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(wealist-postgres.*)"
        target_label: "job"
        replacement: "postgres"
        
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(wealist-redis.*)"
        target_label: "job"
        replacement: "redis"
        
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(wealist-nginx.*)"
        target_label: "job"
        replacement: "nginx"
        
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(wealist-frontend.*)"
        target_label: "job"
        replacement: "frontend"

    pipeline_stages:
      - docker: {} # 1. 도커 JSON 껍데기 벗기기
      
      # PostgreSQL 로그 전용 처리
      - match:
          selector: '{job="postgres"}'
          stages:
            - multiline:
                # [핵심] PostgreSQL 로그의 첫 줄을 인식하는 규칙
                # 패턴: "YYYY-MM-DD HH:MM:SS" 시간으로 시작하는 줄만 '새로운 로그'로 인정
                # 그 외(여러 줄 쿼리 등)는 다 윗줄에 이어 붙임
                firstline: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
                max_wait_time: 3s
            - regex:
                # PostgreSQL 로그 파싱 (로그 레벨, 메시지 추출)
                expression: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \w{3} \[\d+\] (?P<level>LOG|ERROR|WARNING|FATAL|PANIC|STATEMENT):\s*(?P<message>.*)'
            - labels:
                level:

      # Java 서비스 (user-service) 로그 처리
      - match:
          selector: '{job="user-service"}'
          stages:
            - multiline:
                # Java 스택트레이스 처리
                # 날짜-시간으로 시작하거나 로그 레벨로 시작하는 줄을 새로운 로그로 인정
                firstline: '^\d{4}-\d{2}-\d{2}|\w{4,5}\s+\d{4}-\d{2}-\d{2}|^(INFO|DEBUG|WARN|ERROR|TRACE)'
                max_wait_time: 3s
            - regex:
                # Java 로그 파싱 (레벨, 클래스, 메시지 추출)
                expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>INFO|DEBUG|WARN|ERROR|TRACE)\s+\[(?P<thread>[^\]]+)\]\s+(?P<logger>\S+)\s+:\s+(?P<message>.*)'
            - labels:
                level:
                logger:

      # Go 서비스 (board-service) 로그 처리
      - match:
          selector: '{job="board-service"}'
          stages:
            - regex:
                # Go 로그 파싱 (일반적인 형태)
                expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2})\s+(?P<level>INFO|DEBUG|WARN|ERROR|FATAL|PANIC)?\s*(?P<message>.*)'
            - labels:
                level:

      # Nginx 로그 처리
      - match:
          selector: '{job="nginx"}'
          stages:
            - regex:
                # Nginx access log 파싱
                expression: '^(?P<remote_addr>\S+) \S+ \S+ \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+)'
            - labels:
                method:
                status:
            - template:
                source: log_type
                template: |
                  {{ if .status }}access{{ else }}error{{ end }}
            - labels:
                log_type:

      # Redis 로그 처리
      - match:
          selector: '{job="redis"}'
          stages:
            - regex:
                # Redis 로그 파싱
                expression: '^\d+:(?P<role>[MCS]) (?P<timestamp>\d{2} \w{3} \d{4} \d{2}:\d{2}:\d{2}\.\d{3}) (?P<level>[\*\#\-\.]) (?P<message>.*)'
            - labels:
                level:
                role: