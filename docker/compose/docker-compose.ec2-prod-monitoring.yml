services:
  prometheus:
    image: prom/prometheus:latest
    container_name: wealist-prometheus
    hostname: prometheus
    user: "0:0"
    command:
      - '--config.file=/etc/prometheus/prometheus-ec2.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
      
    volumes:
      - ${PROMETHEUS_CONFIG_DIR}:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - backend-net
      - database-net
      - monitoring-net
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: wealist-grafana
    hostname: grafana
    
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://api.wealist.co.kr/monitoring
      - GF_SERVER_SERVE_FROM_SUB_PATH=true  
      - GF_INSTALL_PLUGINS=redis-datasource

    volumes:
      - grafana-storage:/var/lib/grafana
      - grafana-logs:/var/log/grafana

    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:2.9.0
    container_name: wealist-loki
    hostname: loki
    user: "0:0"
    command: -config.file=/etc/loki/local-config.yaml

    ports:
      - "${LOKI_PORT:-3100}:3100"

    volumes:
      - /home/ubuntu/wealist/loki/config:/etc/loki:ro  # 하드코딩된 경로 사용
      - loki-data:/loki

    networks:
      - monitoring-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  promtail:
    image: grafana/promtail:2.9.0
    container_name: wealist-promtail
    hostname: promtail

    volumes:
      - /home/ubuntu/wealist/promtail/config:/etc/promtail:ro  # 하드코딩된 경로 사용
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    
    command: -config.file=/etc/promtail/promtail.yml

    networks:
      - monitoring-net

    restart: unless-stopped
    
    depends_on:
      - loki

  # Redis Exporter (Redis 모니터링용)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: wealist-redis-exporter
    hostname: redis-exporter
    
    environment:
      - REDIS_ADDR=redis://${ES_URI}:6379  # Redis 주소 사용
      
    ports:
      - "9121:9121"

    networks:
      - monitoring-net
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9121/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: wealist-node-exporter
    hostname: node-exporter
    
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
      
    networks:
      - monitoring-net
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  monitoring-net:
    driver: bridge
    name: wealist-monitoring-net

  backend-net:
    external: true
    name: wealist-backend-net

  database-net:
    external: true
    name: wealist-database-net

volumes:
  prometheus-data:
    name: wealist-prometheus-data
    driver: local

  loki-data:
    name: wealist-loki-storage
    driver: local

  grafana-storage:
    name: wealist-grafana-storage
    driver: local

  grafana-logs:
    name: wealist-grafana-logs
    driver: local