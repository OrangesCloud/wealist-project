services:
  prometheus:
    image: prom/prometheus:latest
    container_name: wealist-prometheus
    hostname: prometheus
    user: "0:0"
    command:
      - '--config.file=/etc/prometheus/prometheus-ec2.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
      
    volumes:
      - ${PROMETHEUS_CONFIG_DIR}:/etc/prometheus:ro
      - /home/ubuntu/wealist/prometheus/data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - monitoring-net
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: wealist-grafana
    hostname: grafana
    
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://api.wealist.co.kr/monitoring
      - GF_SERVER_SERVE_FROM_SUB_PATH=true  
      - GF_INSTALL_PLUGINS=redis-datasource

    volumes:
      - /home/ubuntu/wealist/grafana/data:/var/lib/grafana
      - /home/ubuntu/wealist/grafana/logs:/var/log/grafana

    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:2.9.0
    container_name: wealist-loki
    hostname: loki
    user: "0:0"
    command: -config.file=/etc/loki/local-config.yaml

    ports:
      - "${LOKI_PORT:-3100}:3100"

    volumes:
      - /home/ubuntu/wealist/loki/config:/etc/loki:ro
      - /home/ubuntu/wealist/loki/data:/loki

    networks:
      - monitoring-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  promtail:
    image: grafana/promtail:2.9.0
    container_name: wealist-promtail
    hostname: promtail

    volumes:
      - /home/ubuntu/wealist/promtail/config:/etc/promtail:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    
    command: -config.file=/etc/promtail/config/promtail.yml

    networks:
      - monitoring-net

    restart: unless-stopped
    
    depends_on:
      - loki

  rds-exporter:
    image: ${RDS_EXPORTER_IMAGE:-qonto/prometheus-rds-exporter:latest}
    container_name: wealist-rds-exporter
    hostname: rds-exporter
    
    environment:
      - AWS_DEFAULT_REGION=${AWS_REGION:-ap-northeast-2}

    volumes:
      - /etc/localtime:/etc/localtime:ro
      
    ports:
      - "${RDS_EXPORTER_PORT:-9042}:9042"
      
    networks:
      - monitoring-net
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9042/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
    container_name: wealist-elasticsearch-exporter
    hostname: elasticsearch-exporter
    
    command:
      - --es.uri=${ES_URI:-http://localhost:9200}
      
    ports:
      - "${ELASTIC_EXPORTER_PORT:-9114}:9114"
      
    networks:
      - monitoring-net
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9114/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  node-exporter:
    image: prom/node-exporter:latest
    container_name: wealist-node-exporter
    hostname: node-exporter
    
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      
    ports:
      - "${NODE_EXPORTER_PORT:-9001}:9100"
      
    networks:
      - monitoring-net
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  monitoring-net:
    driver: bridge
    name: wealist-monitoring-net

# volumes 섹션 제거 (로컬 디렉토리 사용하므로 불필요)