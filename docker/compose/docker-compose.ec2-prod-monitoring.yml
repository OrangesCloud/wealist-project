services:
  prometheus:
    image: prom/prometheus:latest
    container_name: wealist-prometheus
    hostname: prometheus
    user: "0:0"
    command:
      - '--config.file=/etc/prometheus/prometheus-ec2.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
      
    volumes:
      - ${PROMETHEUS_CONFIG_DIR}:/etc/prometheus:ro
       - /home/ubuntu/wealist/prometheus/data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - monitoring-net
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: wealist-grafana
    hostname: grafana
    
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://api.wealist.co.kr/monitoring
      - GF_SERVER_SERVE_FROM_SUB_PATH=true  
      - GF_INSTALL_PLUGINS=redis-datasource

    volumes:
      - /home/ubuntu/wealist/grafana/data:/var/lib/grafana  # Named Volume 대신 로컬 경로
      - /home/ubuntu/wealist/grafana/logs:/var/log/grafana   # Named Volume 대신 로컬 경로


    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:2.9.0
    container_name: wealist-loki
    hostname: loki
    user: "0:0"
    command: -config.file=/etc/loki/local-config.yaml

    ports:
      - "${LOKI_PORT:-3100}:3100"

    volumes:
      - /home/ubuntu/wealist/loki/config:/etc/loki:ro
      - /home/ubuntu/wealist/loki/data:/loki  # Named Volume 대신 로컬 경로


    networks:
      - monitoring-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  promtail:
    image: grafana/promtail:2.9.0
    container_name: wealist-promtail
    hostname: promtail

    volumes:
      - /home/ubuntu/wealist/promtail/config:/etc/promtail:ro  # 하드코딩된 경로 사용
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    
    command: -config.file=/etc/promtail/config/promtail.yml

    networks:
      - monitoring-net

    restart: unless-stopped
    
    depends_on:
      - loki
  # --- [RDS Exporter 추가] ---
  rds-exporter:
    image: ${RDS_EXPORTER_IMAGE:-qonto/prometheus-rds-exporter:latest}
    container_name: wealist-rds-exporter
    hostname: rds-exporter
    
    environment:
      # CloudWatch API 접근을 위한 리전 설정
      # 이 Exporter는 CloudWatch API를 호출하므로, 
      # EC2 인스턴스에 AWS 자격 증명(IAM Role)이 부여되어 있어야 합니다.
      - AWS_DEFAULT_REGION=${AWS_REGION} 
      
      # 옵션: DB 인스턴스 식별을 위한 태그 필터 (모든 RDS 인스턴스를 모니터링하려면 생략)
      # - RDS_EXPORTER_TAGS="Environment=production"

    volumes:
      # /etc/localtime: 컨테이너와 호스트의 시간 동기화 (옵션)
      - /etc/localtime:/etc/localtime:ro
      
    ports:
      # ${RDS_EXPORTER_PORT} 변수를 사용하여 호스트 포트 바인딩
      - "${RDS_EXPORTER_PORT}:9042" 
      
    networks:
      - monitoring-net
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9042/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --- [Elasticsearch Exporter 추가] ---
  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
    container_name: wealist-elasticsearch-exporter
    hostname: elasticsearch-exporter
    
    command:
      # ES 클러스터의 주소 설정 (SSM에서 로드된 변수 사용)
      - --es.uri=${ES_URI}
      # HTTP 인증이 필요한 경우 주석 해제 (ES_USERNAME, ES_PASSWORD 변수 필요)
      # - --es.username=${ES_USERNAME} 
      # - --es.password=${ES_PASSWORD}
      
    ports:
      # ${ELASTIC_EXPORTER_PORT} 변수를 사용하여 호스트 포트 바인딩
      - "${ELASTIC_EXPORTER_PORT}:9114" 
      
    networks:
      - monitoring-net
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9114/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: wealist-node-exporter
    hostname: node-exporter
    
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
      
    networks:
      - monitoring-net
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  monitoring-net:
    driver: bridge
    name: wealist-monitoring-net

volumes:
  prometheus-data:
    name: wealist-prometheus-data
    driver: local

  loki-data:
    name: wealist-loki-storage
    driver: local

  grafana-storage:
    name: wealist-grafana-storage
    driver: local

  grafana-logs:
    name: wealist-grafana-logs
    driver: local