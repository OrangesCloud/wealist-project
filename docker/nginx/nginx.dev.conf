server {
    listen 80;
    server_name localhost;

    # CORS 설정을 위한 Preflight 요청 허용 (로컬 개발용)
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # 모든 API 요청에 대해 CORS 헤더 추가 (개발 편의성)
    add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;


    # =========================================================================
    # User Service (Spring Boot) Proxy
    # 요청: /api/users/... -> user-service:8080/api/... (Context Path 변경)
    # =========================================================================
    location /api/users/ { 
        
        # ⭐️ [수정] /api/users/ 부분을 제거하고, /api/를 다시 붙여서 백엔드로 전달
        # 예: /api/users/workspaces/all -> /api/workspaces/all
        rewrite /api/users/(.*) /$1 break;
        
        # proxy_pass는 내부 서비스 주소만 지정합니다. (rewrite가 경로를 설정)
        proxy_pass http://user-service:8080; 
        
        # 기본 프록시 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }


    # =========================================================================
    # Board Service (Go) Proxy
    # 요청: /api/boards/... -> board-service:8000/api/... (Context Path 변경)
    # =========================================================================
    location /api/boards/ { 
        
        # ⭐️ [수정] /api/boards/ 부분을 제거하고, /api/를 다시 붙여서 백엔드로 전달
        rewrite /api/boards/(.*) /$1 break;
        
        proxy_pass http://board-service:8000; 

        # 기본 프록시 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }


    # Health check endpoint (ALB와 동일한 구조)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # =========================================================================
    # 기본 경로 설정
    # =========================================================================
    location / {
        # API 경로와 Health Check 경로 외의 요청은 404 처리
        return 404;
    }
}