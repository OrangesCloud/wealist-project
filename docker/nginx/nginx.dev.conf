server {
    listen 80;
    server_name localhost;

    # ==========================================================
    # 1. 모든 API 경로에서 CORS 헤더를 설정하고 Preflight 요청 처리
    # 🚨 수정: if와 add_header의 복잡한 사용을 피하고, 
    #         모든 API 관련 location에서 이 블록을 상속받도록 처리합니다.
    # ==========================================================
    
    # 이 upstream을 모든 API location에서 상속받아 CORS 처리를 통일합니다.
    location / {
        # 일반 응답에 CORS 헤더를 추가합니다.
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-CSRF-Token';
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # OPTIONS 요청 시 즉시 204 응답을 반환합니다.
        if ($request_method = 'OPTIONS') {
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # API 경로에 해당하지 않는 요청은 404 처리
        return 404;
    }


    # =========================================================================
    # User Service (Spring Boot) Proxy
    # =========================================================================
    location /api/users/ { 
        # CORS 처리를 상위 location에서 했으므로 추가 헤더는 생략합니다.
        
        # Spring Boot의 Context Path가 없는 경우
        rewrite /api/users/(.*) /$1 break; 
        proxy_pass http://user-service:8080; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }


    # =========================================================================
    # Board Service (Go) Proxy
    # =========================================================================
    location /api/boards/ { 

        # Spring Boot의 Context Path가 없는 경우
        rewrite /api/boards/(.*) /$1 break; 
        # Board Service 404 문제 해결을 위해 rewrite 제거 (경로 유지)
        proxy_pass http://board-service:8000; 

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # 💡 Auth API 프록시 (user-service로 간다고 가정)
    location /api/auth/ { 
        rewrite /api/auth/(.*) /$1 break; 
        proxy_pass http://user-service:8080; 
        
        proxy_set_header Host $host;
    }


    # Health check endpoint (CORS 헤더가 필요 없으므로 별도로 처리)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}