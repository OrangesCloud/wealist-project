  user-service:
    env_file:
      - ./.env
    image: user-service:latest
    container_name: wealist-user-service
    hostname: user-service
    
    environment:
      
      # JWT 설정
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-3600000}
      JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      
      # AWS S3 설정
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      
      # OAuth2 설정
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH2_CLIENT_REDIRECT_URI: ${OAUTH2_CLIENT_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
      OAUTH2_REDIRECT_URL_ENV: ${OAUTH2_REDIRECT_URL_ENV:-http://localhost:3000/oauth/callback}
      
      # Redis 설정 (선택적)
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      
      # 기타 설정
      APP_NAME: ${APP_NAME:-wealist-user}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT:-8080}
      BOARD_SERVICE_URL: ${BOARD_SERVICE_URL:-http://board-service:8081}
      SAMPLE_DATA_ENABLED: ${SAMPLE_DATA_ENABLED:-false}
      
      # Spring 프로파일
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    

    ports:
      - "${USER_SERVICE_HOST_PORT:-8080}:8080"

    networks:
      - wealist-net


    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

    # 파일 업로드용 볼륨 (선택적)
    volumes:
      - user-upload-data:/app/upload

volumes:
  # postgres-data:
  user-upload-data:

networks:
  wealist-net:
    driver: bridge