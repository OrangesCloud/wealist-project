version: 0.0
os: linux
files:
  # 프로젝트 루트 디렉토리를 /home/ubuntu/wealist/ 에 복사합니다.
  - source: /appspec.yml
    destination: /home/ubuntu/wealist/user-service/
  - source: /user-service/deploy.script/
    destination: /home/ubuntu/wealist/user-service/deploy.script/
  - source: /docker/compose/docker-compose.ec2-prod.yml
    destination: /home/ubuntu/wealist/docker/compose/
permissions:
  - object: /home/ubuntu/wealist/
    pattern: "**"
    owner: ubuntu
    group: ubuntu
hooks:
  BeforeInstall:
    # 1. 기존 컨테이너 중지 및 이미지 정리
    - location: user-service/deploy.script/deploy-cleanup.sh
      timeout: 60
      runas: ubuntu
  ApplicationStart:
    # 2. SSM 변수 로드 후 Docker Compose 실행 (핵심 배포 로직)
    - location: user-service/deploy.script/deploy-app-start.sh
      timeout: 300
      runas: ubuntu
  ValidateService:
    # 3. 헬스 체크
    - location: user-service/deploy.script/deploy-health-check.sh
      timeout: 180
      runas: ubuntu
