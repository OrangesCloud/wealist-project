name: CD - Dev User Service

on:
  # 1. 인프라 변경 시 직접 실행
  push:
    branches:
      - deploy-dev
    paths:
      - "docker/compose/docker-compose.ec2-dev.yml"
      - ".github/workflows/cd-dev-user-service.yml"

  # 2. 수동 실행 (강제 재배포)
  workflow_dispatch:
    inputs:
      reason:
        description: "배포 사유 (선택)"
        required: false
        type: string

env:
  AWS_REGION: ap-northeast-2
  PARAMETER_PREFIX: /wealist/dev
  COMPOSE_FILE: /home/ubuntu/wealist/docker/compose/docker-compose.ec2-dev.yml
  EC2_INSTANCE_ID: i-000f35cf67afa3c33

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    environment: development
    steps:
      # ============================================
      # 1. 코드 체크아웃
      # ============================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ============================================
      # 2. AWS Credentials 설정
      # ============================================
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.WEALIST_DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WEALIST_DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================
      # 3. ECR 로그인
      # ============================================
      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================
      # 4. docker-compose 파일을 EC2에 복사
      # ============================================
      - name: 📦 Upload docker-compose file to EC2
        run: |
          echo "📦 Uploading docker-compose file to EC2..."

          # docker-compose 파일을 Base64로 인코딩
          COMPOSE_CONTENT=$(base64 -w 0 docker/compose/docker-compose.ec2-dev.yml)

          # SSM으로 파일 전송
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Upload docker-compose file - ${{ github.sha }}" \
            --timeout-seconds 60 \
            --parameters commands="[
              \"echo 'Uploading docker-compose file...'\",
              \"mkdir -p /home/ubuntu/wealist/docker/compose\",
              \"echo '${COMPOSE_CONTENT}' | base64 -d > /home/ubuntu/wealist/docker/compose/docker-compose.ec2-dev.yml\",
              \"chown ubuntu:ubuntu /home/ubuntu/wealist/docker/compose/docker-compose.ec2-dev.yml\",
              \"echo '✅ docker-compose file uploaded successfully'\",
              \"ls -lh /home/ubuntu/wealist/docker/compose/docker-compose.ec2-dev.yml\"
            ]" \
            --output text \
            --query "Command.CommandId")

          echo "⏳ Waiting for file upload..."
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"

          echo "✅ docker-compose file uploaded"

      # ============================================
      # 5. SSM Run Command로 배포 실행
      # ============================================
      - name: 🚀 Deploy via SSM Run Command
        id: deploy
        run: |
          echo "📋 Deployment Configuration:"
          echo "  - Instance ID: ${{ env.EC2_INSTANCE_ID }}"
          echo "  - AWS Region: ${{ env.AWS_REGION }}"
          echo "  - Commit SHA: ${{ github.sha }}"
          echo ""

          # 배포 스크립트를 heredoc으로 생성
          cat > /tmp/deploy-user.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail

          echo "🚀 User Service Deployment Started"

          # 환경 변수 로드
          export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          export AWS_REGION=ap-northeast-2
          export PARAMETER_PREFIX=/wealist/dev

          load_param() {
            aws ssm get-parameter --name "${PARAMETER_PREFIX}/$1" --query 'Parameter.Value' --output text --region ${AWS_REGION}
          }

          load_secret() {
            aws ssm get-parameter --name "${PARAMETER_PREFIX}/$1" --with-decryption --query 'Parameter.Value' --output text --region ${AWS_REGION}
          }
          # ===============================================
          # 1. 시크릿 및 DB 환경 변수 로드 (기존 로직)
          # ===============================================
          # 환경 변수 로드
          export POSTGRES_SUPERUSER=$(load_param "db/postgres_superuser")
          export POSTGRES_SUPERUSER_PASSWORD=$(load_secret "db/postgres_superuser_password")
          export USER_DB_NAME=$(load_param "db/user_db_name")
          export USER_DB_USER=$(load_param "db/user_db_user")
          export USER_DB_PASSWORD=$(load_secret "db/user_db_password")
          export BOARD_DB_NAME=$(load_param "db/board_db_name")
          export BOARD_DB_USER=$(load_param "db/board_db_user")
          export BOARD_DB_PASSWORD=$(load_secret "db/board_db_password")
          export REDIS_PASSWORD=$(load_secret "cache/redis_password")
          export JWT_SECRET=$(load_secret "jwt/jwt_secret")
          export GOOGLE_CLIENT_ID=$(load_secret "oauth/google_client_id")
          export GOOGLE_CLIENT_SECRET=$(load_secret "oauth/google-client-secret")
          export GRAFANA_ADMIN_USER=$(load_param "monitor/grafana_admin_user")
          export GRAFANA_ADMIN_PASSWORD=$(load_secret "monitor/grafana_admin_password")

          # ===============================================
          # 2. 🚨 OAuth/URL 환경 변수 추가 (새로운 로직)
          # ===============================================
          # Spring Security Client Redirect Base URL (예: https://api.wealist.co.kr)
          export OAUTH2_CLIENT_REDIRECT_BASE=$(load_param "url/api_base_domain")
          # OAuth Success Handler 최종 Redirect URL (예: https://wealist.co.kr/oauth/callback)
          export OAUTH2_REDIRECT_URL_ENV=$(load_param "url/front_redirect_domain")
          export SPRING_PROFILES_ACTIVE="aws" # AWS 프로파일 활성화

          echo "✅ Parameters loaded, Profiles set to aws"
          echo "   - OAUTH2_CLIENT_REDIRECT_BASE=${OAUTH2_CLIENT_REDIRECT_BASE}"
          echo "   - OAUTH2_REDIRECT_URL_ENV=${OAUTH2_REDIRECT_URL_ENV}"


          # ECR 로그인
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

          # 이미지 Pull
          docker pull ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/wealist-dev-user-service:latest

          # Docker Compose 명령어 결정
          if docker compose version &> /dev/null; then
            COMPOSE_CMD="docker compose"
          else
            COMPOSE_CMD="docker-compose"
          fi

          # 컨테이너 재시작
          COMPOSE_FILE=/home/ubuntu/wealist/docker/compose/docker-compose.ec2-dev.yml
          $COMPOSE_CMD -f ${COMPOSE_FILE} up -d --force-recreate user-service

          # Health Check (context path 적용)
          echo "🏥 Health check..."
          sleep 15
          for i in {1..15}; do
            if curl -f http://localhost:8080/api/users/actuator/health > /dev/null 2>&1; then
              echo "✅ User service is healthy!"
              docker image prune -f
              exit 0
            fi
            echo "⏳ Waiting... ($i/15)"
            sleep 5
          done

          echo "❌ Health check failed!"
          $COMPOSE_CMD -f ${COMPOSE_FILE} logs --tail=50 user-service
          exit 1
          EOF

          chmod +x /tmp/deploy-user.sh

          # 스크립트를 Base64로 인코딩 (특수문자 안전하게 전송)
          echo "📦 Encoding deployment script..."
          SCRIPT_BASE64=$(base64 -w 0 /tmp/deploy-user.sh)
          echo "✅ Script encoded (${#SCRIPT_BASE64} bytes)"
          echo ""

          # SSM Run Command 실행
          echo "🚀 Sending command to EC2 instance..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy User Service - ${{ github.sha }}" \
            --timeout-seconds 300 \
            --parameters commands="[
              \"echo '=== Deployment Script Received ===' \",
              \"echo 'Timestamp: \$(date)' \",
              \"echo 'Instance ID: \$(ec2-metadata --instance-id 2>/dev/null || echo 'N/A')' \",
              \"echo '' \",
              \"echo '${SCRIPT_BASE64}' | base64 -d > /tmp/deploy.sh\",
              \"chmod +x /tmp/deploy.sh\",
              \"echo '🚀 Starting deployment script execution...' \",
              \"/tmp/deploy.sh 2>&1 | tee /tmp/deploy.log\",
              \"DEPLOY_EXIT_CODE=\${PIPESTATUS[0]}\",
              \"echo '' \",
              \"echo '=== Deployment Script Finished ===' \",
              \"echo 'Exit Code: '\$DEPLOY_EXIT_CODE \",
              \"rm -f /tmp/deploy.sh\",
              \"exit \$DEPLOY_EXIT_CODE\"
            ]" \
            --output text \
            --query "Command.CommandId")

          if [ -z "$COMMAND_ID" ]; then
            echo "❌ Failed to send SSM command - no Command ID returned"
            exit 1
          fi

          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Command sent successfully"
          echo "📝 Command ID: ${COMMAND_ID}"
          echo ""

      # ============================================
      # 6. 배포 결과 대기
      # ============================================
      - name: ⏳ Wait for Deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command-id }}"
          INSTANCE_ID="${{ env.EC2_INSTANCE_ID }}"

          echo "⏳ Waiting for deployment to complete..."
          echo "  - Command ID: ${COMMAND_ID}"
          echo "  - Instance ID: ${INSTANCE_ID}"
          echo ""

          # 명령어 실행 대기 (최대 5분)
          echo "⏳ Polling command status..."
          MAX_WAIT=60  # 5분 (5초 간격)
          WAIT_COUNT=0
          LAST_OUTPUT_LINE=""

          while [ $WAIT_COUNT -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            # 30초마다 현재 출력 확인 (진행 상황 표시)
            if [ $((WAIT_COUNT % 6)) -eq 0 ]; then
              CURRENT_OUTPUT=$(aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardOutputContent" \
                --output text 2>/dev/null | tail -1)
              
              if [ "$CURRENT_OUTPUT" != "$LAST_OUTPUT_LINE" ] && [ -n "$CURRENT_OUTPUT" ]; then
                echo "  [$((WAIT_COUNT * 5))s] Status: ${STATUS} | Last output: ${CURRENT_OUTPUT}"
                LAST_OUTPUT_LINE="$CURRENT_OUTPUT"
              else
                echo "  [$((WAIT_COUNT * 5))s] Status: ${STATUS}"
              fi
            fi
            
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              break
            fi
            
            sleep 5
            WAIT_COUNT=$((WAIT_COUNT + 1))
          done

          # 타임아웃 체크
          if [ $WAIT_COUNT -ge $MAX_WAIT ]; then
            echo ""
            echo "⚠️  Polling timeout reached (5 minutes)"
            echo "   Command may still be running on EC2"
            echo "   Check SSM command status manually:"
            echo "   aws ssm get-command-invocation --command-id ${COMMAND_ID} --instance-id ${INSTANCE_ID}"
          fi

          echo ""
          echo "📊 Final Status: ${STATUS}"
          echo ""

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment failed with status: ${STATUS}"
            echo ""
            echo "📋 Error Output:"
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "StandardErrorContent" \
              --output text
            echo ""
            echo "📋 Standard Output:"
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "StandardOutputContent" \
              --output text
            exit 1
          fi

          echo "✅ Deployment completed successfully!"

      # ============================================
      # 7. 배포 로그 출력
      # ============================================
      - name: 📋 Show Deployment Logs
        if: always()
        run: |
          echo "📋 Full Deployment Output:"
          echo "================================"
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command-id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text || echo "⚠️  Could not retrieve output"
          echo ""
          echo "================================"

      # ============================================
      # 8. Summary
      # ============================================
      - name: 📊 Deployment Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"

          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            TITLE="User Service Deployed Successfully"
          else
            ICON="❌"
            TITLE="User Service Deployment Failed"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ${ICON} ${TITLE}

          - **Commit:** \`${{ github.sha }}\`
          - **Instance:** \`${{ env.EC2_INSTANCE_ID }}\`
          - **Command ID:** \`${{ steps.deploy.outputs.command-id }}\`
          - **Status:** ${STATUS}
          - **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          #### Quick Links
          - [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          - [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
