name: CD - Dev User Service

on:
  # 1. CI 성공 시 자동 실행
  workflow_run:
    workflows: ["CI - Dev User Service"]
    types:
      - completed

  # 2. 인프라 변경 시 직접 실행
  push:
    branches:
      - deploy-dev
    paths:
      - "docker/compose/docker-compose.ec2-dev.yml"
      - ".github/workflows/cd-dev-user-service.yml"

  # 3. 수동 실행 (강제 재배포)
  workflow_dispatch:
    inputs:
      reason:
        description: "배포 사유 (선택)"
        required: false
        type: string

env:
  AWS_REGION: ap-northeast-2
  PARAMETER_PREFIX: /wealist/dev
  COMPOSE_FILE: /home/ubuntu/wealist/docker/compose/docker-compose.ec2-dev.yml

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    # workflow_run이면 성공 확인, 아니면 바로 실행
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment: development
    steps:
      # ============================================
      # 0. 🚀 워크플로우 이름 동적 변경 (추가할 부분)
      # ============================================
      - name: 📝 Update Workflow Run Name with Commit Message
        uses: actions/github-script@v7
        if: github.event_name == 'workflow_run'
        with:
          script: |
            // 1. 트리거가 된 CI 워크플로우의 정보를 가져옵니다.
            const triggered_workflow = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }}
            });

            // 2. 해당 CI 워크플로우의 커밋 SHA와 메시지를 가져옵니다.
            const head_sha = triggered_workflow.data.head_sha;
            const commit_info = await github.request('GET /repos/{owner}/{repo}/commits/{commit_sha}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: head_sha
            });

            const commit_message = commit_info.data.commit.message.split('\n')[0].trim();
            const short_sha = head_sha.substring(0, 7);

            // 3. 현재 CD 워크플로우 실행의 이름을 업데이트합니다.
            const new_name = `CD: ${commit_message} (${short_sha})`;
            console.log(`Setting workflow name to: ${new_name}`);

            await github.request('PATCH /repos/{owner}/{repo}/actions/runs/{run_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              name: new_name
            });
      # ============================================
      # 1. 코드 체크아웃
      # ============================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ============================================
      # 2. AWS Credentials 설정
      # ============================================
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.WEALIST_DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WEALIST_DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================
      # 3. ECR 로그인
      # ============================================
      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================
      # 4. 배포 스크립트 준비 - Board Service와 동일한 방식 사용
      # ============================================
      - name: 📝 Prepare Deployment Script
        id: script
        run: |
          echo "✅ Using inline SSM command (no separate script file needed)"

      # ============================================
      # 5. SSM Run Command로 배포 실행 - 수정 제안
      # ============================================
      - name: 🚀 Deploy via SSM Run Command
        id: deploy
        env:
          EC2_INSTANCE_ID: i-000f35cf67afa3c33 # 이 변수를 사용합니다.
        run: |
          # ... (스크립트 생성 및 base64 인코딩 부분은 그대로 유지) ...

          # SSM으로 스크립트 전송 및 실행
          SCRIPT_CONTENT=$(cat /tmp/deploy-user.sh | base64 -w 0)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '${SCRIPT_CONTENT}' | base64 -d > /tmp/deploy.sh\",\"chmod +x /tmp/deploy.sh\",\"/tmp/deploy.sh\"]" \
            --region ${{ env.AWS_REGION }} \
            --output text \
            --query "Command.CommandId")

          # 획득한 Command ID를 GitHub Actions 출력으로 내보냄 (한 번만)
          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ SSM Command ID: ${COMMAND_ID}"

          # 명령 완료 대기
          echo "⏳ Waiting for deployment..."
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }}

          # 결과 확인 (이후 불필요한 중복 코드 제거)
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment failed: $STATUS"
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1 # 실패 시 여기서 워크플로우를 종료
          fi

          echo "✅ Deployment successful!"
          # 성공 시 스크립트는 자동으로 exit 0 처리되어 다음 Step으로 넘어갑니다.

      # ============================================
      # 6. 배포 로그 출력
      # ============================================
      - name: 📋 Show Deployment Logs
        if: always()
        env:
          EC2_INSTANCE_ID: i-000f35cf67afa3c33
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command-id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

      # ============================================
      # 7. Summary
      # ============================================
      - name: 📊 Deployment Summary
        env:
          EC2_INSTANCE_ID: i-000f35cf67afa3c33
        run: |
          echo "### ✅ User Service Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance:** \`${{ env.EC2_INSTANCE_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Command:** \`${{ steps.deploy.outputs.command-id }}\`" >> $GITHUB_STEP_SUMMARY
