name: CD - Enhanced Monitoring Stack (Complete Fixed)

on:
  push:
    branches:
      - deploy-prod
    paths:
      - "prometheus/**"
      - "loki/**"
      - "promtail/**"
      - "rds-exporter/**"
      - "docker/compose/docker-compose.ec2-prod-monitoring.yml"
      - ".github/workflows/cd-prod-monitoring2.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  deploy-enhanced-monitoring:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::290008131187:role/wealist-prod-github-actions-role
          role-session-name: GitHubActions-Monitoring-${{ github.run_id }}
          aws-region: ap-northeast-2

      - name: 🔍 Verify OIDC and Load Configuration
        id: config
        run: |
          echo "🔍 Verifying OIDC connection and loading configuration..."

          # OIDC Role Assume 성공 여부와 신원 확인
          echo "Current AWS Identity (Check for assumed-role/):"
          PRINCIPAL_ARN=$(aws sts get-caller-identity --query "Arn" --output text)
          echo "$PRINCIPAL_ARN"
          
          if [[ "$PRINCIPAL_ARN" != *"assumed-role/wealist-prod-github-actions-role"* ]]; then
            echo "❌ OIDC authentication failed - not using expected role"
            exit 1
          fi
          echo "✅ OIDC verified successfully"

          # Load base configuration with error handling
          set +e

          EC2_ID=$(aws ssm get-parameter \
            --name "/wealist/prod/cd/ec2_instance_id" \
            --query "Parameter.Value" \
            --output text \
            --with-decryption 2>&1)

          COMPOSE_DIR=$(aws ssm get-parameter \
            --name "/wealist/prod/monitor/compose_file_path" \
            --query "Parameter.Value" \
            --output text 2>&1)

          PARAM_PREFIX=$(aws ssm get-parameter \
            --name "/wealist/prod/cd/parameter_prefix" \
            --query "Parameter.Value" \
            --output text 2>&1)

          set -e

          # Handle parameter not found cases with defaults
          if [[ "$EC2_ID" == *"ParameterNotFound"* ]] || [ -z "$EC2_ID" ]; then
            echo "❌ EC2 Instance ID parameter not found: /wealist/prod/cd/ec2_instance_id"
            exit 1
          fi

          if [[ "$COMPOSE_DIR" == *"ParameterNotFound"* ]]; then
            echo "⚠️ Using default compose directory"
            COMPOSE_DIR="/home/ubuntu/wealist/docker/compose"
          fi

          if [[ "$PARAM_PREFIX" == *"ParameterNotFound"* ]]; then
            echo "⚠️ Using default parameter prefix"
            PARAM_PREFIX="/wealist/prod"
          fi

          echo "ec2-instance-id=$EC2_ID" >> $GITHUB_OUTPUT
          echo "compose-file-path=$COMPOSE_DIR" >> $GITHUB_OUTPUT
          echo "parameter-prefix=$PARAM_PREFIX" >> $GITHUB_OUTPUT

          echo "✅ Configuration loaded:"
          echo "  EC2 Instance ID: $EC2_ID"
          echo "  Compose Directory: $COMPOSE_DIR"
          echo "  Parameter Prefix: $PARAM_PREFIX"

      - name: 🔍 Comprehensive SSM Diagnosis
        run: |
          echo "🔍 === SSM 연결 진단 시작 ==="
          
          # 1. EC2 인스턴스 기본 정보 확인
          echo "📋 EC2 Instance Information:"
          aws ec2 describe-instances \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --region ap-northeast-2 \
            --query 'Reservations[0].Instances[0].{InstanceId:InstanceId,State:State.Name,InstanceType:InstanceType,LaunchTime:LaunchTime,IamInstanceProfile:IamInstanceProfile,SecurityGroups:SecurityGroups[].GroupName}' \
            --output table

          # 2. SSM 에이전트 연결 상태 확인
          echo ""
          echo "📋 SSM Agent Status:"
          SSM_INFO=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ steps.config.outputs.ec2-instance-id }}" \
            --region ap-northeast-2 \
            --output table 2>/dev/null || echo "NOTFOUND")
          
          if [ "$SSM_INFO" = "NOTFOUND" ]; then
            echo "❌ Instance not found in SSM"
            echo "💡 해결 방법:"
            echo "   1. EC2 인스턴스에 SSM Agent 설치: sudo yum install -y amazon-ssm-agent"
            echo "   2. SSM Agent 시작: sudo systemctl start amazon-ssm-agent"
            echo "   3. EC2에 SSM 권한이 있는 IAM Role 연결 필요"
            exit 1
          else
            echo "$SSM_INFO"
          fi

          # 3. 최근 SSM 명령 히스토리 확인
          echo ""
          echo "📋 Recent SSM Commands (last 5):"
          aws ssm list-commands \
            --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
            --max-items 5 \
            --region ap-northeast-2 \
            --query 'Commands[].{CommandId:CommandId,Status:Status,RequestedDateTime:RequestedDateTime,Comment:Comment}' \
            --output table 2>/dev/null || echo "No recent commands found"

          # 4. EC2 IAM Role 권한 확인
          echo ""
          echo "📋 EC2 IAM Instance Profile:"
          INSTANCE_PROFILE=$(aws ec2 describe-instances \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --region ap-northeast-2 \
            --query 'Reservations[0].Instances[0].IamInstanceProfile.Arn' \
            --output text 2>/dev/null || echo "None")
          
          if [ "$INSTANCE_PROFILE" = "None" ] || [ -z "$INSTANCE_PROFILE" ]; then
            echo "❌ No IAM Instance Profile attached to EC2"
            echo "💡 EC2 인스턴스에 SSM 권한이 있는 IAM Role을 연결해야 합니다"
            exit 1
          else
            echo "✅ IAM Instance Profile: $INSTANCE_PROFILE"
          fi

          # 5. SSM 서비스 상태 확인
          echo ""
          echo "📋 Testing SSM connectivity..."
          
          # 간단한 ping 테스트
          PING_RESULT=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "SSM Connectivity Test" \
            --timeout-seconds 60 \
            --parameters 'commands=["echo \"SSM Test: $(date)\"","whoami","pwd"]' \
            --region ap-northeast-2 \
            --output text \
            --query "Command.CommandId" 2>/dev/null || echo "FAILED")

          if [ "$PING_RESULT" = "FAILED" ]; then
            echo "❌ Cannot send SSM commands to instance"
            exit 1
          else
            echo "📋 Test command sent: $PING_RESULT"
            
            # 잠시 대기 후 결과 확인
            sleep 45
            
            TEST_STATUS=$(aws ssm get-command-invocation \
              --command-id "$PING_RESULT" \
              --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
              --region ap-northeast-2 \
              --query "Status" \
              --output text 2>/dev/null || echo "Unknown")
            
            echo "📋 Test command status: $TEST_STATUS"
            
            if [ "$TEST_STATUS" = "Success" ]; then
              echo "✅ SSM connectivity confirmed"
              
              echo "📋 Test output:"
              aws ssm get-command-invocation \
                --command-id "$PING_RESULT" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --region ap-northeast-2 \
                --query "StandardOutputContent" \
                --output text 2>/dev/null || echo "No output"
                
            else
              echo "❌ SSM test failed with status: $TEST_STATUS"
              
              # 에러 정보 출력
              echo "📋 Test command output:"
              aws ssm get-command-invocation \
                --command-id "$PING_RESULT" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --region ap-northeast-2 \
                --query "StandardOutputContent" \
                --output text 2>/dev/null || echo "No output"
              
              echo "📋 Test command errors:"
              aws ssm get-command-invocation \
                --command-id "$PING_RESULT" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --region ap-northeast-2 \
                --query "StandardErrorContent" \
                --output text 2>/dev/null || echo "No errors"
              
              exit 1
            fi
          fi
          
          echo "✅ === SSM 진단 완료 - 모든 검사 통과 ==="

      - name: 📄 Create Command Wait Helper
        run: |
          cat << 'WAIT_SCRIPT' > wait_for_command.sh
          #!/bin/bash
          COMMAND_ID="$1"
          INSTANCE_ID="$2"
          MAX_WAIT=300
          WAIT_TIME=0
          
          echo "⏳ Waiting for command $COMMAND_ID to complete..."
          
          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ap-northeast-2 \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "⏳ Command $COMMAND_ID: $STATUS (${WAIT_TIME}s)"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Command completed successfully"
              
              echo "📋 Command output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ap-northeast-2 \
                --query "StandardOutputContent" \
                --output text 2>/dev/null | tail -10
              return 0
              
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Command failed with status: $STATUS"
              
              echo "📋 Command output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ap-northeast-2 \
                --query "StandardOutputContent" \
                --output text 2>/dev/null || echo "No output"
                
              echo "📋 Error details:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ap-northeast-2 \
                --query "StandardErrorContent" \
                --output text 2>/dev/null || echo "No error details"
              return 1
            fi
            
            sleep 15
            WAIT_TIME=$((WAIT_TIME + 15))
          done
          
          echo "❌ Command timed out after ${MAX_WAIT} seconds"
          return 1
          WAIT_SCRIPT
          
          chmod +x wait_for_command.sh

      - name: 🚀 Deploy via Optimized SSM Commands
        id: deploy
        run: |
          echo "📦 Preparing optimized deployment..."

          # 1단계: 기본 설정 및 정리
          echo "🧹 Step 1: Cleanup and Setup"
          CLEANUP_CMD=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Cleanup and Setup - ${{ github.sha }}" \
            --timeout-seconds 300 \
            --parameters commands='[
              "echo \"=== Monitoring Stack Cleanup Started ===\" ",
              "echo \"Timestamp: $(date)\" ",
              "echo \"Stopping existing containers...\" ",
              "sudo docker stop $(sudo docker ps -aq --filter \"name=wealist-\" 2>/dev/null) 2>/dev/null || echo \"No containers to stop\" ",
              "sudo docker rm $(sudo docker ps -aq --filter \"name=wealist-\" 2>/dev/null) 2>/dev/null || echo \"No containers to remove\" ",
              "sudo docker network rm wealist-monitoring-net 2>/dev/null || echo \"Network already removed\" ",
              "sudo docker volume prune -f || true",
              "echo \"Creating directory structure...\" ",
              "sudo mkdir -p /home/ubuntu/wealist/{prometheus/{config,data},grafana/{data,logs},loki/{config,data},promtail/config,rds-exporter/config}",
              "sudo chown -R ec2-user:ec2-user /home/ubuntu/wealist/ 2>/dev/null || sudo chown -R ubuntu:ubuntu /home/ubuntu/wealist/",
              "sudo chown -R 472:472 /home/ubuntu/wealist/grafana/",
              "sudo chown -R 65534:65534 /home/ubuntu/wealist/prometheus/data",
              "sudo mkdir -p ${{ steps.config.outputs.compose-file-path }}",
              "cd ${{ steps.config.outputs.compose-file-path }}",
              "echo \"✅ Cleanup and setup completed\" "
            ]' \
            --region ap-northeast-2 \
            --output text \
            --query "Command.CommandId")

          echo "📋 Cleanup command: $CLEANUP_CMD"
          ./wait_for_command.sh "$CLEANUP_CMD" "${{ steps.config.outputs.ec2-instance-id }}"

          # 2단계: Docker Compose 파일 배포
          echo "📝 Step 2: Deploy Docker Compose File"
          COMPOSE_B64=$(base64 -w 0 docker/compose/docker-compose.ec2-prod-monitoring.yml)
          
          COMPOSE_CMD=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Compose File - ${{ github.sha }}" \
            --timeout-seconds 300 \
            --parameters commands="[
              \"echo '=== Deploying Docker Compose File ===' \",
              \"cd ${{ steps.config.outputs.compose-file-path }}\",
              \"echo '${COMPOSE_B64}' | base64 -d > docker-compose.yml\",
              \"echo 'Docker Compose file size:' \$(wc -c < docker-compose.yml) 'bytes'\",
              \"head -10 docker-compose.yml\",
              \"echo '✅ Docker Compose file deployed' \"
            ]" \
            --region ap-northeast-2 \
            --output text \
            --query "Command.CommandId")

          echo "📋 Compose deployment: $COMPOSE_CMD"
          ./wait_for_command.sh "$COMPOSE_CMD" "${{ steps.config.outputs.ec2-instance-id }}"

          # 3단계: 설정 파일들 배포
          echo "📝 Step 3: Deploy Configuration Files"
          PROM_CFG_B64=$(base64 -w 0 prometheus/config/prometheus-ec2.yml)
          LOKI_CFG_B64=$(base64 -w 0 loki/config/local-config.yaml)
          PROMTAIL_CFG_B64=$(base64 -w 0 promtail/promtail.yml)

          CONFIG_CMD=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Config Files - ${{ github.sha }}" \
            --timeout-seconds 300 \
            --parameters commands="[
              \"echo '=== Deploying Configuration Files ===' \",
              \"echo 'Deploying Prometheus config...'\",
              \"echo '${PROM_CFG_B64}' | base64 -d | sudo tee /home/ubuntu/wealist/prometheus/config/prometheus-ec2.yml > /dev/null\",
              \"echo 'Prometheus config size:' \$(wc -c < /home/ubuntu/wealist/prometheus/config/prometheus-ec2.yml) 'bytes'\",
              \"echo 'Deploying Loki config...'\",
              \"echo '${LOKI_CFG_B64}' | base64 -d | sudo tee /home/ubuntu/wealist/loki/config/local-config.yaml > /dev/null\",
              \"echo 'Loki config size:' \$(wc -c < /home/ubuntu/wealist/loki/config/local-config.yaml) 'bytes'\",
              \"echo 'Deploying Promtail config...'\",
              \"echo '${PROMTAIL_CFG_B64}' | base64 -d | sudo tee /home/ubuntu/wealist/promtail/config/promtail.yml > /dev/null\",
              \"echo 'Promtail config size:' \$(wc -c < /home/ubuntu/wealist/promtail/config/promtail.yml) 'bytes'\",
              \"echo '✅ All config files deployed' \"
            ]" \
            --region ap-northeast-2 \
            --output text \
            --query "Command.CommandId")

          echo "📋 Config deployment: $CONFIG_CMD"
          ./wait_for_command.sh "$CONFIG_CMD" "${{ steps.config.outputs.ec2-instance-id }}"

          # 4단계: 환경변수 및 서비스 시작
          echo "🚀 Step 4: Start Services"
          START_CMD=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Start Services - ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters commands="[
              \"echo '=== Starting Monitoring Services ===' \",
              \"cd ${{ steps.config.outputs.compose-file-path }}\",
              \"echo 'Creating environment file...'\",
              \"cat > .env << 'ENV_EOF'\",
              \"PROMETHEUS_PORT=9090\",
              \"GRAFANA_PORT=3001\",
              \"LOKI_PORT=3100\",
              \"NODE_EXPORTER_PORT=9001\",
              \"RDS_EXPORTER_PORT=9042\",
              \"ELASTIC_EXPORTER_PORT=9114\",
              \"AWS_REGION=ap-northeast-2\",
              \"ES_URI=http://localhost:9200\",
              \"PROMETHEUS_CONFIG_DIR=/home/ubuntu/wealist/prometheus/config\",
              \"LOKI_CONFIG_DIR=/home/ubuntu/wealist/loki/config\",
              \"PROMTAIL_CONFIG_DIR=/home/ubuntu/wealist/promtail/config\",
              \"RDS_CONFIG_DIR=/home/ubuntu/wealist/rds-exporter/config\",
              \"GRAFANA_ADMIN_USER=admin\",
              \"GRAFANA_ADMIN_PASSWORD=admin123\",
              \"RDS_EXPORTER_IMAGE=qonto/prometheus-rds-exporter:latest\",
              \"ENV_EOF\",
              \"echo 'Environment file created. Contents:'\",
              \"cat .env\",
              \"echo 'Validating compose file...'\",
              \"sudo docker-compose config >/dev/null && echo '✅ Compose file valid' || (echo '❌ Compose file invalid' && sudo docker-compose config && exit 1)\",
              \"echo 'Pulling Docker images...'\",
              \"sudo docker-compose pull\",
              \"echo 'Starting containers...'\",
              \"sudo docker-compose up -d --remove-orphans\",
              \"echo 'Waiting for containers to start...'\",
              \"sleep 30\",
              \"echo 'Container status:'\",
              \"sudo docker ps -a\",
              \"echo 'Network status:'\",
              \"sudo docker network ls | grep monitoring || echo 'No monitoring networks found'\",
              \"echo 'Testing service endpoints...'\",
              \"curl -f http://localhost:9090/-/ready && echo '✅ Prometheus ready' || echo '⚠️ Prometheus not ready'\",
              \"curl -f http://localhost:3001/api/health && echo '✅ Grafana ready' || echo '⚠️ Grafana not ready'\",
              \"curl -f http://localhost:9001/metrics >/dev/null && echo '✅ Node Exporter ready' || echo '⚠️ Node Exporter not ready'\",
              \"echo '✅ Services deployment completed' \"
            ]" \
            --region ap-northeast-2 \
            --output text \
            --query "Command.CommandId")

          echo "command-id=${START_CMD}" >> $GITHUB_OUTPUT
          echo "✅ Final deployment command: ${START_CMD}"

      - name: 📊 Monitor Final Deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command-id }}"
          echo "📊 Monitoring final deployment: ${COMMAND_ID}"
          
          MAX_WAIT=600
          WAIT_TIME=0
          
          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
              --region ap-northeast-2 \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "⏳ Final Status: $STATUS (${WAIT_TIME}s elapsed)"
            
            # InProgress일 때 중간 출력 확인
            if [ "$STATUS" = "InProgress" ]; then
              echo "📋 Current progress:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --region ap-northeast-2 \
                --query "StandardOutputContent" \
                --output text 2>/dev/null | tail -5
            fi
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ 🎉 Enhanced monitoring deployment completed!"
              
              # 최종 상태 확인
              echo "📋 Final deployment output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --region ap-northeast-2 \
                --query "StandardOutputContent" \
                --output text
              break
              
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Final deployment failed with status: $STATUS"
              
              echo "📋 Command output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --region ap-northeast-2 \
                --query "StandardOutputContent" \
                --output text
                
              echo "📋 Error output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --region ap-northeast-2 \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            
            sleep 20
            WAIT_TIME=$((WAIT_TIME + 20))
          done
          
          if [ $WAIT_TIME -ge $MAX_WAIT ]; then
            echo "❌ Final deployment timed out after ${MAX_WAIT} seconds"
            exit 1
          fi

      - name: 📋 Deployment Summary
        if: always()
        run: |
          echo "### 🎉 Enhanced Monitoring Stack Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Authentication Method:** 🔐 OIDC (AWS IAM Roles for GitHub Actions)" >> $GITHUB_STEP_SUMMARY
          echo "**Instance ID:** \`${{ steps.config.outputs.ec2-instance-id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Method:** Multi-stage SSM Commands" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🚀 Deployed Services:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Prometheus** (Metrics Collection & Alerting) - Port 9090" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Grafana** (Visualization & Dashboards) - Port 3001" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Loki** (Log Aggregation & Analysis) - Port 3100" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Promtail** (Log Collection Agent)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Node Exporter** (System Metrics) - Port 9001" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **RDS Exporter** (Database Metrics) - Port 9042" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Elasticsearch Exporter** (Search Engine Metrics) - Port 9114" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔧 Configuration Features:**" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-stage deployment with validation at each step" >> $GITHUB_STEP_SUMMARY
          echo "- Automatic cleanup of existing services" >> $GITHUB_STEP_SUMMARY
          echo "- Health checks for all critical services" >> $GITHUB_STEP_SUMMARY
          echo "- Environment-specific values from SSM Parameter Store" >> $GITHUB_STEP_SUMMARY
          echo "- OIDC-based secure authentication (no hardcoded AWS keys)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📊 Access Information:**" >> $GITHUB_STEP_SUMMARY
          echo "- Prometheus: \`http://your-server:9090\`" >> $GITHUB_STEP_SUMMARY
          echo "- Grafana: \`http://your-server:3001\` (admin/admin123)" >> $GITHUB_STEP_SUMMARY
          echo "- Loki: \`http://your-server:3100\`" >> $GITHUB_STEP_SUMMARY