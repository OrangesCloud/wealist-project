name: CI - Prod User Service

on:
  push:
    branches:
      - deploy-prod
    paths:
      - "user-service/**"
      - ".github/workflows/ci-prod-user-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    environment: production

    outputs:
      image-tag: ${{ steps.image-info.outputs.image-tag }}
      full-image: ${{ steps.image-info.outputs.full-image }}
      artifact-name: codedeploy-artifact-${{ steps.image-info.outputs.image-tag }}
      artifact-path: deploy_artifact.zip

    steps:
      # ============================================
      # 1. 코드 체크아웃
      # ============================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ============================================
      # 2. Java 환경 설정 (JDK 21)
      # ============================================
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      # ============================================
      # 3. Gradle 빌드 & 테스트 (Clean 제거, --no-daemon)
      # ============================================
      - name: 🔨 Build with Gradle & Run Tests (Optimized)
        run: |
          cd user-service
          chmod +x gradlew
          # 'clean' 제거, 데몬 비활성화하여 빌드 시간 단축
          ./gradlew build --no-daemon

      # ============================================
      # 4. 테스트 커버리지 리포트 업로드 (유지)
      # ============================================
      - name: 📊 Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-user-service-${{ github.sha }}
          path: user-service/build/reports/jacocoHtml
          retention-days: 7

      # ============================================
      # 5. AWS Credentials 설정 (SSM 의존성 제거 및 vars 사용)
      # ============================================
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.WEALIST_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WEALIST_AWS_SECRET_ACCESS_KEY }}
          # ✅ 오류 수정 및 최적화: vars 컨텍스트에서 AWS_REGION 값을 직접 참조
          aws-region: ${{ vars.AWS_REGION }}

      # ============================================
      # 6. Environment Variables 로드 (Parameter Store 제거 - CI 다이어트)
      # ============================================
      - name: 📥 Load Environment Variables
        id: config
        run: |
          echo "📥 Loading CI configuration from GitHub Environment Variables..."

          # Environment Variable (vars)에서 값을 로드하여 GITHUB_ENV로 승격
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=${{ vars.ECR_REPOSITORY_USER }}" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV 

          echo "✅ Configuration loaded successfully"

      # ============================================
      # 7. 이미지 태그 생성
      # ============================================
      - name: 🏷️ Generate Image Tags
        id: image-info
        run: |
          # env에서 로드된 변수 사용 (AWS_ACCOUNT_ID 오류 수정 반영)
          ECR_REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          FULL_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          LATEST_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest"

          echo "ecr-registry=${ECR_REGISTRY}" >> $GITHUB_OUTPUT
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "full-image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "latest-image=${LATEST_IMAGE}" >> $GITHUB_OUTPUT

      # ============================================
      # 8. Amazon ECR 로그인 & 이미지 빌드 & 푸시 (ECR 캐시 활용)
      # ============================================
      - name: 🐳 Login to ECR, Build and Push Docker Image (Optimized for ECR Cache)
        uses: docker/build-push-action@v5
        with:
          context: user-service # user-service 디렉토리에서 빌드
          push: true
          tags: |
            ${{ steps.image-info.outputs.full-image }}
            ${{ steps.image-info.outputs.latest-image }}
          # ECR 캐시를 사용
          cache-from: type=registry,ref=${{ steps.image-info.outputs.latest-image }}
          cache-to: type=inline
          build-args: |
            CACHEBUST=$(date +%s)

      # ============================================
      # 9. CodeDeploy 아티팩트 생성 및 전달 (신규)
      # ============================================
      - name: 📦 Prepare CodeDeploy Artifact
        run: |
          # 1. CD 배포에 필요한 파일들을 새 폴더에 복사
          mkdir -p deploy_artifact/user-service/deploy.script
          mkdir -p deploy_artifact/docker/compose

          # appspec.yml
          cp user-service/appspec.yml deploy_artifact/appspec.yml 

          # deploy.script/*
          cp user-service/deploy.script/* deploy_artifact/user-service/deploy.script/

          # docker-compose.ec2-prod.yml (Prod 환경 파일 복사)
          cp docker/compose/docker-compose.ec2-prod.yml deploy_artifact/docker-compose.ec2-prod.yml 

          # 2. 아티팩트 ZIP 생성 (CodeDeploy가 S3에서 다운로드할 최종 아티팩트)
          zip -r deploy_artifact.zip deploy_artifact
          echo "✅ CodeDeploy artifact created: deploy_artifact.zip"

      - name: ⬆️ Upload CodeDeploy Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codedeploy-artifact-${{ steps.image-info.outputs.image-tag }}
          path: deploy_artifact.zip
          retention-days: 1

      # ============================================
      # 10. 빌드 결과 요약
      # ============================================
      - name: 📋 Build Summary
        run: |
          echo "### ✅ User Service Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.image-info.outputs.full-image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.image-info.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`${{ steps.image-info.outputs.artifact-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:** CD workflow will use this SHA tag and artifact." >> $GITHUB_STEP_SUMMARY
