name: CI - Prod User Service

on:
  push:
    branches:
      - deploy-prod
    paths:
      - "user-service/**"
      - ".github/workflows/ci-prod-user-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  # ✅ OIDC 토큰을 요청하기 위해 'id-token: write' 권한 추가 (필수)
  id-token: write

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    # environment: production ❌ 제거된 상태 유지

    outputs:
      image-tag: ${{ steps.image-info.outputs.image-tag }}
      # full-image: ${{ steps.image-info.outputs.full-image }} ❌ 아래에서 직접 조합하므로 제거
      artifact-path: deploy_artifact.zip

    steps:
      # ============================================
      # 1. 코드 체크아웃
      # ============================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ============================================
      # 2. Java 환경 설정 (JDK 21)
      # ============================================
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      # ============================================
      # 3. Gradle 빌드 & 테스트 (Clean 제거, --no-daemon)
      # ============================================
      - name: 🔨 Build with Gradle & Run Tests (Optimized)
        run: |
          cd user-service
          chmod +x gradlew
          ./gradlew build --no-daemon

      # ============================================
      # 4. 테스트 커버리지 리포트 업로드
      # ============================================
      - name: 📊 Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-user-service-${{ github.sha }}
          path: user-service/build/reports/jacocoHtml
          retention-days: 7

      # ============================================
      # 5. AWS Credentials 설정 (OIDC Role 기반으로 수정)
      # ============================================
      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # ✅ OIDC Role ARN을 직접 사용하여 권한 위임
          role-to-assume: arn:aws:iam::290008131187:role/wealist-prod-github-actions-role
          aws-region: ${{ vars.AWS_REGION }}

      # ============================================
      # 6. Environment Variables 로드 (ECR 관련)
      # ============================================
      - name: 📥 Load Environment Variables
        id: config
        run: |
          echo "📥 Loading CI configuration from GitHub Environment Variables..."
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=${{ vars.ECR_REPOSITORY_USER }}" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV 
          echo "✅ Configuration loaded successfully"

      # ============================================
      # 7. 이미지 태그 생성 (FULL_IMAGE 변수 생성 방식을 변경)
      # ============================================
      - name: 🏷️ Generate Image Tags
        id: image-info
        run: |
          ECR_REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA:0:7}"

          # ❌ FULL_IMAGE, LATEST_IMAGE 변수 정의 제거 (Step 8에서 직접 조합)
          # ECR_REGISTRY만 출력 변수로 사용
          echo "ecr-registry=${ECR_REGISTRY}" >> $GITHUB_OUTPUT 
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          # echo "full-image=${FULL_IMAGE}" >> $GITHUB_OUTPUT ❌ 제거
          # echo "latest-image=${LATEST_IMAGE}" >> $GITHUB_OUTPUT ❌ 제거

      # ============================================
      # 8. Amazon ECR 로그인 & 이미지 빌드 & 푸시 (태그 직접 조합하여 전달)
      # ============================================
      - name: 🐳 Login to ECR, Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: user-service
          push: true
          # ✅ 최종 수정: 각 태그를 완전한 이미지명 형태로 배열로 전달
          tags: |
            ${{ steps.image-info.outputs.ecr-registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-info.outputs.image-tag }}
            ${{ steps.image-info.outputs.ecr-registry }}/${{ env.ECR_REPOSITORY }}:latest

          cache-to: type=inline
          build-args: |
            CACHEBUST=$(date +%s)
          # cache-from도 직접 조합하여 전달해야 함
          cache-from: type=registry,ref=${{ steps.image-info.outputs.ecr-registry }}/${{ env.ECR_REPOSITORY }}:latest

      # ============================================
      # 9. CodeDeploy 아티팩트 생성 및 S3 업로드
      # ============================================
      - name: 📦 Prepare CodeDeploy Artifact & Upload to S3
        id: s3_upload
        run: |
          # 1. CD 배포에 필요한 파일들을 새 폴더에 복사
          mkdir -p deploy_artifact/user-service/deploy.script
          mkdir -p deploy_artifact/docker/compose

          cp user-service/appspec.yml deploy_artifact/appspec.yml 
          cp user-service/deploy.script/* deploy_artifact/user-service/deploy.script/
          cp docker/compose/docker-compose.ec2-prod.yml deploy_artifact/docker-compose.ec2-prod.yml 

          # 2. 아티팩트 ZIP 생성
          zip -r deploy_artifact.zip deploy_artifact

          # 3. S3 정보 설정
          S3_BUCKET="wealist-codedeploy-artifacts"
          ARTIFACT_FILENAME="user-service-${{ steps.image-info.outputs.image-tag }}.zip"
          S3_KEY="user-service/${ARTIFACT_FILENAME}"

          # 4. AWS S3에 직접 업로드
          aws s3 cp deploy_artifact.zip s3://${S3_BUCKET}/${S3_KEY}

          echo "S3_KEY=$S3_KEY" >> $GITHUB_OUTPUT # CD에서 사용할 S3 KEY를 출력

          echo "✅ CodeDeploy artifact uploaded: s3://${S3_BUCKET}/${S3_KEY}"

      # ============================================
      # 10. 빌드 결과 요약
      # ============================================
      - name: 📋 Build Summary
        run: |
          echo "### ✅ User Service Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.image-info.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Key:** \`${{ steps.s3_upload.outputs.S3_KEY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:** CD workflow will use this S3 Key." >> $GITHUB_STEP_SUMMARY
