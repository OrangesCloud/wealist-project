name: CD - Prod Board Service

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "배포 사유 (선택)"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    name: Deploy to EC2 via CodeDeploy
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # 0. Checkout 코드
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # 1. Environment Variables 로드
      # ============================================
      - name: 📥 Load AWS Region Variable
        id: config_region
        run: |
          echo "✅ AWS Region loaded: ${{ vars.AWS_REGION }}"

      # ============================================
      # 2. AWS Credentials 설정
      # ============================================
      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::290008131187:role/wealist-prod-github-actions-role
          aws-region: ${{ vars.AWS_REGION }}

      # ============================================
      # 3. CodeDeploy 설정 변수 로드
      # ============================================
      - name: 📥 Load CodeDeploy Configuration
        id: config_codedeploy
        run: |
          echo "CODEDEPLOY_APP_NAME=wealist-board-app-codeDeploy" >> $GITHUB_ENV
          echo "CODEDEPLOY_GROUP_NAME=wealist-board-app-codeDeploy-tg" >> $GITHUB_ENV 
          echo "S3_BUCKET=wealist-codedeploy-artifacts" >> $GITHUB_ENV

          echo "✅ CodeDeploy configuration loaded. S3 Bucket: ${{ env.S3_BUCKET }}"

      # ============================================
      # 4. CI 정보 추출 및 S3 Key 계산
      # ============================================
      - name: 🔍 Get CI Info and Calculate S3 Key
        uses: actions/github-script@v7
        id: calculate_key
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-prod-board-service.yml', 
              branch: 'deploy-prod',
              per_page: 1,
              status: 'success'
            });
            const latestRun = runs.workflow_runs[0];

            if (!latestRun) {
                core.setFailed('No successful CI run found. Aborting.');
                return;
            }

            const shaTag = latestRun.head_sha.substring(0, 7);
            const artifactFilename = `board-service-${shaTag}.zip`;
            const s3Key = `board-service/${artifactFilename}`; 

            core.setOutput('sha_tag', shaTag);
            core.setOutput('s3_key', s3Key);

            console.log(`✅ Calculated S3 Key: ${s3Key}`);

      # ============================================
      # 5. CodeDeploy 배포 트리거
      # ============================================
      - name: 🚀 Trigger CodeDeploy Deployment
        id: deploy_trigger
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ env.CODEDEPLOY_GROUP_NAME }} \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --description "Board Service Deployment ${{ steps.calculate_key.outputs.sha_tag }}" \
            --s3-location bucket=${{ env.S3_BUCKET }},key=${{ steps.calculate_key.outputs.s3_key }},bundleType=zip \
            --query "deploymentId" \
            --output text)
            
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "❌ Failed to create CodeDeploy deployment."
            exit 1
          fi

          echo "✅ CodeDeploy Deployment ID: $DEPLOYMENT_ID"

      # ============================================
      # 6. 배포 결과 대기 및 상태 확인
      # ============================================
      - name: ⏳ Wait for CodeDeploy Completion
        run: |
          echo "⏳ Waiting for deployment ${{ env.DEPLOYMENT_ID }} to complete..."
          aws deploy wait deployment-successful --deployment-id ${{ env.DEPLOYMENT_ID }}
          echo "✅ Deployment successful!"

      # ============================================
      # 7. 최종 상태 확인 및 요약
      # ============================================
      - name: 📊 Get Final Status and Summarize
        run: |
          STATUS=$(aws deploy get-deployment --deployment-id ${{ env.DEPLOYMENT_ID }} --query "deploymentInfo.status" --output text)

          ICON="❌"
          TITLE="Deployment Failed (${STATUS})"
          if [ "$STATUS" == "Succeeded" ]; then
            ICON="✅"
            TITLE="Deployment Successful"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ${ICON} ${TITLE}

          - **Service:** Board Service 
          - **Tag:** \`${{ steps.calculate_key.outputs.sha_tag }}\`
          - **Deployment ID:** \`${{ env.DEPLOYMENT_ID }}\`
          - **S3 Location:** \`s3://${{ env.S3_BUCKET }}/${{ steps.calculate_key.outputs.s3_key }}\`
          - **Status:** **${STATUS}**
          - **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          #### CodeDeploy Links
          - [View Deployment in AWS]
          EOF

          if [ "$STATUS" != "Succeeded" ]; then
              exit 1
          fi

      # ============================================
      # 8. 💾 SSM에 배포 버전 기록 (히스토리 추적용) ~
      # ============================================
      - name: 💾 Save Deployed Version to SSM (for history tracking)
        if: success()
        run: |
          DEPLOYED_TAG="${{ steps.calculate_key.outputs.sha_tag }}"
          SSM_PARAM_NAME="/wealist/prod/version/board_service"

          echo "📝 Recording deployed version ${DEPLOYED_TAG} to SSM (for history tracking only)"

          aws ssm put-parameter \
            --name "${SSM_PARAM_NAME}" \
            --value "${DEPLOYED_TAG}" \
            --type "String" \
            --overwrite \
            --region ${{ vars.AWS_REGION }}

          echo "✅ Version history saved to SSM (not used for deployment)"
