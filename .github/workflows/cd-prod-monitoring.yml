name: CD - Enhanced Monitoring Stack

on:
  push:
    branches:
      - deploy-prod
    paths:
      - "prometheus/**"
      - "loki/**"
      - "promtail/**"
      - "rds_exporter/**"
      - "docker/compose/docker-compose.ec2-prod-monitoring.yml"
      - ".github/workflows/cd-prod-monitoring.yml"
  workflow_dispatch:
    inputs:
      skip_docker_install:
        description: 'Skip Docker Compose installation check'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2

    steps:
      # ============================================
      # 0. Checkout
      # ============================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ============================================
      # 1. AWS Credentials (OIDC)
      # ============================================
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::290008131187:role/wealist-prod-github-actions-role
          aws-region: ap-northeast-2

      # ============================================
      # 2. 배포 대상 EC2 인스턴스 찾기
      # ============================================
      - name: 🔍 Find Target EC2 Instance
        id: config
        run: |
          echo "🔍 Finding target EC2 instance..."
          
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:aws:autoscaling:groupName,Values=wealist-prod-monitoring-asg" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text \
            --region "${AWS_REGION}")

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] || [ "$INSTANCE_ID" = "null" ]; then
            echo "❌ No running EC2 instance found in ASG: wealist-prod-monitoring-asg"
            echo "💡 Check if ASG exists and has running instances"
            exit 1
          fi

          echo "✅ Found EC2 Instance: $INSTANCE_ID"
          echo "ec2-instance-id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "parameter-prefix=/wealist/prod" >> $GITHUB_OUTPUT
          echo "compose-dir=/home/ubuntu/wealist/compose" >> $GITHUB_OUTPUT

      # ============================================
      # 3. 설정 파일 검증
      # ============================================
      - name: ✅ Validate Configuration Files
        run: |
          echo "📋 Validating required files..."
          
          REQUIRED_FILES=(
            "docker/compose/docker-compose.ec2-prod-monitoring.yml"
            "prometheus/config/prometheus-prod-ec2.yml"
            "loki/config/local-config.yaml"
            "promtail/config/promtail.yml"
            "rds_exporter/config.yml"
          )
          
          MISSING_FILES=()
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_FILES+=("$file")
              echo "❌ Missing: $file"
            else
              echo "✅ Found: $file"
            fi
          done
          
          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo ""
            echo "❌ ERROR: Missing required files:"
            printf '  - %s\n' "${MISSING_FILES[@]}"
            exit 1
          fi
          
          echo "✅ All required files present"

      # ============================================
      # 4. 배포 스크립트 생성
      # ============================================
      - name: 📝 Create Deployment Script
        run: |
          cat << 'DEPLOY_SCRIPT' > /tmp/deploy-monitoring.sh
          #!/bin/bash
          set -euo pipefail

          # 로깅 함수
          log_info() { echo "ℹ️  $1"; }
          log_success() { echo "✅ $1"; }
          log_warning() { echo "⚠️  $1"; }
          log_error() { echo "❌ $1" >&2; }

          log_info "=== Enhanced Monitoring Stack Deployment ==="
          log_info "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          log_info "AWS Region: ${AWS_REGION:-ap-northeast-2}"
          log_info "Parameter Prefix: ${PARAMETER_PREFIX:-/wealist/prod}"

          # =============================================================================
          # STEP 1: 환경 검증
          # =============================================================================
          log_info "🔍 Validating environment..."

          # 현재 사용자 확인
          CURRENT_USER=$(whoami 2>/dev/null || echo "ubuntu")
          log_info "Current user: ${CURRENT_USER}"

          # AWS CLI 확인
          if ! command -v aws &> /dev/null; then
            log_error "AWS CLI not found. Please install AWS CLI."
            exit 1
          fi
          log_success "AWS CLI available: $(aws --version 2>&1 | head -n1)"

          # Docker 확인
          if ! command -v docker &> /dev/null; then
            log_error "Docker not found. Please install Docker."
            exit 1
          fi
          log_success "Docker available: $(docker --version)"

          # Docker 서비스 실행 확인
          if ! sudo systemctl is-active --quiet docker; then
            log_warning "Docker service not running. Starting..."
            sudo systemctl start docker
            sudo systemctl enable docker
            sleep 3
          fi
          log_success "Docker service is running"

          # =============================================================================
          # STEP 2: Docker Compose 설치/업데이트
          # =============================================================================
          if [ "${SKIP_DOCKER_INSTALL:-false}" != "true" ]; then
            log_info "🐳 Checking Docker Compose..."

            # 현재 버전 확인
            CURRENT_VERSION="0.0.0"
            if command -v docker-compose &> /dev/null; then
              CURRENT_VERSION=$(docker-compose --version 2>/dev/null | grep -oP '\d+\.\d+\.\d+' | head -1 || echo "0.0.0")
              log_info "Current Docker Compose version: ${CURRENT_VERSION}"
            else
              log_warning "Docker Compose not found"
            fi

            # 필요 버전
            REQUIRED_VERSION="2.20.0"
            
            # 버전 비교 함수
            version_ge() {
              [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]
            }

            if ! version_ge "$CURRENT_VERSION" "$REQUIRED_VERSION"; then
              log_info "📥 Installing Docker Compose..."
              
              # 최신 버전 가져오기
              COMPOSE_VERSION=$(curl -fsSL https://api.github.com/repos/docker/compose/releases/latest 2>/dev/null | grep -Po '"tag_name": "\K[^"]*' || echo "v2.24.0")
              log_info "Downloading Docker Compose ${COMPOSE_VERSION}..."
              
              # 다운로드 및 설치
              if sudo curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" \
                -o /usr/local/bin/docker-compose; then
                
                sudo chmod +x /usr/local/bin/docker-compose
                sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose 2>/dev/null || true
                
                if docker-compose --version &> /dev/null; then
                  log_success "Docker Compose installed: $(docker-compose --version)"
                else
                  log_error "Docker Compose installation verification failed"
                  exit 1
                fi
              else
                log_error "Failed to download Docker Compose"
                exit 1
              fi
            else
              log_success "Docker Compose is up to date: ${CURRENT_VERSION}"
            fi
          else
            log_info "⏭️  Skipping Docker Compose installation check"
          fi

          # Docker Compose 명령어 결정
          if docker compose version &> /dev/null; then
            COMPOSE_CMD="docker compose"
            log_info "Using Docker Compose V2 (plugin)"
          elif docker-compose --version &> /dev/null; then
            COMPOSE_CMD="docker-compose"
            log_info "Using Docker Compose V1 (standalone)"
          else
            log_error "Docker Compose not available"
            exit 1
          fi

          # =============================================================================
          # STEP 3: 기존 서비스 정리
          # =============================================================================
          log_info "🧹 Cleaning up existing services..."

          # 실행 중인 컨테이너 중지 및 제거
          CONTAINERS=$(sudo docker ps -aq --filter "name=wealist-" 2>/dev/null || true)
          if [ -n "$CONTAINERS" ]; then
            log_info "Stopping and removing containers..."
            sudo docker stop $CONTAINERS 2>/dev/null || true
            sudo docker rm $CONTAINERS 2>/dev/null || true
            log_success "Containers cleaned up"
          else
            log_info "No containers to clean up"
          fi

          # 네트워크 제거 (존재하면)
          if sudo docker network ls --format '{{.Name}}' 2>/dev/null | grep -q '^wealist-monitoring-net$'; then
            log_info "Removing network wealist-monitoring-net..."
            sudo docker network rm wealist-monitoring-net 2>/dev/null || true
          fi

          # Dangling 볼륨 제거
          sudo docker volume prune -f &> /dev/null || true

          log_success "Cleanup completed"

          # =============================================================================
          # STEP 4: SSM에서 설정 로드
          # =============================================================================
          log_info "📋 Loading configuration from SSM..."

          # SSM 파라미터 로드 함수
          load_param() {
            local param_name="$1"
            local default_value="${2:-}"
            local full_path="${PARAMETER_PREFIX}${param_name}"
            
            local value
            if value=$(aws ssm get-parameter \
              --name "${full_path}" \
              --query "Parameter.Value" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            elif [ -n "$default_value" ]; then
              log_warning "Using default for ${param_name}: ${default_value}"
              echo "$default_value"
            else
              log_error "Required parameter not found: ${full_path}"
              return 1
            fi
          }

          # SSM 암호화된 파라미터 로드 함수
          load_secret() {
            local param_name="$1"
            local default_value="${2:-}"
            local full_path="${PARAMETER_PREFIX}${param_name}"
            
            local value
            if value=$(aws ssm get-parameter \
              --name "${full_path}" \
              --query "Parameter.Value" \
              --output text \
              --with-decryption \
              --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            elif [ -n "$default_value" ]; then
              log_warning "Using default for ${param_name}"
              echo "$default_value"
            else
              log_error "Required secret not found: ${full_path}"
              return 1
            fi
          }

          # 설정 로드
          log_info "Loading parameters..."
          
          GRAFANA_ADMIN_USER=$(load_param "/monitor/grafana_admin_user" "admin")
          GRAFANA_ADMIN_PASSWORD=$(load_secret "/monitor/grafana_admin_password" "")
          
          if [ -z "$GRAFANA_ADMIN_PASSWORD" ]; then
            log_error "Grafana admin password is required"
            exit 1
          fi
          
          PROMETHEUS_PORT=$(load_param "/monitor/prometheus_port" "9090")
          GRAFANA_PORT=$(load_param "/monitor/grafana_port" "3001")
          NODE_EXPORTER_PORT=$(load_param "/monitor/node_exporter_port" "9001")
          LOKI_PORT=$(load_param "/monitor/loki_port" "3100")
          RDS_EXPORTER_PORT=$(load_param "/monitor/rds_exporter_port" "9042")
          ELASTIC_EXPORTER_PORT=$(load_param "/monitor/elastic_exporter_port" "9114")

          PROMETHEUS_CONFIG_DIR=$(load_param "/monitor/prometheus_config" "/home/ubuntu/wealist/prometheus/config")
          LOKI_CONFIG_DIR=$(load_param "/monitor/loki_config" "/home/ubuntu/wealist/loki/config")
          PROMTAIL_CONFIG_DIR=$(load_param "/monitor/promtail_config" "/home/ubuntu/wealist/promtail/config")
          RDS_CONFIG_DIR=$(load_param "/monitor/rds_config" "/home/ubuntu/wealist/rds_exporter/config")

          ELASTIC_URL=$(load_param "/monitor/elasticsearch_uri" "localhost")
          RDS_EXPORTER_IMAGE=$(load_param "/monitor/rds_exporter_image" "qonto/prometheus-rds-exporter:latest")

          USER_SERVICE_PORT=$(load_param "/user_port" "8080")
          BOARD_SERVICE_PORT=$(load_param "/board_port" "8000")

          log_success "Configuration loaded successfully"

          # =============================================================================
          # STEP 5: 디렉토리 구조 생성
          # =============================================================================
          log_info "📁 Setting up directory structure..."

          # Compose 디렉토리로 이동
          COMPOSE_DIR="${COMPOSE_DIR:-/home/ubuntu/wealist/compose}"
          sudo mkdir -p "${COMPOSE_DIR}"
          
          if ! cd "${COMPOSE_DIR}"; then
            log_error "Failed to change to directory: ${COMPOSE_DIR}"
            exit 1
          fi
          log_info "Working directory: $(pwd)"

          # 필요한 디렉토리 생성
          sudo mkdir -p /home/ubuntu/wealist/{prometheus/{config,data},grafana/{data,logs},loki/{config,data},promtail/config,rds_exporter/config}

          # 권한 설정 (에러 무시)
          sudo chown -R ${CURRENT_USER}:${CURRENT_USER} /home/ubuntu/wealist/ 2>/dev/null || true
          sudo chown -R 472:472 /home/ubuntu/wealist/grafana/ 2>/dev/null || true
          sudo chown -R 65534:65534 /home/ubuntu/wealist/prometheus/data 2>/dev/null || true
          sudo chown -R 10001:10001 /home/ubuntu/wealist/loki/data 2>/dev/null || sudo chown -R ${CURRENT_USER}:${CURRENT_USER} /home/ubuntu/wealist/loki/data 2>/dev/null || true
          sudo chown -R ${CURRENT_USER}:${CURRENT_USER} /home/ubuntu/wealist/rds_exporter/ 2>/dev/null || true

          log_success "Directory structure created"

          # =============================================================================
          # STEP 6: 설정 파일 배포
          # =============================================================================
          log_info "📝 Deploying configuration files..."

          # Docker Compose 파일
          if [ -z "${COMPOSE_B64:-}" ]; then
            log_error "COMPOSE_B64 environment variable not set"
            exit 1
          fi

          if ! echo "${COMPOSE_B64}" | base64 -d > docker-compose.yml 2>/dev/null; then
            log_error "Failed to decode docker-compose.yml"
            exit 1
          fi
          log_success "docker-compose.yml created"

          # Prometheus 설정
          if [ -n "${PROM_CFG_B64:-}" ]; then
            if echo "${PROM_CFG_B64}" | base64 -d | sudo tee ${PROMETHEUS_CONFIG_DIR}/prometheus-prod-ec2.yml > /dev/null; then
              log_success "Prometheus config created"
              
              # 템플릿 변수 치환
              sudo sed -i \
                -e "s/{{USER_SERVICE_PORT}}/${USER_SERVICE_PORT}/g" \
                -e "s/{{BOARD_SERVICE_PORT}}/${BOARD_SERVICE_PORT}/g" \
                -e "s/{{NODE_EXPORTER_PORT}}/${NODE_EXPORTER_PORT}/g" \
                -e "s/{{RDS_EXPORTER_PORT}}/${RDS_EXPORTER_PORT}/g" \
                -e "s/{{ELASTIC_EXPORTER_PORT}}/${ELASTIC_EXPORTER_PORT}/g" \
                -e "s/{{PROMETHEUS_PORT}}/${PROMETHEUS_PORT}/g" \
                "${PROMETHEUS_CONFIG_DIR}/prometheus-prod-ec2.yml" 2>/dev/null || log_warning "Failed to process Prometheus template"
              log_success "Prometheus config processed"
            fi
          else
            log_warning "Prometheus config not provided"
          fi

          # Loki 설정
          if [ -n "${LOKI_CFG_B64:-}" ]; then
            if echo "${LOKI_CFG_B64}" | base64 -d | sudo tee ${LOKI_CONFIG_DIR}/local-config.yaml > /dev/null; then
              log_success "Loki config created"
            fi
          else
            log_warning "Loki config not provided"
          fi

          # Promtail 설정
          if [ -n "${PROMTAIL_CFG_B64:-}" ]; then
            if echo "${PROMTAIL_CFG_B64}" | base64 -d | sudo tee ${PROMTAIL_CONFIG_DIR}/promtail.yml > /dev/null; then
              log_success "Promtail config created"
            fi
          else
            log_warning "Promtail config not provided"
          fi

          # RDS Exporter 설정
          if [ -n "${RDS_CFG_B64:-}" ]; then
            if echo "${RDS_CFG_B64}" | base64 -d | sudo tee ${RDS_CONFIG_DIR}/config.yml > /dev/null; then
              log_success "RDS Exporter config created"
            fi
          else
            log_warning "RDS Exporter config not provided"
          fi

          # .env 파일 생성
          cat > .env << ENV_EOF
          PROMETHEUS_PORT=${PROMETHEUS_PORT}
          GRAFANA_PORT=${GRAFANA_PORT}
          LOKI_PORT=${LOKI_PORT}
          NODE_EXPORTER_PORT=${NODE_EXPORTER_PORT}
          RDS_EXPORTER_PORT=${RDS_EXPORTER_PORT}
          ELASTIC_EXPORTER_PORT=${ELASTIC_EXPORTER_PORT}
          AWS_REGION=${AWS_REGION}
          ES_URI=${ELASTIC_URL}:9200
          PROMETHEUS_CONFIG_DIR=${PROMETHEUS_CONFIG_DIR}
          LOKI_CONFIG_DIR=${LOKI_CONFIG_DIR}
          PROMTAIL_CONFIG_DIR=${PROMTAIL_CONFIG_DIR}
          RDS_CONFIG_DIR=${RDS_CONFIG_DIR}
          GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
          RDS_EXPORTER_IMAGE=${RDS_EXPORTER_IMAGE}
          ENV_EOF

          log_success ".env file created"

          # =============================================================================
          # STEP 7: 서비스 시작
          # =============================================================================
          log_info "🚀 Starting monitoring services..."

          # 이미지 Pull
          log_info "Pulling Docker images..."
          if sudo ${COMPOSE_CMD} pull 2>&1 | tee /tmp/compose-pull.log; then
            log_success "Images pulled successfully"
          else
            log_warning "Some images may have failed to pull (check /tmp/compose-pull.log)"
          fi

          # 컨테이너 시작
          log_info "Starting containers..."
          if ! sudo ${COMPOSE_CMD} up -d --remove-orphans 2>&1 | tee /tmp/compose-up.log; then
            log_error "Failed to start services"
            log_info "Docker Compose logs:"
            sudo ${COMPOSE_CMD} logs --tail=100 2>&1 || true
            exit 1
          fi

          log_success "Containers started"

          # 초기화 대기
          log_info "Waiting for services to initialize (30s)..."
          sleep 30

          # =============================================================================
          # STEP 8: 상태 확인
          # =============================================================================
          log_info "🔍 Checking service health..."

          # 컨테이너 상태
          sudo ${COMPOSE_CMD} ps

          # 실행 중인 컨테이너 수
          RUNNING_COUNT=$(sudo docker ps --filter "name=wealist-" --format "{{.Names}}" | wc -l)
          log_info "Running containers: ${RUNNING_COUNT}"

          if [ "$RUNNING_COUNT" -eq 0 ]; then
            log_error "No containers are running!"
            exit 1
          fi

          log_success "🎉 Monitoring Stack deployment completed!"
          DEPLOY_SCRIPT

          chmod +x /tmp/deploy-monitoring.sh
          echo "✅ Deployment script created"

      # ============================================
      # 5. 배포 실행
      # ============================================
      - name: 🚀 Execute Deployment
        id: deploy
        run: |
          echo "📦 Encoding configuration files..."

          # OIDC 검증
          PRINCIPAL_ARN=$(aws sts get-caller-identity --query "Arn" --output text --region "${AWS_REGION}")
          if [[ "$PRINCIPAL_ARN" != *"assumed-role/wealist-prod-github-actions-role"* ]]; then
            echo "❌ ERROR: Invalid IAM role: $PRINCIPAL_ARN"
            exit 1
          fi
          echo "✅ OIDC verified: $PRINCIPAL_ARN"

          # 설정 파일 인코딩
          echo "Encoding files..."
          COMPOSE_B64=$(base64 -w 0 docker/compose/docker-compose.ec2-prod-monitoring.yml)
          PROM_CFG_B64=$(base64 -w 0 prometheus/config/prometheus-prod-ec2.yml)
          LOKI_CFG_B64=$(base64 -w 0 loki/config/local-config.yaml)
          PROMTAIL_CFG_B64=$(base64 -w 0 promtail/config/promtail.yml)
          RDS_CFG_B64=$(base64 -w 0 rds_exporter/config.yml)
          SCRIPT_BASE64=$(base64 -w 0 /tmp/deploy-monitoring.sh)

          echo "✅ Files encoded"

          # SSM 명령 실행
          echo "Sending deployment command to EC2..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Monitoring Stack - SHA: ${{ github.sha }}" \
            --timeout-seconds 1800 \
            --parameters commands="[
              \"set -e\",
              \"echo 'Starting deployment...'\",
              \"echo '${SCRIPT_BASE64}' | base64 -d > /tmp/deploy-monitoring.sh\",
              \"chmod +x /tmp/deploy-monitoring.sh\",
              \"export PARAMETER_PREFIX='${{ steps.config.outputs.parameter-prefix }}'\",
              \"export AWS_REGION='${AWS_REGION}'\",
              \"export COMPOSE_DIR='${{ steps.config.outputs.compose-dir }}'\",
              \"export COMPOSE_B64='${COMPOSE_B64}'\",
              \"export PROM_CFG_B64='${PROM_CFG_B64}'\",
              \"export LOKI_CFG_B64='${LOKI_CFG_B64}'\",
              \"export PROMTAIL_CFG_B64='${PROMTAIL_CFG_B64}'\",
              \"export RDS_CFG_B64='${RDS_CFG_B64}'\",
              \"export SKIP_DOCKER_INSTALL='${{ inputs.skip_docker_install }}'\",
              \"/tmp/deploy-monitoring.sh 2>&1 | tee /tmp/deploy-monitoring.log\",
              \"EXIT_CODE=\\${PIPESTATUS[0]}\",
              \"echo 'Deployment finished with exit code:' \\$EXIT_CODE\",
              \"exit \\$EXIT_CODE\"
            ]" \
            --output text \
            --query "Command.CommandId" \
            --region "${AWS_REGION}")

          if [ -z "$COMMAND_ID" ]; then
            echo "❌ Failed to send SSM command"
            exit 1
          fi

          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Command ID: ${COMMAND_ID}"

      # ============================================
      # 6. 배포 모니터링
      # ============================================
      - name: 📊 Monitor Deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command-id }}"
          INSTANCE_ID="${{ steps.config.outputs.ec2-instance-id }}"
          
          echo "📊 Monitoring: ${COMMAND_ID} on ${INSTANCE_ID}"

          MAX_WAIT=1800  # 30 minutes
          WAIT_TIME=0
          CHECK_COUNT=0

          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null || echo "Pending")

            # 처음 5분은 자주, 이후는 덜 자주 체크
            if [ $WAIT_TIME -lt 300 ]; then
              INTERVAL=15
            else
              INTERVAL=30
            fi

            CHECK_COUNT=$((CHECK_COUNT + 1))
            echo "⏳ [$CHECK_COUNT] Status: $STATUS (${WAIT_TIME}s elapsed)"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment completed successfully!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo ""
              echo "❌ Deployment failed with status: $STATUS"
              echo ""
              echo "📋 Standard Output:"
              echo "-------------------"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text \
                --region "${AWS_REGION}" || echo "(no output)"
              echo ""
              echo "📋 Error Output:"
              echo "----------------"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text \
                --region "${AWS_REGION}" || echo "(no errors)"
              exit 1
            fi

            sleep $INTERVAL
            WAIT_TIME=$((WAIT_TIME + INTERVAL))
          done

          if [ $WAIT_TIME -ge $MAX_WAIT ]; then
            echo "❌ Deployment timed out after ${MAX_WAIT} seconds"
            exit 1
          fi

          # 최종 출력
          echo ""
          echo "📋 Deployment Output:"
          echo "---------------------"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text \
            --region "${AWS_REGION}" || true

      # ============================================
      # 7. 배포 요약
      # ============================================
      - name: 📋 Deployment Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ### 🎉 Enhanced Monitoring Stack Deployment
          
          **Status:** ${{ job.status }}  
          **Instance:** `${{ steps.config.outputs.ec2-instance-id }}`  
          **Command:** `${{ steps.deploy.outputs.command-id }}`  
          **SHA:** `${{ github.sha }}`  
          **Branch:** `${{ github.ref_name }}`  
          **Timestamp:** `$(date -u '+%Y-%m-%d %H:%M:%S UTC')`
          
          ---
          
          #### 🛠️ Components
          - ✅ Prometheus (metrics collection)
          - ✅ Grafana (visualization)
          - ✅ Loki (log aggregation)
          - ✅ Promtail (log shipping)
          - ✅ RDS Exporter (database metrics)
          - ✅ Node Exporter (system metrics)
          - ✅ Elasticsearch Exporter
          
          #### 🔐 Security
          - OIDC authentication
          - SSM Parameter Store for secrets
          - KMS encryption
          
          #### 📦 Configuration
          - Auto-install Docker Compose
          - Base64-encoded config files
          - Template variable substitution
          EOF