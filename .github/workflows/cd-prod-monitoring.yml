name: CD - Enhanced Monitoring Stack (Complete)

on:
  push:
    branches:
      - deploy-prod
    paths:
      - "prometheus/**"
      - "loki/**"
      - "promtail/**"
      - "docker/compose/docker-compose.ec2-prod-monitoring.yml"
      - ".github/workflows/cd-prod-monitoring.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  deploy-enhanced-monitoring:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::290008131187:role/wealist-prod-github-actions-role
          aws-region: ap-northeast-2

      - name: 🔍 Load Configuration
        id: config
        run: |
          echo "🔍 Loading configuration..."
          
          # AWS Identity 확인
          aws sts get-caller-identity
          
          # Load base configuration with error handling
          set +e
          
          EC2_ID=$(aws ssm get-parameter \
            --name "/wealist/prod/cd/ec2_instance_id" \
            --query "Parameter.Value" \
            --output text \
            --with-decryption 2>&1)
          
          COMPOSE_DIR=$(aws ssm get-parameter \
            --name "/wealist/prod/monitor/compose_file_path" \
            --query "Parameter.Value" \
            --output text 2>&1)
          
          PARAM_PREFIX=$(aws ssm get-parameter \
            --name "/wealist/prod/cd/parameter_prefix" \
            --query "Parameter.Value" \
            --output text 2>&1)
          
          set -e
          
          # Handle parameter not found cases with defaults
          if [[ "$EC2_ID" == *"ParameterNotFound"* ]] || [ -z "$EC2_ID" ]; then
            echo "❌ EC2 Instance ID parameter not found"
            exit 1
          fi
          
          if [[ "$COMPOSE_DIR" == *"ParameterNotFound"* ]]; then
            COMPOSE_DIR="/home/ubuntu/wealist/docker/compose"
          fi
          
          if [[ "$PARAM_PREFIX" == *"ParameterNotFound"* ]]; then
            PARAM_PREFIX="/wealist/prod"
          fi
          
          echo "ec2-instance-id=$EC2_ID" >> $GITHUB_OUTPUT
          echo "compose-file-path=$COMPOSE_DIR" >> $GITHUB_OUTPUT
          echo "parameter-prefix=$PARAM_PREFIX" >> $GITHUB_OUTPUT
          
          echo "✅ Configuration loaded:"
          echo "  EC2 Instance ID: $EC2_ID"
          echo "  Compose Directory: $COMPOSE_DIR"
          echo "  Parameter Prefix: $PARAM_PREFIX"

      - name: 📝 Create Deployment Script
        run: |
          cat << 'DEPLOY_SCRIPT' > /tmp/deploy-monitoring.sh
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Enhanced Monitoring Stack Deployment ==="
          echo "Timestamp: $(date)"
          echo "AWS Region: ${AWS_REGION}"
          echo "Parameter Prefix: ${PARAMETER_PREFIX}"
          echo "Compose File Path: ${COMPOSE_FILE}"

          # Get current user
          CURRENT_USER=$(whoami)
          echo "📋 Current user: ${CURRENT_USER}"

          # =============================================================================
          # STEP 1: CLEANUP
          # =============================================================================
          echo "🧹 Cleaning up existing monitoring services..."
          
          # Stop and remove monitoring containers
          sudo docker stop $(sudo docker ps -aq --filter "name=wealist-" 2>/dev/null) 2>/dev/null || echo "No containers to stop"
          sudo docker rm $(sudo docker ps -aq --filter "name=wealist-" 2>/dev/null) 2>/dev/null || echo "No containers to remove"
          
          # Remove monitoring networks
          sudo docker network rm wealist-monitoring-net 2>/dev/null || echo "Network doesn't exist"
          
          # Clean up volumes
          sudo docker volume prune -f || true
          
          echo "✅ Cleanup completed"

          # =============================================================================
          # STEP 2: LOAD CONFIGURATION
          # =============================================================================
          echo "📋 Loading configuration from SSM..."

          # Function to load parameters
          load_param() {
            local param_name="$1"
            local default_value="${2:-}"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            
            local value
            if value=$(aws ssm get-parameter \
              --name "${full_param_path}" \
              --query "Parameter.Value" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            elif [ -n "$default_value" ]; then
              echo "$default_value"
            else
              echo "❌ Parameter not found: ${full_param_path}" >&2
              return 1
            fi
          }

          # Function to load secrets
          load_secret() {
            local param_name="$1"
            local default_value="${2:-}"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            
            local value
            if value=$(aws ssm get-parameter \
              --name "${full_param_path}" \
              --query "Parameter.Value" \
              --output text \
              --with-decryption \
              --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            elif [ -n "$default_value" ]; then
              echo "$default_value"
            else
              echo "❌ Secret not found: ${full_param_path}" >&2
              return 1
            fi
          }

          # Load all configuration
          GRAFANA_ADMIN_USER=$(load_param "/monitor/grafana_admin_user" "admin")
          GRAFANA_ADMIN_PASSWORD=$(load_secret "/monitor/grafana_admin_password" "admin123")
          PROMETHEUS_PORT=$(load_param "/monitor/prometheus_port" "9090")
          GRAFANA_PORT=$(load_param "/monitor/grafana_port" "3001") 
          NODE_EXPORTER_PORT=$(load_param "/monitor/node_exporter_port" "9001")
          LOKI_PORT=$(load_param "/monitor/loki_port" "3100")
          RDS_EXPORTER_PORT=$(load_param "/monitor/rds_exporter_port" "9042")
          ELASTIC_EXPORTER_PORT=$(load_param "/monitor/elastic_exporter_port" "9114")
          
          PROMETHEUS_CONFIG_DIR=$(load_param "/monitor/prometheus_config" "/home/ubuntu/wealist/prometheus/config")
          LOKI_CONFIG_DIR=$(load_param "/monitor/loki_config" "/home/ubuntu/wealist/loki/config")
          PROMTAIL_CONFIG_DIR=$(load_param "/monitor/promtail_config" "/home/ubuntu/wealist/promtail/config")
          
          ELASTIC_URL=$(load_param "/monitor/elasticsearch_uri" "localhost")
          RDS_EXPORTER_IMAGE=$(load_param "/monitor/rds_exporter_image" "qonto/prometheus-rds-exporter:latest")

          echo "✅ Configuration loaded successfully"

          # =============================================================================
          # STEP 3: SETUP DIRECTORIES
          # =============================================================================
          echo "📁 Setting up directory structure..."
          
          # Navigate to compose directory
          COMPOSE_DIR="${COMPOSE_FILE%/*}"
          sudo mkdir -p "${COMPOSE_DIR}"
          cd "${COMPOSE_DIR}"
          
          # Create monitoring directories
          sudo mkdir -p /home/ubuntu/wealist/{prometheus/{config,data},grafana/{data,logs},loki/{config,data},promtail/config}

          # Set permissions
          sudo chown -R ${CURRENT_USER}:${CURRENT_USER} /home/ubuntu/wealist/
          sudo chown -R 472:472 /home/ubuntu/wealist/grafana/
          sudo chown -R 65534:65534 /home/ubuntu/wealist/prometheus/data
          sudo chown -R 10001:10001 /home/ubuntu/wealist/loki/data || sudo chown -R ${CURRENT_USER}:${CURRENT_USER} /home/ubuntu/wealist/loki/data

          echo "✅ Directories created and configured"

          # =============================================================================
          # STEP 4: DEPLOY FILES
          # =============================================================================
          echo "📝 Deploying configuration files..."
          
          # Deploy Docker Compose file
          echo "${COMPOSE_B64}" | base64 -d > docker-compose.yml
          
          # Deploy configuration files
          echo "${PROM_CFG_B64}" | base64 -d | sudo tee ${PROMETHEUS_CONFIG_DIR}/prometheus-ec2.yml > /dev/null
          echo "${LOKI_CFG_B64}" | base64 -d | sudo tee ${LOKI_CONFIG_DIR}/local-config.yaml > /dev/null  
          echo "${PROMTAIL_CFG_B64}" | base64 -d | sudo tee ${PROMTAIL_CONFIG_DIR}/promtail.yml > /dev/null

          # Create environment file
          cat > .env << ENV_EOF
          PROMETHEUS_PORT=${PROMETHEUS_PORT}
          GRAFANA_PORT=${GRAFANA_PORT}
          LOKI_PORT=${LOKI_PORT}
          NODE_EXPORTER_PORT=${NODE_EXPORTER_PORT}
          RDS_EXPORTER_PORT=${RDS_EXPORTER_PORT}
          ELASTIC_EXPORTER_PORT=${ELASTIC_EXPORTER_PORT}
          AWS_REGION=ap-northeast-2
          ES_URI=http://${ELASTIC_URL}:9200
          PROMETHEUS_CONFIG_DIR=${PROMETHEUS_CONFIG_DIR}
          LOKI_CONFIG_DIR=${LOKI_CONFIG_DIR}
          PROMTAIL_CONFIG_DIR=${PROMTAIL_CONFIG_DIR}
          GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
          RDS_EXPORTER_IMAGE=${RDS_EXPORTER_IMAGE}
          ENV_EOF

          echo "✅ Configuration files deployed"

          # =============================================================================
          # STEP 5: VALIDATE AND START
          # =============================================================================
          echo "🔍 Validating configuration..."
          
          # Debug information
          echo "📋 Debug Information:"
          echo "Current directory: $(pwd)"
          echo "Files:"
          ls -la
          echo ""
          echo "Docker Compose file (first 10 lines):"
          head -10 docker-compose.yml
          echo ""
          echo "Environment variables:"
          cat .env
          echo ""

          # Validate Docker Compose
          if ! sudo docker-compose config >/dev/null 2>&1; then
            echo "❌ Docker Compose validation failed:"
            sudo docker-compose config
            exit 1
          fi

          echo "✅ Configuration valid"

          # Start services
          echo "🚀 Starting monitoring services..."
          
          # Pull images
          echo "📦 Pulling images..."
          sudo docker-compose pull

          # Start containers
          echo "🔄 Starting containers..."
          if ! sudo docker-compose up -d --remove-orphans; then
            echo "❌ Failed to start services"
            echo "Docker Compose logs:"
            sudo docker-compose logs --tail=50
            exit 1
          fi

          # Wait and verify
          echo "⏳ Waiting for services..."
          sleep 30

          echo "📋 Container status:"
          sudo docker ps -a

          # Basic health checks
          echo "🏥 Basic health checks:"
          
          for port in ${PROMETHEUS_PORT} ${GRAFANA_PORT} ${NODE_EXPORTER_PORT}; do
            if curl -s http://localhost:${port} >/dev/null 2>&1; then
              echo "✅ Service on port ${port} is responding"
            else
              echo "⚠️ Service on port ${port} not ready yet"
            fi
          done

          echo ""
          echo "🎉 Deployment completed successfully!"
          echo "📊 Services:"
          echo "  - Prometheus: http://localhost:${PROMETHEUS_PORT}"
          echo "  - Grafana: http://localhost:${GRAFANA_PORT} (${GRAFANA_ADMIN_USER}/${GRAFANA_ADMIN_PASSWORD})"
          echo "  - Loki: http://localhost:${LOKI_PORT}"
          echo "  - Node Exporter: http://localhost:${NODE_EXPORTER_PORT}/metrics"
          
          DEPLOY_SCRIPT

      - name: 🚀 Deploy via SSM
        id: deploy
        run: |
          # Encode files
          COMPOSE_B64=$(base64 -w 0 docker/compose/docker-compose.ec2-prod-monitoring.yml)
          PROM_CFG_B64=$(base64 -w 0 prometheus/config/prometheus-ec2.yml)
          LOKI_CFG_B64=$(base64 -w 0 loki/config/local-config.yaml)
          PROMTAIL_CFG_B64=$(base64 -w 0 promtail/promtail.yml)
          SCRIPT_BASE64=$(base64 -w 0 /tmp/deploy-monitoring.sh)

          # Send command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Monitoring Stack - ${{ github.sha }}" \
            --timeout-seconds 1200 \
            --parameters commands="[
              \"echo 'Deployment Started' \",
              \"echo '${SCRIPT_BASE64}' | base64 -d > /tmp/deploy-monitoring.sh\",
              \"chmod +x /tmp/deploy-monitoring.sh\",
              \"export PARAMETER_PREFIX='${{ steps.config.outputs.parameter-prefix }}'\",
              \"export AWS_REGION='ap-northeast-2'\",
              \"export COMPOSE_FILE='${{ steps.config.outputs.compose-file-path }}'\",
              \"export COMPOSE_B64='${COMPOSE_B64}'\",
              \"export PROM_CFG_B64='${PROM_CFG_B64}'\",
              \"export LOKI_CFG_B64='${LOKI_CFG_B64}'\",
              \"export PROMTAIL_CFG_B64='${PROMTAIL_CFG_B64}'\",
              \"/tmp/deploy-monitoring.sh 2>&1 | tee /tmp/deploy.log\",
              \"echo 'Deployment Exit Code:' \${PIPESTATUS[0]}\"
            ]" \
            --output text \
            --query "Command.CommandId")

          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Command sent: ${COMMAND_ID}"

      - name: 📊 Monitor Progress
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command-id }}"
          MAX_WAIT=900
          WAIT_TIME=0
          
          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "⏳ Status: $STATUS (${WAIT_TIME}s)"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment completed!"
              break
            elif [ "$STATUS" = "Failed" ]; then
              echo "❌ Deployment failed!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --query "StandardOutputContent" \
                --output text
              exit 1
            fi
            
            sleep 30
            WAIT_TIME=$((WAIT_TIME + 30))
          done

          # Show final output
          echo "📋 Final output:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
            --query "StandardOutputContent" \
            --output text