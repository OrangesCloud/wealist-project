name: CD - Enhanced Monitoring Stack (Complete Fixed)

on:
  push:
    branches:
      - deploy-prod
    paths:
      - "prometheus/**"
      - "loki/**"
      - "promtail/**"
      - "rds_exporter/**"
      - "docker/compose/docker-compose.ec2-prod-monitoring.yml"
      - ".github/workflows/cd-prod-monitoring.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    name: Deploy to EC2 via CodeDeploy
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # 0. Checkout 코드
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # 1. AWS Credentials 설정
      # ============================================
      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::290008131187:role/wealist-prod-github-actions-role
          aws-region: ap-northeast-2

      # ============================================
      # 2. Configuration 설정 (누락된 부분 추가)
      # ============================================
      - name: 📥 Set Configuration Variables
        id: config
        run: |
          # EC2 인스턴스 ID 찾기
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:aws:autoscaling:groupName,Values=wealist-prod-backend-asg" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          
          if [ "$INSTANCE_ID" = "null" ] || [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "❌ No running EC2 instance found in ASG: wealist-prod-backend-asg"
            exit 1
          fi
          
          echo "✅ Found EC2 Instance: $INSTANCE_ID"
          echo "ec2-instance-id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "parameter-prefix=/wealist/prod" >> $GITHUB_OUTPUT
          echo "compose-file-path=/home/ubuntu/wealist/docker-compose.yml" >> $GITHUB_OUTPUT

      # ============================================
      # 3. 배포 스크립트 생성
      # ============================================
      - name: 📝 Create Complete Deployment Script
        run: |
          cat << 'DEPLOY_SCRIPT' > /tmp/deploy-monitoring.sh
          #!/bin/bash
          set -euo pipefail

          echo "=== Enhanced Monitoring Stack Deployment (OIDC) ==="
          echo "Timestamp: $(date)"
          echo "AWS Region: ${AWS_REGION}"
          echo "Parameter Prefix: ${PARAMETER_PREFIX}"
          echo "Compose File Path: ${COMPOSE_FILE}"

          # Get current user
          CURRENT_USER=$(whoami)
          echo "📋 Current user: ${CURRENT_USER}"

          # =============================================================================
          # STEP 1: CLEANUP EXISTING MONITORING SERVICES
          # =============================================================================
          echo "🧹 Cleaning up existing monitoring services..."

          # Stop and remove monitoring containers
          sudo docker stop $(sudo docker ps -aq --filter "name=wealist-" 2>/dev/null) 2>/dev/null || echo "No containers to stop"
          sudo docker rm $(sudo docker ps -aq --filter "name=wealist-" 2>/dev/null) 2>/dev/null || echo "No containers to remove"

          # Remove monitoring networks
          sudo docker network rm wealist-monitoring-net 2>/dev/null || echo "Network doesn't exist"

          # Clean up volumes
          sudo docker volume prune -f || true

          echo "✅ Cleanup completed"

          # =============================================================================
          # STEP 2: LOAD CONFIGURATION FROM SSM
          # =============================================================================
          echo "📋 Loading configuration from SSM Parameter Store..."

          # Function to load parameters
          load_param() {
            local param_name="$1"
            local default_value="${2:-}"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            
            local value
            if value=$(aws ssm get-parameter \
              --name "${full_param_path}" \
              --query "Parameter.Value" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            elif [ -n "$default_value" ]; then
              echo "$default_value"
            else
              echo "❌ Parameter not found: ${full_param_path}" >&2
              return 1
            fi
          }

          # Function to load secrets
          load_secret() {
            local param_name="$1"
            local default_value="${2:-}"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            
            local value
            if value=$(aws ssm get-parameter \
              --name "${full_param_path}" \
              --query "Parameter.Value" \
              --output text \
              --with-decryption \
              --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            elif [ -n "$default_value" ]; then
              echo "$default_value"
            else
              echo "❌ Secret not found: ${full_param_path}" >&2
              return 1
            fi
          }

          # Load all configuration
          GRAFANA_ADMIN_USER=$(load_param "/monitor/grafana_admin_user" "admin")
          GRAFANA_ADMIN_PASSWORD=$(load_secret "/monitor/grafana_admin_password" "admin123")
          PROMETHEUS_PORT=$(load_param "/monitor/prometheus_port" "9090")
          GRAFANA_PORT=$(load_param "/monitor/grafana_port" "3001") 
          NODE_EXPORTER_PORT=$(load_param "/monitor/node_exporter_port" "9001")
          LOKI_PORT=$(load_param "/monitor/loki_port" "3100")
          RDS_EXPORTER_PORT=$(load_param "/monitor/rds_exporter_port" "9042")
          ELASTIC_EXPORTER_PORT=$(load_param "/monitor/elastic_exporter_port" "9114")

          PROMETHEUS_CONFIG_DIR=$(load_param "/monitor/prometheus_config" "/home/ubuntu/wealist/prometheus/config")
          LOKI_CONFIG_DIR=$(load_param "/monitor/loki_config" "/home/ubuntu/wealist/loki/config")
          PROMTAIL_CONFIG_DIR=$(load_param "/monitor/promtail_config" "/home/ubuntu/wealist/promtail/config")
          RDS_CONFIG_DIR=$(load_param "/monitor/rds_config" "/home/ubuntu/wealist/rds_exporter/config")

          ELASTIC_URL=$(load_param "/monitor/elasticsearch_uri" "localhost")
          RDS_EXPORTER_IMAGE=$(load_param "/monitor/rds_exporter_image" "qonto/prometheus-rds-exporter:latest")

          # Service ports for Prometheus targets
          USER_SERVICE_PORT=$(load_param "/user_port" "8080")
          BOARD_SERVICE_PORT=$(load_param "/board_port" "8000")

          echo "✅ Configuration loaded successfully"

          # =============================================================================
          # STEP 3: SETUP DIRECTORY STRUCTURE
          # =============================================================================
          echo "📁 Setting up directory structure..."

          # Navigate to compose directory
          COMPOSE_DIR="${COMPOSE_FILE%/*}"
          sudo mkdir -p "${COMPOSE_DIR}"
          cd "${COMPOSE_DIR}"

          # Create all monitoring directories
          sudo mkdir -p /home/ubuntu/wealist/{prometheus/{config,data},grafana/{data,logs},loki/{config,data},promtail/config,rds_exporter/config}

          # Set proper permissions
          sudo chown -R ${CURRENT_USER}:${CURRENT_USER} /home/ubuntu/wealist/
          sudo chown -R 472:472 /home/ubuntu/wealist/grafana/
          sudo chown -R 65534:65534 /home/ubuntu/wealist/prometheus/data
          sudo chown -R 10001:10001 /home/ubuntu/wealist/loki/data || sudo chown -R ${CURRENT_USER}:${CURRENT_USER} /home/ubuntu/wealist/loki/data
          sudo chown -R ${CURRENT_USER}:${CURRENT_USER} /home/ubuntu/wealist/rds_exporter/

          echo "✅ Directory structure created and configured"

          # =============================================================================
          # STEP 4: DEPLOY CONFIGURATION FILES
          # =============================================================================
          echo "📝 Deploying configuration files..."

          # Deploy Docker Compose file
          echo "${COMPOSE_B64}" | base64 -d > docker-compose.yml

          # Deploy Prometheus configuration
          echo "${PROM_CFG_B64}" | base64 -d | sudo tee ${PROMETHEUS_CONFIG_DIR}/prometheus-prod-ec2.yml > /dev/null

          # Process Prometheus template variables
          echo "🔧 Processing Prometheus configuration template..."
          sudo sed -i \
              -e "s/{{USER_SERVICE_PORT}}/${USER_SERVICE_PORT}/g" \
              -e "s/{{BOARD_SERVICE_PORT}}/${BOARD_SERVICE_PORT}/g" \
              -e "s/{{NODE_EXPORTER_PORT}}/${NODE_EXPORTER_PORT}/g" \
              -e "s/{{RDS_EXPORTER_PORT}}/${RDS_EXPORTER_PORT}/g" \
              -e "s/{{ELASTIC_EXPORTER_PORT}}/${ELASTIC_EXPORTER_PORT}/g" \
              -e "s/{{PROMETHEUS_PORT}}/${PROMETHEUS_PORT}/g" \
              "${PROMETHEUS_CONFIG_DIR}/prometheus-prod-ec2.yml"

          # Deploy Loki configuration
          echo "${LOKI_CFG_B64}" | base64 -d | sudo tee ${LOKI_CONFIG_DIR}/local-config.yaml > /dev/null

          # Deploy Promtail configuration
          echo "${PROMTAIL_CFG_B64}" | base64 -d | sudo tee ${PROMTAIL_CONFIG_DIR}/promtail.yml > /dev/null

          # Deploy RDS Exporter configuration
          echo "${RDS_CFG_B64}" | base64 -d | sudo tee ${RDS_CONFIG_DIR}/config.yml > /dev/null

          # Create environment file with all variables
          cat > .env << ENV_EOF
          PROMETHEUS_PORT=${PROMETHEUS_PORT}
          GRAFANA_PORT=${GRAFANA_PORT}
          LOKI_PORT=${LOKI_PORT}
          NODE_EXPORTER_PORT=${NODE_EXPORTER_PORT}
          RDS_EXPORTER_PORT=${RDS_EXPORTER_PORT}
          ELASTIC_EXPORTER_PORT=${ELASTIC_EXPORTER_PORT}
          AWS_REGION=ap-northeast-2
          ES_URI=${ELASTIC_URL}:9200
          PROMETHEUS_CONFIG_DIR=${PROMETHEUS_CONFIG_DIR}
          LOKI_CONFIG_DIR=${LOKI_CONFIG_DIR}
          PROMTAIL_CONFIG_DIR=${PROMTAIL_CONFIG_DIR}
          RDS_CONFIG_DIR=${RDS_CONFIG_DIR}
          GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
          RDS_EXPORTER_IMAGE=${RDS_EXPORTER_IMAGE}
          ENV_EOF

          echo "✅ Configuration files deployed and processed"

          # =============================================================================
          # STEP 5: START MONITORING SERVICES
          # =============================================================================
          echo "🚀 Starting monitoring services..."

          # Pull images first
          echo "📦 Pulling Docker images..."
          sudo docker-compose pull

          # Start containers
          echo "🔄 Starting containers..."
          if ! sudo docker-compose up -d --remove-orphans; then
            echo "❌ Failed to start services"
            echo "📋 Docker Compose logs:"
            sudo docker-compose logs --tail=50
            exit 1
          fi

          # Wait for services to initialize
          echo "⏳ Waiting for services to initialize..."
          sleep 45

          echo "🎉 Enhanced Monitoring Stack deployment completed!"
          DEPLOY_SCRIPT

      # ============================================
      # 4. 배포 실행
      # ============================================
      - name: 🚀 Deploy via SSM with Complete Configuration
        id: deploy
        run: |
          echo "📦 Encoding configuration files..."

          # OIDC 신원 재확인
          echo "🔐 Verifying OIDC credentials..."
          PRINCIPAL_ARN=$(aws sts get-caller-identity --query "Arn" --output text)
          if [[ "$PRINCIPAL_ARN" != *"assumed-role/wealist-prod-github-actions-role"* ]]; then
            echo "❌ ERROR: Wrong IAM role detected: $PRINCIPAL_ARN"
            exit 1
          fi
          echo "✅ OIDC Role Verified: $PRINCIPAL_ARN"

          # Encode all configuration files
          COMPOSE_B64=$(base64 -w 0 docker/compose/docker-compose.ec2-prod-monitoring.yml)
          PROM_CFG_B64=$(base64 -w 0 prometheus/config/prometheus-prod-ec2.yml)
          LOKI_CFG_B64=$(base64 -w 0 loki/config/local-config.yaml)
          PROMTAIL_CFG_B64=$(base64 -w 0 promtail/promtail.yml)
          RDS_CFG_B64=$(base64 -w 0 rds_exporter/config.yml)
          SCRIPT_BASE64=$(base64 -w 0 /tmp/deploy-monitoring.sh)

          echo "✅ Files encoded successfully"

          # Send SSM command
          echo "🚀 Sending deployment command to EC2..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Enhanced Monitoring Stack (OIDC) - ${{ github.sha }}" \
            --timeout-seconds 1500 \
            --parameters commands="[
              \"echo 'Starting Enhanced Monitoring Deployment...'\",
              \"echo '${SCRIPT_BASE64}' | base64 -d > /tmp/deploy-monitoring.sh\",
              \"chmod +x /tmp/deploy-monitoring.sh\",
              \"export PARAMETER_PREFIX='${{ steps.config.outputs.parameter-prefix }}'\",
              \"export AWS_REGION='ap-northeast-2'\",
              \"export COMPOSE_FILE='${{ steps.config.outputs.compose-file-path }}'\",
              \"export COMPOSE_B64='${COMPOSE_B64}'\",
              \"export PROM_CFG_B64='${PROM_CFG_B64}'\",
              \"export LOKI_CFG_B64='${LOKI_CFG_B64}'\",
              \"export PROMTAIL_CFG_B64='${PROMTAIL_CFG_B64}'\",
              \"export RDS_CFG_B64='${RDS_CFG_B64}'\",
              \"/tmp/deploy-monitoring.sh 2>&1 | tee /tmp/deploy-monitoring.log\",
              \"echo 'Deployment finished with exit code:' \$?\",
              \"exit \$?\"
            ]" \
            --output text \
            --query "Command.CommandId")

          if [ -z "$COMMAND_ID" ]; then
            echo "❌ Failed to send SSM command"
            exit 1
          fi

          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Command sent successfully: ${COMMAND_ID}"

      # ============================================
      # 5. 배포 모니터링
      # ============================================
      - name: 📊 Monitor Deployment Progress
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command-id }}"
          echo "📊 Monitoring deployment progress: ${COMMAND_ID}"

          MAX_WAIT=900
          WAIT_TIME=0

          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "⏳ Status: $STATUS (${WAIT_TIME}s elapsed)"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Enhanced monitoring deployment completed!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              echo "📋 Command output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --query "StandardOutputContent" \
                --output text
              echo "📋 Error output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            
            sleep 30
            WAIT_TIME=$((WAIT_TIME + 30))
          done

          if [ $WAIT_TIME -ge $MAX_WAIT ]; then
            echo "❌ Deployment timed out after ${MAX_WAIT} seconds"
            exit 1
          fi

          # Show final deployment output
          echo "📋 Final deployment output:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
            --query "StandardOutputContent" \
            --output text

      # ============================================
      # 6. 배포 요약
      # ============================================
      - name: 📋 Deployment Summary
        run: |
          echo "### 🎉 Enhanced Monitoring Stack Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Authentication:** 🔐 OIDC" >> $GITHUB_STEP_SUMMARY
          echo "**Instance ID:** \`${{ steps.config.outputs.ec2-instance-id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY