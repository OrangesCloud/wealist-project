name: CD - Enhanced Monitoring Stack (Complete Fixed)

on:
  push:
    branches:
      - deploy-prod
    paths:
      - "prometheus/**"
      - "loki/**"
      - "promtail/**"
      - "rds_exporter/**"
      - "docker/compose/docker-compose.ec2-prod-monitoring.yml"
      - ".github/workflows/cd-prod-monitoring.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2

    steps:
      # ============================================
      # 0. Checkout 코드
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # 1. AWS Credentials 설정 (OIDC)
      # ============================================
      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::290008131187:role/wealist-prod-github-actions-role
          aws-region: ${{ vars.AWS_REGION }}

      # ============================================
      # 2. Configuration 설정
      # ============================================
      - name: 📥 Set Configuration Variables
        id: config
        run: |
          # EC2 인스턴스 ID 찾기 (ASG의 running 인스턴스 중 첫 번째)
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:aws:autoscaling:groupName,Values=wealist-prod-monitoring-asg" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text --region "${AWS_REGION}")

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] || [ "$INSTANCE_ID" = "null" ]; then
            echo "❌ No running EC2 instance found in ASG: wealist-prod-monitoring-asg"
            exit 1
          fi

          echo "✅ Found EC2 Instance: $INSTANCE_ID"
          echo "ec2-instance-id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "parameter-prefix=/wealist/prod" >> $GITHUB_OUTPUT
          echo "compose-file-path=/home/ubuntu/wealist/compose/docker-compose.yml" >> $GITHUB_OUTPUT

      # ============================================
      # 3. 배포 스크립트 생성 (EC2에서 실행될 스크립트)
      # ============================================
      - name: 📝 Create Complete Deployment Script
        run: |
          cat << 'DEPLOY_SCRIPT' > /tmp/deploy-monitoring.sh
          #!/bin/bash
          set -euo pipefail

          echo "=== Enhanced Monitoring Stack Deployment (OIDC) ==="
          echo "Timestamp: $(date)"
          echo "AWS Region: ${AWS_REGION:-ap-northeast-2}"
          echo "Parameter Prefix: ${PARAMETER_PREFIX:-}"
          echo "Compose File Path: ${COMPOSE_FILE:-}"

          # Get current user
          CURRENT_USER=$(whoami 2>/dev/null || echo "ubuntu")
          echo "📋 Current user: ${CURRENT_USER}"

          # =============================================================================
          # STEP 1: CLEANUP EXISTING MONITORING SERVICES
          # =============================================================================
          echo "🧹 Cleaning up existing monitoring services..."

          # Stop and remove monitoring containers
          CONTAINER_IDS=$(sudo docker ps -aq --filter "name=wealist-" 2>/dev/null || true)
          if [ -n "$CONTAINER_IDS" ]; then
            echo "Stopping containers: $CONTAINER_IDS"
            sudo docker stop $CONTAINER_IDS || echo "Warning: docker stop failed"
            sudo docker rm $CONTAINER_IDS || echo "Warning: docker rm failed"
          else
            echo "No containers to stop/remove"
          fi

          # Remove monitoring networks if exists
          if sudo docker network ls --format '{{.Name}}' | grep -q '^wealist-monitoring-net$'; then
            sudo docker network rm wealist-monitoring-net || echo "Warning: network removal failed"
          else
            echo "Network wealist-monitoring-net does not exist"
          fi

          # Clean up dangling volumes
          sudo docker volume prune -f || true

          echo "✅ Cleanup completed"

          # =============================================================================
          # STEP 1.5: INSTALL/UPDATE DOCKER COMPOSE
          # =============================================================================
          echo "🐳 Checking Docker Compose installation..."

          # Docker Compose 버전 확인
          if command -v docker-compose &> /dev/null; then
            CURRENT_VERSION=$(docker-compose --version | grep -oP '\d+\.\d+\.\d+' | head -1 || echo "0.0.0")
            echo "📦 Current Docker Compose version: ${CURRENT_VERSION}"
          else
            CURRENT_VERSION="0.0.0"
            echo "⚠️ Docker Compose not found"
          fi

          # 최신 버전 설치/업데이트 (v2.24.0 이상 권장)
          REQUIRED_VERSION="2.24.0"
          
          if [ "$(printf '%s\n' "$REQUIRED_VERSION" "$CURRENT_VERSION" | sort -V | head -n1)" != "$REQUIRED_VERSION" ]; then
            echo "📥 Installing/Updating Docker Compose to latest version..."
            
            # Docker Compose V2 설치 (standalone binary)
            COMPOSE_VERSION=$(curl -s https://api.github.com/repos/docker/compose/releases/latest | grep -Po '"tag_name": "\K[^"]*')
            echo "⬇️ Downloading Docker Compose ${COMPOSE_VERSION}..."
            
            sudo curl -L "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" \
              -o /usr/local/bin/docker-compose
            
            sudo chmod +x /usr/local/bin/docker-compose
            
            # 심볼릭 링크 생성
            sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose || true
            
            # 설치 확인
            if docker-compose --version; then
              echo "✅ Docker Compose installed successfully: $(docker-compose --version)"
            else
              echo "❌ Docker Compose installation failed"
              exit 1
            fi
          else
            echo "✅ Docker Compose is up to date: ${CURRENT_VERSION}"
          fi

          # Docker 서비스 실행 확인
          if ! sudo systemctl is-active --quiet docker; then
            echo "🔄 Starting Docker service..."
            sudo systemctl start docker
            sudo systemctl enable docker
          fi
          
          echo "✅ Docker and Docker Compose are ready"

          # =============================================================================
          # STEP 2: LOAD CONFIGURATION FROM SSM
          # =============================================================================
          echo "📋 Loading configuration from SSM Parameter Store..."

          load_param() {
            local param_name="$1"; local default_value="${2:-}"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            local value
            if value=$(aws ssm get-parameter --name "${full_param_path}" --query "Parameter.Value" --output text --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            elif [ -n "$default_value" ]; then
              echo "$default_value"
            else
              echo "❌ Parameter not found: ${full_param_path}" >&2
              return 1
            fi
          }

          load_secret() {
            local param_name="$1"; local default_value="${2:-}"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            local value
            if value=$(aws ssm get-parameter --name "${full_param_path}" --query "Parameter.Value" --output text --with-decryption --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            elif [ -n "$default_value" ]; then
              echo "$default_value"
            else
              echo "❌ Secret not found: ${full_param_path}" >&2
              return 1
            fi
          }

          # Load config
          GRAFANA_ADMIN_USER=$(load_param "/monitor/grafana_admin_user" "admin")
          GRAFANA_ADMIN_PASSWORD=$(load_secret "/monitor/grafana_admin_password" "admin123")
          PROMETHEUS_PORT=$(load_param "/monitor/prometheus_port" "9090")
          GRAFANA_PORT=$(load_param "/monitor/grafana_port" "3001")
          NODE_EXPORTER_PORT=$(load_param "/monitor/node_exporter_port" "9001")
          LOKI_PORT=$(load_param "/monitor/loki_port" "3100")
          RDS_EXPORTER_PORT=$(load_param "/monitor/rds_exporter_port" "9042")
          ELASTIC_EXPORTER_PORT=$(load_param "/monitor/elastic_exporter_port" "9114")

          PROMETHEUS_CONFIG_DIR=$(load_param "/monitor/prometheus_config" "/home/ubuntu/wealist/prometheus/config")
          LOKI_CONFIG_DIR=$(load_param "/monitor/loki_config" "/home/ubuntu/wealist/loki/config")
          PROMTAIL_CONFIG_DIR=$(load_param "/monitor/promtail_config" "/home/ubuntu/wealist/promtail/config")
          RDS_CONFIG_DIR=$(load_param "/monitor/rds_config" "/home/ubuntu/wealist/rds_exporter/config")

          ELASTIC_URL=$(load_param "/monitor/elasticsearch_uri" "localhost")
          RDS_EXPORTER_IMAGE=$(load_param "/monitor/rds_exporter_image" "qonto/prometheus-rds-exporter:latest")

          USER_SERVICE_PORT=$(load_param "/user_port" "8080")
          BOARD_SERVICE_PORT=$(load_param "/board_port" "8000")

          echo "✅ Configuration loaded successfully"

          # =============================================================================
          # STEP 3: SETUP DIRECTORY STRUCTURE
          # =============================================================================
          echo "📁 Setting up directory structure..."

          COMPOSE_DIR="${COMPOSE_FILE%/*}"
          sudo mkdir -p "${COMPOSE_DIR}"
          cd "${COMPOSE_DIR}" || exit 1

          sudo mkdir -p /home/ubuntu/wealist/{prometheus/{config,data},grafana/{data,logs},loki/{config,data},promtail/config,rds_exporter/config} || true

          # 권한 부여
          sudo chown -R ${CURRENT_USER}:${CURRENT_USER} /home/ubuntu/wealist/ || true
          sudo chown -R 472:472 /home/ubuntu/wealist/grafana/ || true
          sudo chown -R 65534:65534 /home/ubuntu/wealist/prometheus/data || true
          sudo chown -R 10001:10001 /home/ubuntu/wealist/loki/data || sudo chown -R ${CURRENT_USER}:${CURRENT_USER} /home/ubuntu/wealist/loki/data || true
          sudo chown -R ${CURRENT_USER}:${CURRENT_USER} /home/ubuntu/wealist/rds_exporter/ || true

          echo "✅ Directory structure created and configured"

          # =============================================================================
          # STEP 4: DEPLOY CONFIGURATION FILES
          # =============================================================================
          echo "📝 Deploying configuration files..."

          # Docker Compose 파일
          if [ -n "${COMPOSE_B64:-}" ]; then
            echo "${COMPOSE_B64}" | base64 -d > docker-compose.yml
            echo "✅ docker-compose.yml created"
          else
            echo "❌ COMPOSE_B64 not provided"
            exit 1
          fi

          # Prometheus 설정
          if [ -n "${PROM_CFG_B64:-}" ]; then
            echo "${PROM_CFG_B64}" | base64 -d | sudo tee ${PROMETHEUS_CONFIG_DIR}/prometheus-prod-ec2.yml > /dev/null
            echo "✅ Prometheus config created"
          fi

          # Prometheus 설정 템플릿 처리
          echo "🔧 Processing Prometheus configuration template..."
          if [ -f "${PROMETHEUS_CONFIG_DIR}/prometheus-prod-ec2.yml" ]; then
            sudo sed -i \
              -e "s/{{USER_SERVICE_PORT}}/${USER_SERVICE_PORT}/g" \
              -e "s/{{BOARD_SERVICE_PORT}}/${BOARD_SERVICE_PORT}/g" \
              -e "s/{{NODE_EXPORTER_PORT}}/${NODE_EXPORTER_PORT}/g" \
              -e "s/{{RDS_EXPORTER_PORT}}/${RDS_EXPORTER_PORT}/g" \
              -e "s/{{ELASTIC_EXPORTER_PORT}}/${ELASTIC_EXPORTER_PORT}/g" \
              -e "s/{{PROMETHEUS_PORT}}/${PROMETHEUS_PORT}/g" \
              "${PROMETHEUS_CONFIG_DIR}/prometheus-prod-ec2.yml" || true
            echo "✅ Prometheus config processed"
          fi

          # Loki 설정
          if [ -n "${LOKI_CFG_B64:-}" ]; then
            echo "${LOKI_CFG_B64}" | base64 -d | sudo tee ${LOKI_CONFIG_DIR}/local-config.yaml > /dev/null
            echo "✅ Loki config created"
          fi

          # Promtail 설정
          if [ -n "${PROMTAIL_CFG_B64:-}" ]; then
            echo "${PROMTAIL_CFG_B64}" | base64 -d | sudo tee ${PROMTAIL_CONFIG_DIR}/promtail.yml > /dev/null
            echo "✅ Promtail config created"
          fi

          # RDS Exporter 설정
          if [ -n "${RDS_CFG_B64:-}" ]; then
            echo "${RDS_CFG_B64}" | base64 -d | sudo tee ${RDS_CONFIG_DIR}/config.yml > /dev/null
            echo "✅ RDS Exporter config created"
          fi

          # .env 파일 생성
          cat > .env << ENV_EOF
          PROMETHEUS_PORT=${PROMETHEUS_PORT}
          GRAFANA_PORT=${GRAFANA_PORT}
          LOKI_PORT=${LOKI_PORT}
          NODE_EXPORTER_PORT=${NODE_EXPORTER_PORT}
          RDS_EXPORTER_PORT=${RDS_EXPORTER_PORT}
          ELASTIC_EXPORTER_PORT=${ELASTIC_EXPORTER_PORT}
          AWS_REGION=${AWS_REGION}
          ES_URI=${ELASTIC_URL}:9200
          PROMETHEUS_CONFIG_DIR=${PROMETHEUS_CONFIG_DIR}
          LOKI_CONFIG_DIR=${LOKI_CONFIG_DIR}
          PROMTAIL_CONFIG_DIR=${PROMTAIL_CONFIG_DIR}
          RDS_CONFIG_DIR=${RDS_CONFIG_DIR}
          GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
          RDS_EXPORTER_IMAGE=${RDS_EXPORTER_IMAGE}
          ENV_EOF

          echo "✅ .env file created"
          echo "✅ Configuration files deployed and processed"

          # =============================================================================
          # STEP 5: START MONITORING SERVICES
          # =============================================================================
          echo "🚀 Starting monitoring services..."

          # Docker Compose 명령어 선택 (v1 vs v2)
          if docker compose version &> /dev/null; then
            COMPOSE_CMD="docker compose"
            echo "📦 Using Docker Compose V2 (plugin)"
          elif docker-compose --version &> /dev/null; then
            COMPOSE_CMD="docker-compose"
            echo "📦 Using Docker Compose V1 (standalone)"
          else
            echo "❌ Docker Compose not available"
            exit 1
          fi

          # Pull images
          echo "📦 Pulling Docker images..."
          if ! sudo ${COMPOSE_CMD} pull; then
            echo "⚠️ Some images failed to pull, continuing..."
          fi

          # Start services
          echo "🔄 Starting containers..."
          if ! sudo ${COMPOSE_CMD} up -d --remove-orphans; then
            echo "❌ Failed to start services"
            echo "📋 Docker Compose logs:"
            sudo ${COMPOSE_CMD} logs --tail=50 || true
            exit 1
          fi

          echo "⏳ Waiting for services to initialize..."
          sleep 45

          # Health check
          echo "🔍 Checking service health..."
          sudo ${COMPOSE_CMD} ps

          echo "🎉 Enhanced Monitoring Stack deployment completed!"
          DEPLOY_SCRIPT

      # ============================================
      # 4. 배포 실행 (SSM으로 EC2에서 스크립트 실행)
      # ============================================
      - name: 🚀 Deploy via SSM with Complete Configuration
        id: deploy
        run: |
          echo "📦 Encoding configuration files..."

          # OIDC 신원 재확인
          echo "🔐 Verifying OIDC credentials..."
          PRINCIPAL_ARN=$(aws sts get-caller-identity --query "Arn" --output text --region "${AWS_REGION}")
          if [[ "$PRINCIPAL_ARN" != *"assumed-role/wealist-prod-github-actions-role"* ]]; then
            echo "❌ ERROR: Wrong IAM role detected: $PRINCIPAL_ARN"
            exit 1
          fi
          echo "✅ OIDC Role Verified: $PRINCIPAL_ARN"

          # Encode all configuration files (base64)
          COMPOSE_B64=$(base64 -w 0 docker/compose/docker-compose.ec2-prod-monitoring.yml || true)
          PROM_CFG_B64=$(base64 -w 0 prometheus/config/prometheus-prod-ec2.yml || true)
          LOKI_CFG_B64=$(base64 -w 0 loki/config/local-config.yaml || true)
          PROMTAIL_CFG_B64=$(base64 -w 0 promtail/config/promtail.yml || true)
          RDS_CFG_B64=$(base64 -w 0 rds_exporter/config.yml || true)
          SCRIPT_BASE64=$(base64 -w 0 /tmp/deploy-monitoring.sh || true)

          echo "✅ Files encoded successfully"

          # SSM 명령 실행
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Enhanced Monitoring Stack (OIDC) - ${{ github.sha }}" \
            --timeout-seconds 1500 \
            --parameters commands="[
              \"echo 'Starting Enhanced Monitoring Deployment...'\",
              \"echo '${SCRIPT_BASE64}' | base64 -d > /tmp/deploy-monitoring.sh\",
              \"chmod +x /tmp/deploy-monitoring.sh\",
              \"export PARAMETER_PREFIX='${{ steps.config.outputs.parameter-prefix }}'\",
              \"export AWS_REGION='${AWS_REGION}'\",
              \"export COMPOSE_FILE='${{ steps.config.outputs.compose-file-path }}'\",
              \"export COMPOSE_B64='${COMPOSE_B64}'\",
              \"export PROM_CFG_B64='${PROM_CFG_B64}'\",
              \"export LOKI_CFG_B64='${LOKI_CFG_B64}'\",
              \"export PROMTAIL_CFG_B64='${PROMTAIL_CFG_B64}'\",
              \"export RDS_CFG_B64='${RDS_CFG_B64}'\",
              \"/tmp/deploy-monitoring.sh 2>&1 | tee /tmp/deploy-monitoring.log\",
              \"echo 'Deployment finished with exit code:' \\$?\",
              \"exit \\$?\"
            ]" \
            --output text \
            --query "Command.CommandId" --region "${AWS_REGION}")

          if [ -z "$COMMAND_ID" ]; then
            echo "❌ Failed to send SSM command"
            exit 1
          fi

          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Command sent successfully: ${COMMAND_ID}"

      # ============================================
      # 5. 배포 모니터링 (SSM 명령 상태 확인)
      # ============================================
      - name: 📊 Monitor Deployment Progress
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command-id }}"
          INSTANCE_ID="${{ steps.config.outputs.ec2-instance-id }}"
          echo "📊 Monitoring deployment progress: ${COMMAND_ID} on ${INSTANCE_ID}"

          MAX_WAIT=1800   # 30 minutes
          WAIT_TIME=0
          INTERVAL=30

          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text --region "${AWS_REGION}" 2>/dev/null || echo "Pending")

            echo "⏳ Status: $STATUS (${WAIT_TIME}s elapsed)"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Enhanced monitoring deployment completed!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              echo "📋 Command output:"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text --region "${AWS_REGION}" || true
              echo "📋 Error output:"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text --region "${AWS_REGION}" || true
              exit 1
            fi

            sleep $INTERVAL
            WAIT_TIME=$((WAIT_TIME + INTERVAL))
          done

          if [ $WAIT_TIME -ge $MAX_WAIT ]; then
            echo "❌ Deployment timed out after ${MAX_WAIT} seconds"
            exit 1
          fi

          # Show final deployment output
          echo "📋 Final deployment output:"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text --region "${AWS_REGION}" || true

      # ============================================
      # 6. 배포 요약
      # ============================================
      - name: 📋 Deployment Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### 🎉 Enhanced Monitoring Stack Deployment Complete
          
          **Authentication:** 🔐 OIDC  
          **Instance ID:** \`${{ steps.config.outputs.ec2-instance-id }}\`  
          **Command ID:** \`${{ steps.deploy.outputs.command-id }}\`  
          **Commit SHA:** \`${{ github.sha }}\`  
          **Branch:** \`${{ github.ref_name }}\`  
          **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          ---
          
          #### 🐳 Docker Compose
          - Auto-install/update enabled
          - Supports V1 and V2
          
          #### 🔐 Configuration
          - Loaded from SSM Parameter Store
          - Secrets encrypted with KMS
          
          #### 📦 Services Deployed
          - Prometheus
          - Grafana
          - Loki
          - Promtail
          - RDS Exporter
          - Node Exporter
          - Elasticsearch Exporter
          EOF