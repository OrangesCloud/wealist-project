name: CD - Enhanced Monitoring Stack

on:
  push:
    branches:
      - deploy-prod
    paths:
      - "prometheus/**"
      - "loki/**"
      - "promtail/**"
      - "docker/compose/docker-compose.ec2-prod-monitoring.yml"
      - ".github/workflows/cd-prod-monitoring.yml"
  workflow_dispatch:

permissions:
  id-token: write
  actions: write

jobs:
  deploy-enhanced-monitoring:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.WEALIST_DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WEALIST_DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Load Base Configuration
        id: config
        run: |
          EC2_ID=$(aws ssm get-parameter --name "/wealist/prod/cd/ec2_instance_id" --query "Parameter.Value" --output text --with-decryption)
          COMPOSE_DIR=$(aws ssm get-parameter --name "/wealist/prod/monitor/compose_file_path" --query "Parameter.Value" --output text)
          PARAM_PREFIX=$(aws ssm get-parameter --name "/wealist/prod/cd/parameter_prefix" --query "Parameter.Value" --output text)
          echo "ec2-instance-id=$EC2_ID" >> $GITHUB_OUTPUT
          echo "compose-file-path=$COMPOSE_DIR" >> $GITHUB_OUTPUT
          echo "parameter-prefix=$PARAM_PREFIX" >> $GITHUB_OUTPUT
          echo "aws-region=ap-northeast-2" >> $GITHUB_OUTPUT

      - name: Create Enhanced Deployment Script with Docker Installation
        run: |
          cat << 'DEPLOY_SCRIPT' > /tmp/deploy-enhanced-monitoring.sh
          #!/bin/bash
          set -euo pipefail
          echo "=== Starting Enhanced Monitoring Stack Deployment ==="
          echo "Timestamp: $(date)"
          echo "Parameter Prefix: ${PARAMETER_PREFIX}"
          echo "Compose File Path: ${COMPOSE_FILE}"

          # Check if Docker is installed
          echo "🔍 Checking Docker installation..."
          if ! command -v docker &> /dev/null; then
            echo "❌ Docker not found. Installing Docker..."
            
            # Update system
            sudo yum update -y
            
            # Install Docker
            sudo amazon-linux-extras install docker -y
            
            # Start Docker service
            sudo systemctl start docker
            sudo systemctl enable docker
            
            # Add ec2-user to docker group
            sudo usermod -a -G docker ec2-user
            
            echo "✅ Docker installed successfully"
          else
            echo "✅ Docker is already installed"
          fi

          # Ensure Docker is running
          if ! sudo systemctl is-active --quiet docker; then
            echo "🚀 Starting Docker service..."
            sudo systemctl start docker
          fi

          # Check if Docker Compose is installed
          echo "🔍 Checking Docker Compose installation..."
          if ! command -v docker-compose &> /dev/null; then
            echo "❌ Docker Compose not found. Installing Docker Compose..."
            
            # Install Docker Compose
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            
            # Create symlink for easier access
            sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
            
            echo "✅ Docker Compose installed successfully"
          else
            echo "✅ Docker Compose is already installed"
          fi

          # Verify installations
          echo "📋 Verifying installations..."
          echo "Docker version: $(sudo docker --version)"
          echo "Docker Compose version: $(sudo docker-compose --version)"

          # Function to load regular parameters
          load_param() {
            local param_name="$1"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            echo "Loading parameter: ${full_param_path}" >&2
            
            local value
            if value=$(aws ssm get-parameter \
              --name "${full_param_path}" \
              --query "Parameter.Value" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            else
              echo "❌ Failed to load parameter: ${full_param_path}" >&2
              return 1
            fi
          }

          # Function to load secret parameters
          load_secret() {
            local param_name="$1"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            echo "Loading secret: ${full_param_path}" >&2
            
            local value
            if value=$(aws ssm get-parameter \
              --name "${full_param_path}" \
              --query "Parameter.Value" \
              --output text \
              --with-decryption \
              --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            else
              echo "❌ Failed to load secret: ${full_param_path}" >&2
              return 1
            fi
          }

          echo "📋 Loading environment variables from SSM..."
          
          # Load core monitoring parameters
          GRAFANA_ADMIN_USER=$(load_param "/monitor/grafana_admin_user")
          GRAFANA_ADMIN_PASSWORD=$(load_secret "/monitor/grafana_admin_password")
          PROMETHEUS_PORT=9090
          GRAFANA_PORT=3001
          NODE_EXPORTER_PORT=9001
          PROMETHEUS_CONFIG_DIR=$(load_param "/monitor/prometheus_config")

          # Load NEW monitoring parameters
          RDS_EXPORTER_PORT=$(load_param "/monitor/rds_exporter_port")
          ELASTIC_EXPORTER_PORT=$(load_param "/monitor/elastic_exporter_port")
          LOKI_PORT=$(load_param "/monitor/loki_port")
          PROMTAIL_CONFIG_DIR=$(load_param "/monitor/promtail_config")
          LOKI_CONFIG_DIR=$(load_param "/monitor/loki_config")

          # Load AWS region
          AWS_REGION_PARAM=$(load_param "/cd/aws_region")

          # Load Elasticsearch connection info
          ES_URI=$(load_param "/monitor/elasticsearch_uri")
          ES_USERNAME=""
          ES_PASSWORD=""

          # Load service ports for Prometheus scraping
          USER_SERVICE_PORT=8080
          BOARD_SERVICE_PORT=8000

          # Export all variables
          export GRAFANA_ADMIN_USER GRAFANA_ADMIN_PASSWORD PROMETHEUS_PORT GRAFANA_PORT
          export NODE_EXPORTER_PORT PROMETHEUS_CONFIG_DIR RDS_EXPORTER_PORT ELASTIC_EXPORTER_PORT
          export LOKI_PORT PROMTAIL_CONFIG_DIR LOKI_CONFIG_DIR
          export AWS_REGION="${AWS_REGION_PARAM}"
          export ES_URI ES_USERNAME ES_PASSWORD
          export USER_SERVICE_PORT BOARD_SERVICE_PORT

          # AWS 자격증명 export
          if [ -n "${AWS_ACCESS_KEY_FROM_GITHUB:-}" ]; then
            export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_FROM_GITHUB}"
          fi
          if [ -n "${AWS_SECRET_ACCESS_KEY_FROM_GITHUB:-}" ]; then
            export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY_FROM_GITHUB}"
          fi

          echo "✅ Environment variables loaded successfully"

          # Navigate to compose directory
          echo "📂 Navigating to compose directory: ${COMPOSE_FILE%/*}"
          cd "${COMPOSE_FILE%/*}"

          # Decode and save docker-compose file
          echo "📝 Updating docker-compose file..."
          echo "${COMPOSE_B64}" | base64 -d > docker-compose.ec2-prod-monitoring.yml

          # Remove version from docker-compose file
          sed -i '/^version:/d' docker-compose.ec2-prod-monitoring.yml

          # Fix port configurations
          sed -i "s|\${PROMETHEUS_PORT}|${PROMETHEUS_PORT}:${PROMETHEUS_PORT}|g" docker-compose.ec2-prod-monitoring.yml
          sed -i "s|\${GRAFANA_PORT}|${GRAFANA_PORT}:3000|g" docker-compose.ec2-prod-monitoring.yml
          sed -i "s|\${NODE_EXPORTER_PORT}|${NODE_EXPORTER_PORT}:${NODE_EXPORTER_PORT}|g" docker-compose.ec2-prod-monitoring.yml
          sed -i "s|\${RDS_EXPORTER_PORT}|${RDS_EXPORTER_PORT}:9042|g" docker-compose.ec2-prod-monitoring.yml
          sed -i "s|\${ELASTIC_EXPORTER_PORT}|${ELASTIC_EXPORTER_PORT}:9114|g" docker-compose.ec2-prod-monitoring.yml

          # Update environment variables
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
            sed -i "s|\${AWS_ACCESS_KEY_ID}|${AWS_ACCESS_KEY_ID}|g" docker-compose.ec2-prod-monitoring.yml
          fi
          if [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            sed -i "s|\${AWS_SECRET_ACCESS_KEY}|${AWS_SECRET_ACCESS_KEY}|g" docker-compose.ec2-prod-monitoring.yml
          fi
          sed -i "s|\${AWS_REGION}|${AWS_REGION}|g" docker-compose.ec2-prod-monitoring.yml
          sed -i "s|\${ES_URI}|${ES_URI}|g" docker-compose.ec2-prod-monitoring.yml
          sed -i "s|\${PROMETHEUS_CONFIG_DIR}|${PROMETHEUS_CONFIG_DIR}|g" docker-compose.ec2-prod-monitoring.yml

          # Create configuration directories
          echo "📁 Creating configuration directories..."
          sudo mkdir -p ${PROMETHEUS_CONFIG_DIR}
          sudo mkdir -p ${LOKI_CONFIG_DIR}  
          sudo mkdir -p ${PROMTAIL_CONFIG_DIR}

          # Decode and save configuration files
          echo "📝 Updating configuration files..."
          
          # Prometheus config
          echo "${PROM_CFG_B64}" | base64 -d | sudo tee ${PROMETHEUS_CONFIG_DIR}/prometheus-ec2.yml > /dev/null
          
          # Loki config  
          echo "${LOKI_CFG_B64}" | base64 -d | sudo tee ${LOKI_CONFIG_DIR}/local-config.yaml > /dev/null
          
          # Promtail config
          echo "${PROMTAIL_CFG_B64}" | base64 -d | sudo tee ${PROMTAIL_CONFIG_DIR}/promtail.yml > /dev/null

          # Set proper permissions
          sudo chown -R ec2-user:ec2-user ${PROMETHEUS_CONFIG_DIR%/*}

          # Process template variables in Prometheus config
          echo "🔧 Processing Prometheus template variables..."
          sudo sed -i \
              -e "s/{{USER_SERVICE_PORT}}/${USER_SERVICE_PORT}/g" \
              -e "s/{{BOARD_SERVICE_PORT}}/${BOARD_SERVICE_PORT}/g" \
              -e "s/{{NODE_EXPORTER_PORT}}/${NODE_EXPORTER_PORT}/g" \
              -e "s/{{RDS_EXPORTER_PORT}}/${RDS_EXPORTER_PORT}/g" \
              -e "s/{{ELASTIC_EXPORTER_PORT}}/${ELASTIC_EXPORTER_PORT}/g" \
              -e "s/{{PROMETHEUS_PORT}}/${PROMETHEUS_PORT}/g" \
              "${PROMETHEUS_CONFIG_DIR}/prometheus-ec2.yml"

          # Debug: Show docker-compose file content
          echo "🔍 Docker-compose file content:"
          head -20 docker-compose.ec2-prod-monitoring.yml

          # Validate docker-compose file
          echo "🔍 Validating docker-compose file syntax..."
          if ! sudo docker-compose -f docker-compose.ec2-prod-monitoring.yml config >/dev/null 2>&1; then
            echo "❌ Invalid docker-compose file"
            sudo docker-compose -f docker-compose.ec2-prod-monitoring.yml config 2>&1 || true
            exit 1
          fi

          echo "✅ Docker-compose file validation passed"

          # Deploy enhanced monitoring services
          echo "🚀 Deploying enhanced monitoring services..."
          
          # Pull images first
          echo "📥 Pulling Docker images..."
          sudo docker-compose -f docker-compose.ec2-prod-monitoring.yml pull

          # Start services
          if ! sudo docker-compose -f docker-compose.ec2-prod-monitoring.yml up -d; then
            echo "❌ Failed to start services"
            echo "📋 Docker-compose logs:"
            sudo docker-compose -f docker-compose.ec2-prod-monitoring.yml logs --tail=50
            echo "📋 Docker system info:"
            sudo docker system df
            sudo docker ps -a
            exit 1
          fi

          # Wait for services to be ready
          echo "⏳ Waiting for services to start..."
          sleep 30

          # Check container status
          echo "📋 Checking container status..."
          sudo docker ps -a

          # Health check function
          health_check() {
            local service_name="$1"
            local port="$2"
            local endpoint="${3:-/}"
            local max_attempts=8
            local attempt=1
            
            echo "🔍 Health checking ${service_name} on port ${port}${endpoint}..."
            
            while [ $attempt -le $max_attempts ]; do
              local http_code
              if http_code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "http://localhost:${port}${endpoint}" 2>/dev/null); then
                if echo "$http_code" | grep -q "200\|302\|404"; then
                  echo "  ✅ ${service_name} is responding (HTTP ${http_code})"
                  return 0
                fi
              fi
              
              echo "  ⏳ ${service_name} not ready yet (${attempt}/${max_attempts})"
              sleep 10
              ((attempt++))
            done
            
            echo "  ⚠️ ${service_name} health check failed, but continuing..."
            return 1
          }

          # Perform health checks
          echo "🏥 Performing health checks..."
          
          # Check services
          health_check "prometheus" "${PROMETHEUS_PORT}" "/" || echo "  ⚠️  Prometheus not responding"
          health_check "grafana" "${GRAFANA_PORT}" "/login" || echo "  ⚠️  Grafana not responding" 
          health_check "loki" "3100" "/ready" || echo "  ⚠️  Loki not responding"
          health_check "node-exporter" "${NODE_EXPORTER_PORT}" "/metrics" || echo "  ⚠️  Node exporter not responding"

          echo ""
          echo "🎉 Enhanced Monitoring Stack deployment completed!"
          echo "📊 Services should be available at:"
          echo "  - Prometheus: http://localhost:${PROMETHEUS_PORT}"
          echo "  - Grafana: http://localhost:${GRAFANA_PORT}"
          echo "  - Loki: http://localhost:3100"
          echo "  - Node Exporter: http://localhost:${NODE_EXPORTER_PORT}/metrics"
          
          DEPLOY_SCRIPT

      - name: Deploy Enhanced Monitoring Stack via SSM
        id: deploy
        run: |
          # Base64 encode all configuration files
          COMPOSE_B64=$(base64 -w 0 docker/compose/docker-compose.ec2-prod-monitoring.yml)
          PROM_CFG_B64=$(base64 -w 0 prometheus/config/prometheus-ec2.yml)
          LOKI_CFG_B64=$(base64 -w 0 loki/config/local-config.yaml)
          PROMTAIL_CFG_B64=$(base64 -w 0 promtail/promtail.yml)
          
          # Base64 encode deployment script
          echo "📦 Encoding deployment script..."
          SCRIPT_BASE64=$(base64 -w 0 /tmp/deploy-enhanced-monitoring.sh)
          echo "✅ Script encoded (${#SCRIPT_BASE64} bytes)"

          # Send SSM Run Command
          echo "🚀 Sending enhanced monitoring deployment command..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Enhanced Monitoring Stack - ${{ github.sha }}" \
            --timeout-seconds 900 \
            --parameters commands="[
              \"echo '=== Enhanced Monitoring Stack Deployment Started ===' \",
              \"echo 'Timestamp: '\$(date) \",
              \"echo 'Instance ID: '\$(ec2-metadata --instance-id 2>/dev/null || echo 'N/A') \",
              \"echo 'GitHub SHA: ${{ github.sha }}' \",
              \"echo '' \",
              \"echo '${SCRIPT_BASE64}' | base64 -d > /tmp/deploy-enhanced-monitoring.sh\",
              \"chmod +x /tmp/deploy-enhanced-monitoring.sh\",
              \"echo '🚀 Starting enhanced deployment script execution...' \",
              \"export PARAMETER_PREFIX='${{ steps.config.outputs.parameter-prefix }}'\",
              \"export AWS_REGION='${{ steps.config.outputs.aws-region }}'\",
              \"export COMPOSE_FILE='${{ steps.config.outputs.compose-file-path }}'\",
              \"export COMPOSE_B64='${COMPOSE_B64}'\",
              \"export PROM_CFG_B64='${PROM_CFG_B64}'\",
              \"export LOKI_CFG_B64='${LOKI_CFG_B64}'\",
              \"export PROMTAIL_CFG_B64='${PROMTAIL_CFG_B64}'\",
              \"export AWS_ACCESS_KEY_FROM_GITHUB='${{ secrets.WEALIST_PROD_AWS_ACCESS_KEY_ID }}'\",
              \"export AWS_SECRET_ACCESS_KEY_FROM_GITHUB='${{ secrets.WEALIST_PROD_AWS_SECRET_ACCESS_KEY }}'\",
              \"/tmp/deploy-enhanced-monitoring.sh 2>&1 | tee /tmp/deploy-enhanced-monitoring.log\",
              \"DEPLOY_EXIT_CODE=\${PIPESTATUS[0]}\",
              \"echo '' \",
              \"echo '=== Enhanced Deployment Script Finished ===' \",
              \"echo 'Exit Code: '\$DEPLOY_EXIT_CODE \",
              \"if [ \$DEPLOY_EXIT_CODE -ne 0 ]; then echo '📋 Recent logs:'; tail -100 /tmp/deploy-enhanced-monitoring.log; fi\",
              \"exit \$DEPLOY_EXIT_CODE\"
            ]" \
            --output text \
            --query "Command.CommandId")

          if [ -z "$COMMAND_ID" ]; then
            echo "❌ Failed to send SSM command"
            exit 1
          fi

          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Command sent successfully"
          echo "📝 Command ID: ${COMMAND_ID}"

      - name: Monitor Enhanced Deployment Progress
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command-id }}"
          echo "📊 Monitoring enhanced deployment progress: ${COMMAND_ID}"
          
          MAX_WAIT=600
          WAIT_TIME=0
          
          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "⏳ Status: $STATUS (${WAIT_TIME}s elapsed)"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Enhanced monitoring deployment completed!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              echo "📋 Command output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --query "StandardOutputContent" \
                --output text
              echo "📋 Error output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            
            sleep 25
            WAIT_TIME=$((WAIT_TIME + 25))
          done
          
          if [ $WAIT_TIME -ge $MAX_WAIT ]; then
            echo "❌ Deployment timed out after ${MAX_WAIT} seconds"
            exit 1
          fi

          # Show final output
          echo "📋 Final deployment output:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
            --query "StandardOutputContent" \
            --output text