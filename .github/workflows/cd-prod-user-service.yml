name: CD - Prod User Service

on:
  # 1. CI 완료 후 자동 실행: CI에서 생성한 아티팩트를 S3에 업로드했습니다.
  workflow_run:
    workflows: ["CI - Prod User Service"]
    types:
      - completed

  # 2. 수동 실행 (강제 재배포)
  workflow_dispatch:
    inputs:
      reason:
        description: "배포 사유 (선택)"
        required: false
        type: string

permissions:
  contents: read
  actions: read # CI 실행 정보를 가져오기 위해 필요

jobs:
  deploy:
    name: Deploy to EC2 via CodeDeploy
    runs-on: ubuntu-latest
    environment: production

    # workflow_run으로 트리거된 경우, CI가 성공했고 deploy-prod 브랜치일 때만 실행
    if: |
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success' && 
       github.event.workflow_run.head_branch == 'deploy-prod')

    steps:
      # ============================================
      # 1. AWS Credentials 설정
      # ============================================
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.WEALIST_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WEALIST_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # ============================================
      # 2. CodeDeploy 설정 변수 로드 (S3 버킷 이름 직접 설정)
      # ============================================
      - name: 📥 Load CodeDeploy Configuration
        id: config
        run: |
          # CodeDeploy Application 및 Deployment Group 이름은 하드코딩 (기존 유지)
          echo "COEDEPLOY_APP_NAME=wealist-user-app-codeDeploy" >> $GITHUB_ENV
          echo "COEDEPLOY_GROUP_NAME=wealist-user-app-codeDeploy-tg" >> $GITHUB_ENV

          # ✅ 변경 사항: CodeDeploy 전용 S3 버킷을 직접 사용 (SSM 로직 제거)
          echo "S3_BUCKET=wealist-codedeploy-artifacts" >> $GITHUB_ENV

          echo "✅ CodeDeploy configuration loaded. S3 Bucket: ${{ env.S3_BUCKET }}"

      # ============================================
      # 3. CI 정보 추출 및 S3 Key 계산 (수정됨: 다운로드 로직 제거)
      # ============================================
      - name: 🔍 Get CI Info and Calculate S3 Key
        uses: actions/github-script@v7
        id: calculate_key
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-prod-user-service.yml',
              branch: 'deploy-prod',
              per_page: 1,
              status: 'success'
            });
            const latestRun = runs.workflow_runs[0];

            if (!latestRun) {
                core.setFailed('No successful CI run found. Aborting.');
                return;
            }

            const shaTag = latestRun.head_sha.substring(0, 7);
            const artifactFilename = `user-service-${shaTag}.zip`;
            const s3Key = `user-service/${artifactFilename}`;

            core.setOutput('sha_tag', shaTag);
            core.setOutput('s3_key', s3Key);

            console.log(`✅ Calculated S3 Key: ${s3Key}`);

      # ============================================
      # 4. CodeDeploy 배포 트리거 (수정됨: Step 번호 변경)
      # ============================================
      - name: 🚀 Trigger CodeDeploy Deployment
        id: deploy_trigger
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.COEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ env.COEDEPLOY_GROUP_NAME }} \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --description "User Service Deployment ${{ steps.calculate_key.outputs.sha_tag }}" \
            --s3-location bucket=${{ env.S3_BUCKET }},key=${{ steps.calculate_key.outputs.s3_key }},bundleType=zip \
            --query "deploymentId" \
            --output text)
            
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "❌ Failed to create CodeDeploy deployment."
            exit 1
          fi

          echo "✅ CodeDeploy Deployment ID: $DEPLOYMENT_ID"

      # ============================================
      # 5. 배포 결과 대기 및 상태 확인 (수정됨: Step 번호 변경)
      # ============================================
      - name: ⏳ Wait for CodeDeploy Completion
        run: |
          echo "⏳ Waiting for deployment ${{ env.DEPLOYMENT_ID }} to complete..."
          aws deploy wait deployment-successful --deployment-id ${{ env.DEPLOYMENT_ID }}
          echo "✅ Deployment successful!"

      # ============================================
      # 6. 최종 상태 확인 및 요약 (수정됨: Step 번호 변경)
      # ============================================
      - name: 📊 Get Final Status and Summarize
        if: always()
        run: |
          STATUS=$(aws deploy get-deployment --deployment-id ${{ env.DEPLOYMENT_ID }} --query "deploymentInfo.status" --output text)

          # ... (요약 출력 로직 생략 없이 동일)

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ${ICON} ${TITLE}

          - **Service:** User Service
          - **Tag:** \`${{ steps.calculate_key.outputs.sha_tag }}\`
          - **Deployment ID:** \`${{ env.DEPLOYMENT_ID }}\`
          - **S3 Location:** \`s3://${{ env.S3_BUCKET }}/${{ steps.calculate_key.outputs.s3_key }}\`
          - **Status:** **${STATUS}**
          - **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          #### CodeDeploy Links
          - [View Deployment in AWS]
            EOF

          if [ "$STATUS" != "Succeeded" ]; then
              exit 1
          fi
