name: CD - Prod User Service

on:
  # 1. CI 완료 후 자동 실행: CI에서 생성한 아티팩트를 S3에 업로드했습니다.
  workflow_run:
    workflows: ["CI - Prod User Service"]
    types:
      - completed

  # 2. 수동 실행 (강제 재배포)
  workflow_dispatch:
    inputs:
      reason:
        description: "배포 사유 (선택)"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    name: Deploy to EC2 via CodeDeploy
    runs-on: ubuntu-latest
    # workflow_run으로 트리거된 경우, CI가 성공했고 deploy-prod 브랜치일 때만 실행
    if: |
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success' && 
       github.event.workflow_run.head_branch == 'deploy-prod')

    steps:
      # ============================================
      # 1. AWS Credentials 설정 (OIDC)
      # ============================================
      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::290008131187:role/wealist-prod-github-actions-role
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-cd-${{ github.run_id }}

      # ============================================
      # 2. CodeDeploy 설정 변수 로드
      # ============================================
      - name: 📥 Load CodeDeploy Configuration
        id: config
        run: |
          echo "CODEDEPLOY_APP_NAME=wealist-user-app-codeDeploy" >> $GITHUB_ENV
          echo "CODEDEPLOY_GROUP_NAME=wealist-user-app-codeDeploy-tg" >> $GITHUB_ENV
          echo "S3_BUCKET=wealist-codedeploy-artifacts" >> $GITHUB_ENV

          echo "✅ CodeDeploy configuration loaded."

      # ============================================
      # 3. CI 정보 추출 및 S3 Key 계산
      # ============================================
      - name: 🔍 Get CI Info and Calculate S3 Key
        uses: actions/github-script@v7
        id: calculate_key
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-prod-user-service.yml',
              branch: 'deploy-prod',
              per_page: 1,
              status: 'success'
            });
            const latestRun = runs.workflow_runs[0];

            if (!latestRun) {
                core.setFailed('No successful CI run found. Aborting.');
                return;
            }

            const shaTag = latestRun.head_sha.substring(0, 7);
            const artifactFilename = `user-service-${shaTag}.zip`;
            const s3Key = `user-service/${artifactFilename}`;

            core.setOutput('sha_tag', shaTag);
            core.setOutput('s3_key', s3Key);

            console.log(`✅ Calculated S3 Key: ${s3Key}`);

      # ============================================
      # 4. CodeDeploy 배포 트리거
      # ============================================
      - name: 🚀 Trigger CodeDeploy Deployment
        id: deploy_trigger
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ env.CODEDEPLOY_GROUP_NAME }} \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --description "User Service Deployment ${{ steps.calculate_key.outputs.sha_tag }}" \
            --s3-location bucket=${{ env.S3_BUCKET }},key=${{ steps.calculate_key.outputs.s3_key }},bundleType=zip \
            --query "deploymentId" \
            --output text)
            
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "❌ Failed to create CodeDeploy deployment."
            exit 1
          fi

          echo "✅ CodeDeploy Deployment ID: $DEPLOYMENT_ID"

      # ============================================
      # 5. 배포 결과 대기
      # ============================================
      - name: ⏳ Wait for CodeDeploy Completion
        run: |
          echo "⏳ Waiting for deployment ${{ env.DEPLOYMENT_ID }} to complete..."
          aws deploy wait deployment-successful --deployment-id ${{ env.DEPLOYMENT_ID }}
          echo "✅ Deployment successful!"

      # ============================================
      # 6. 최종 상태 확인 및 요약
      # ============================================
      - name: 📊 Get Final Status and Summarize
        if: always()
        run: |
          STATUS=$(aws deploy get-deployment --deployment-id ${{ env.DEPLOYMENT_ID }} --query "deploymentInfo.status" --output text)

          if [ "$STATUS" == "Succeeded" ]; then
            ICON="✅"
            TITLE="User Service Deployment Succeeded"
          else
            ICON="❌"
            TITLE="User Service Deployment Failed"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ${ICON} ${TITLE}

          - **Service:** User Service
          - **Tag:** \`${{ steps.calculate_key.outputs.sha_tag }}\`
          - **Deployment ID:** \`${{ env.DEPLOYMENT_ID }}\`
          - **S3 Location:** \`s3://${{ env.S3_BUCKET }}/${{ steps.calculate_key.outputs.s3_key }}\`
          - **Status:** **${STATUS}**
          - **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          #### CodeDeploy Links
          - [View Deployment in AWS Console](https://ap-northeast-2.console.aws.amazon.com/codesuite/codedeploy/deployments/${{ env.DEPLOYMENT_ID }})
          EOF

          if [ "$STATUS" != "Succeeded" ]; then
            exit 1
          fi

      # ============================================
      # 7. SSM에 배포 버전 태그 기록 (성공 시에만 실행)
      # ============================================
      - name: 💾 Save Deployed Version Tag to SSM
        if: success()
        run: |
          DEPLOYED_TAG="${{ steps.calculate_key.outputs.sha_tag }}"
          SSM_PARAM_NAME="/wealist/prod/version/user_service"

          echo "Writing deployed tag ${DEPLOYED_TAG} to SSM parameter: ${SSM_PARAM_NAME}"

          aws ssm put-parameter \
            --name "${SSM_PARAM_NAME}" \
            --value "${DEPLOYED_TAG}" \
            --type "String" \
            --overwrite \
            --region ${{ vars.AWS_REGION }}

          echo "✅ User Service version saved to SSM."
