name: CI - Prod Board Service

on:
  push:
    branches:
      - deploy-prod
    paths:
      - "board-service/**"
      - ".github/workflows/ci-prod-board-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.image-info.outputs.image-tag }}
      full-image: ${{ steps.image-info.outputs.full-image }}

    steps:
      # ============================================
      # 1. 코드 체크아웃
      # ============================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ============================================
      # 2. Go 환경 설정 및 종속성 다운로드 (빌드 전 준비)
      # ============================================
      - name: 🔧 Setup Go Environment and Download Dependencies
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: board-service/go.sum

      - name: 📦 Go Module Tidy & Download
        run: |
          cd board-service
          go mod tidy

      # ============================================
      # 3. Swagger 문서 생성 및 검증 (빌드/테스트 전)
      # ============================================
      - name: 📝 Generate and Validate Swagger Documentation
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          cd board-service
          swag init -g cmd/api/main.go -o docs --parseDependency --parseInternal

          echo "🔍 Running Swagger validation scripts..."
          ./scripts/validate-swagger.sh
          ./scripts/validate-dto-schemas.sh
          ./scripts/validate-godoc.sh
          echo "✅ Swagger documentation generated and validated"

      # ============================================
      # 4. Go 테스트 실행 (조기 실패 감지)
      # ============================================
      - name: 🧪 Run Go Tests
        continue-on-error: true
        run: |
          cd board-service
          go test -v -race -cover ./... || echo "⚠️ Tests failed but continuing build (Check logs!)"

      # --- [핵심] OIDC 인증 성공 여부 확인 단계 ---
      # 5번 스텝 바로 앞에 추가
      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::290008131187:role/wealist-prod-github-actions-role
          aws-region: ${{ vars.AWS_REGION }}
      # ============================================
      # 5. AWS Credentials 설정 (OIDC Role 기반으로 수정)
      # ============================================
      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::290008131187:role/wealist-prod-github-actions-role
          aws-region: ${{ vars.AWS_REGION }}

      # ============================================
      # 6. Environment Variables 로드 (ECR 관련)
      # ============================================
      - name: 📥 Load Environment Variables
        id: config
        run: |
          echo "📥 Loading configuration from GitHub Environment Variables..."

          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=${{ vars.ECR_REPOSITORY_BOARD }}" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV 

          echo "✅ Configuration loaded successfully"

      # ============================================
      # 7. 이미지 태그 생성
      # ============================================
      - name: 🏷️ Generate Image Tags
        id: image-info
        run: |
          ECR_REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          FULL_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          LATEST_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest"

          echo "ecr-registry=${ECR_REGISTRY}" >> $GITHUB_OUTPUT
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "full-image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "latest-image=${LATEST_IMAGE}" >> $GITHUB_OUTPUT
      # ============================================
      # 8-1. Amazon ECR 로그인
      # ============================================
      - name: 🔐 Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================
      # 8-2. Docker 이미지 빌드 & 푸시
      # ============================================
      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v5
        env:
          IMAGE_URI: ${{ steps.image-info.outputs.ecr-registry }}/${{ env.ECR_REPOSITORY }}
        with:
          context: user-service
          push: true
          tags: ${{ env.IMAGE_URI }}:${{ steps.image-info.outputs.image-tag }},${{ env.IMAGE_URI }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_URI }}:latest
          cache-to: type=inline
          build-args: CACHEBUST=${{ github.run_id }}

      # ============================================
      # 9. CodeDeploy 아티팩트 생성 및 S3 업로드
      # ============================================
      - name: 📦 Prepare CodeDeploy Artifact & Upload to S3
        id: s3_upload
        run: |
          # 1. CD 배포에 필요한 파일들을 새 폴더에 복사
          mkdir -p deploy_artifact/board-service/deploy.script
          mkdir -p deploy_artifact/docker/compose
          # ... (생략된 파일 복사 명령어)
          # 4. AWS S3에 직접 업로드
          aws s3 cp deploy_artifact.zip s3://${S3_BUCKET}/${S3_KEY}
          # ... (생략된 출력 명령어)

      # ============================================
      # 10. 빌드 결과 요약
      # ============================================
      - name: 📋 Build Summary
        run: |
          echo "### ✅ Board Service Build Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "**OIDC Check:** Completed step 5." >> $GITHUB_STEP_SUMMARY
          echo "**Action:** Next, remove the 'if: false' conditions." >> $GITHUB_STEP_SUMMARY
