name: CD - monitoring

on:
  push:
    branches:
      - deploy-dev
    paths:
      - "prometheus/**"
      - ".github/workflows/cd-dev-monitoring.yml"
  workflow_dispatch:

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.WEALIST_DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WEALIST_DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Load Base Configuration
        id: cfg
        run: |
          PREFIX="/wealist/dev/cd"
          MONITOR="/wealist/dev/monitor"

          set -a                  
          source .env             
          set +a

          EC2_ID=$(aws ssm get-parameter \
            --name "/wealist/dev/cd/ec2_instance_id" \
            --query 'Parameter.Value' \
            --output text)

          COMPOSE_DIR=$(aws ssm get-parameter \
            --name "/wealist/dev/monitor/compose_file_path" \
            --query 'Parameter.Value' \
            --output text)

          PARAMETER_PREFIX=$(aws ssm get-parameter \
            --name "/wealist/dev/cd/parameter_prefix" \
            --query 'Parameter.Value' \
            --output text)

          echo "ec2-instance-id=${EC2_ID}" >> $GITHUB_OUTPUT
          echo "compose_dir=$COMPOSE_DIR" >> $GITHUB_OUTPUT
          echo "param_prefix=$PARAMETER_PREFIX" >> $GITHUB_OUTPUT

      - name: Deploy Monitoring Stack (with SSM secrets → .env)
        run: |
          # 1. prometheus.yml, docker-compose.yml base64 인코딩
          COMPOSE_YML_B64=$(base64 -w 0 prometheus/docker-compose.yml)
          PROM_CONFIG_B64=$(base64 -w 0 prometheus/config/prometheus-ec2.yml)

          # 2. SSM에서 가져올 파라미터 목록 정의 (필요한 거 다 추가하세요)
          SSM_PARAMS=(
            "aws_account_id"
            "prometheus_port"
            "prometheus_healthcheck_path"
            "grafana_port"
            "grafana_admin_user"
            "grafana_admin_password"
            "redis_port"
            "redis_password"
            "postgres_superuser"
            "postgres_superuser_password"
            "postgres_exporter_port"
            "redis_exporter_port"
            "node_exporter_port"
            
          )

          # 3. SSM 파라미터들을 key=value 형태로 문자열로 모음
          ENV_CONTENT=""
          for param in "${SSM_PARAMS[@]}"; do
            value=$(aws ssm get-parameter \
              --name "${{ steps.cfg.outputs.param_prefix }}/$param" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text)
            ENV_CONTENT="${ENV_CONTENT}${param^^}=$value\n"  # 대문자로 변환 (관례)
          done

          ENV_B64=$(echo -e "$ENV_CONTENT" | base64 -w 0)

          # 4. EC2에서 모든 작업 한 번에 실행
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.cfg.outputs.ec2_id }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 900 \
            --comment "Monitoring Full Deploy - ${{ github.sha }}" \
            --parameters "commands=[
              \"echo '=== Monitoring CD 시작 ==='\",
              \"cd ${{ steps.cfg.outputs.compose_dir }}\",
              \"mkdir -p config\",
              
              \"echo '파일 업로드 중...'\",
              \"echo '${COMPOSE_YML_B64}' | base64 -d > docker-compose.yml\",
              \"echo '${PROM_CONFIG_B64}' | base64 -d > config/prometheus-ec2.yml\",
              \"echo '${ENV_B64}' | base64 -d > .env\",
              \"chmod 600 .env\",
              
              \"echo 'docker compose pull...'\",
              \"docker compose pull\",
              
              \"echo 'docker compose up -d --remove-orphans'\",
              \"docker compose up -d --remove-orphans\",
              
              \"echo '=== 헬스체크 시작 (최대 4분) ==='\",
              
              \"# Prometheus\",
              \"for i in {1..40}; do
                if curl -f http://localhost:${SSM_PARAMS[1]}/-/healthy >/dev/null 2>&1; then echo 'Prometheus OK'; break; fi
                echo 'Prometheus 대기 (\${i}s)'; sleep 6
              done\",
              
              \"# Grafana\",
              \"for i in {1..40}; do
                if curl -f http://localhost:${SSM_PARAMS[3]}/api/health >/dev/null 2>&1; then echo 'Grafana OK'; break; fi
                echo 'Grafana 대기 (\${i}s)'; sleep 6
              done\",
              
              
              \"echo '=== 최종 상태 ==='\",
              \"docker compose ps\",
              \"echo '모니터링 배포 완료!'\"
            ]" --query "Command.CommandId" --output text)

          echo "배포 명령 전송 완료 (Command ID: $COMMAND_ID)"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ steps.cfg.outputs.ec2_id }}"

          # 결과 확인 및 실패 시 로그 출력
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ steps.cfg.outputs.ec2_id }}" --query "Status" --output text)
          LOG=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ steps.cfg.outputs.ec2_id }}" --query "StandardOutputContent" --output text)
          ERR=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ steps.cfg.outputs.ec2_id }}" --query "StandardErrorContent" --output text)

          echo "$LOG"
          if [ -n "$ERR" ]; then echo "$ERR"; fi

          if [ "$STATUS" != "Success" ]; then
            echo "배포 실패!"
            exit 1
          fi

          echo "모니터링 스택이 완벽하게 배포되고 헬스체크까지 통과했습니다!"