name: CD - monitoring

on:
  push:
    branches:
      - deploy-dev
    paths:
      - "prometheus/**"
      - ".github/workflows/cd-dev-monitoring.yml"
  workflow_dispatch:

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.WEALIST_DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WEALIST_DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Load Base Configuration
        id: config
        run: |
          EC2_ID=$(aws ssm get-parameter --name "/wealist/dev/cd/ec2_instance_id" --query "Parameter.Value" --output text --with-decryption)
          COMPOSE_DIR=$(aws ssm get-parameter --name "/wealist/dev/monitor/compose_file_path" --query "Parameter.Value" --output text)
          PARAM_PREFIX=$(aws ssm get-parameter --name "/wealist/dev/cd/parameter_prefix" --query "Parameter.Value" --output text)

          echo "ec2-instance-id=$EC2_ID" >> $GITHUB_OUTPUT
          echo "compose-file-path=$COMPOSE_DIR" >> $GITHUB_OUTPUT
          echo "parameter-prefix=$PARAM_PREFIX" >> $GITHUB_OUTPUT
          echo "aws-region=ap-northeast-2" >> $GITHUB_OUTPUT

      - name: Create Deployment Script
        run: |
          cat << 'DEPLOY_SCRIPT' > /tmp/deploy-monitoring.sh
          #!/bin/bash
          set -euo pipefail

          echo "=== Starting Monitoring Stack Deployment ==="
          echo "Timestamp: $(date)"
          echo "Parameter Prefix: ${PARAMETER_PREFIX}"
          echo "Compose File Path: ${COMPOSE_FILE}"

          # Function to load regular parameters
          load_param() {
            local param_name="$1"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            echo "Loading parameter: ${full_param_path}"
            
            local value=$(aws ssm get-parameter \
              --name "${full_param_path}" \
              --query "Parameter.Value" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null || echo "")
            
            if [ -z "$value" ]; then
              echo "❌ Failed to load parameter: ${full_param_path}"
              return 1
            fi
            
            echo "$value"
          }

          # Function to load secret parameters
          load_secret() {
            local param_name="$1"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            echo "Loading secret: ${full_param_path}"
            
            local value=$(aws ssm get-parameter \
              --name "${full_param_path}" \
              --query "Parameter.Value" \
              --output text \
              --with-decryption \
              --region "${AWS_REGION}" 2>/dev/null || echo "")
            
            if [ -z "$value" ]; then
              echo "❌ Failed to load secret: ${full_param_path}"
              return 1
            fi
            
            echo "$value"
          }

          echo "📋 Loading environment variables from SSM..."
          
          # Load all required parameters
          export GRAFANA_ADMIN_USER=$(load_param "/monitor/grafana_admin_user")
          export GRAFANA_ADMIN_PASSWORD=$(load_secret "/monitor/grafana_admin_password")
          export PROMETHEUS_PORT=$(load_param "/monitor/prometheus_port")
          export GRAFANA_PORT=$(load_param "/monitor/grafana_port")
          export REDIS_EXPORTER_PORT=$(load_param "/monitor/redis_exporter_port")
          export POSTGRES_SUPERUSER=$(load_param "/db/postgres_superuser")
          export POSTGRES_SUPERUSER_PASSWORD=$(load_secret "/db/postgres_superuser_password")
          export POSTGRES_EXPORTER_PORT=$(load_param "/monitor/postgres_exporter_port")
          export NODE_EXPORTER_PORT=$(load_param "/monitor/node_exporter_port")

          echo "✅ Environment variables loaded successfully"

          # Navigate to compose directory
          echo "📂 Navigating to compose directory: ${COMPOSE_FILE%/*}"
          cd "${COMPOSE_FILE%/*}"

          # Decode and save docker-compose file
          echo "📝 Updating docker-compose file..."
          echo "${COMPOSE_B64}" | base64 -d > docker-compose.monitoring.yml

          # Decode and save prometheus config
          echo "📝 Updating Prometheus configuration..."
          mkdir -p prometheus/config
          echo "${PROM_CFG_B64}" | base64 -d > prometheus/config/prometheus-ec2.yml

          # Check current service status
          echo "🔍 Checking current service status..."
          SERVICES_TO_START=""
          INFRA_SERVICES="prometheus grafana redis-exporter postgres-exporter node-exporter"
          
          for service in $INFRA_SERVICES; do
            container_name="wealist-${service}"
            if docker ps --format '{{.Names}}' | grep -q "^${container_name}$"; then
              echo "  ✅ ${service} is running"
            else
              echo "  ⚠️  ${service} is not running"
              SERVICES_TO_START="${SERVICES_TO_START} ${service}"
            fi
          done

          # Deploy monitoring services
          echo "🚀 Deploying monitoring services..."
          docker-compose -f docker-compose.monitoring.yml up -d

          # Wait for services to be ready
          echo "⏳ Waiting for services to start..."
          sleep 30

          # Health check function
          health_check() {
            local service_name="$1"
            local port="$2"
            local endpoint="${3:-/}"
            local max_attempts=30
            local attempt=1
            
            echo "🔍 Health checking ${service_name} on port ${port}${endpoint}..."
            
            while [ $attempt -le $max_attempts ]; do
              if curl -s -o /dev/null -w "%{http_code}" "http://localhost:${port}${endpoint}" | grep -q "200\|302"; then
                echo "  ✅ ${service_name} is healthy (attempt ${attempt}/${max_attempts})"
                return 0
              fi
              
              echo "  ⏳ ${service_name} not ready yet (attempt ${attempt}/${max_attempts})"
              sleep 10
              ((attempt++))
            done
            
            echo "  ❌ ${service_name} health check failed after ${max_attempts} attempts"
            return 1
          }

          # Perform health checks
          echo "🏥 Performing health checks..."
          HEALTH_CHECK_FAILED=false

          # Prometheus health check
          if ! health_check "Prometheus" "${PROMETHEUS_PORT}" "/-/healthy"; then
            HEALTH_CHECK_FAILED=true
          fi

          # Grafana health check
          if ! health_check "Grafana" "${GRAFANA_PORT}" "/api/health"; then
            HEALTH_CHECK_FAILED=true
          fi

          # Node Exporter health check
          if ! health_check "Node Exporter" "${NODE_EXPORTER_PORT}" "/metrics"; then
            HEALTH_CHECK_FAILED=true
          fi

          # Redis Exporter health check
          if ! health_check "Redis Exporter" "${REDIS_EXPORTER_PORT}" "/metrics"; then
            HEALTH_CHECK_FAILED=true
          fi

          # Postgres Exporter health check
          if ! health_check "Postgres Exporter" "${POSTGRES_EXPORTER_PORT}" "/metrics"; then
            HEALTH_CHECK_FAILED=true
          fi

          # Final service status check
          echo "📊 Final service status:"
          for service in $INFRA_SERVICES; do
            container_name="wealist-${service}"
            if docker ps --format '{{.Names}}' | grep -q "^${container_name}$"; then
              echo "  ✅ ${service} is running"
            else
              echo "  ❌ ${service} is not running"
              HEALTH_CHECK_FAILED=true
            fi
          done

          if [ "$HEALTH_CHECK_FAILED" = true ]; then
            echo "❌ Some services failed health checks or are not running"
            echo "📋 Docker container logs for debugging:"
            docker-compose -f docker-compose.monitoring.yml logs --tail=50
            exit 1
          fi

          echo "🎉 Monitoring stack deployment completed successfully!"
          echo "📊 Services available at:"
          echo "  - Prometheus: http://localhost:${PROMETHEUS_PORT}"
          echo "  - Grafana: http://localhost:${GRAFANA_PORT} (admin/${GRAFANA_ADMIN_PASSWORD})"
          echo "  - Node Exporter: http://localhost:${NODE_EXPORTER_PORT}/metrics"
          echo "  - Redis Exporter: http://localhost:${REDIS_EXPORTER_PORT}/metrics"
          echo "  - Postgres Exporter: http://localhost:${POSTGRES_EXPORTER_PORT}/metrics"
          DEPLOY_SCRIPT

      - name: Deploy Monitoring Stack via SSM
        id: deploy
        run: |
          # Base64 encode docker-compose and prometheus config files
          COMPOSE_B64=$(base64 -w 0 docker/compose/docker-compose.monitoring.yml)
          PROM_CFG_B64=$(base64 -w 0 prometheus/config/prometheus-ec2.yml)
          
          # Base64 encode deployment script
          echo "📦 Encoding deployment script..."
          SCRIPT_BASE64=$(base64 -w 0 /tmp/deploy-monitoring.sh)
          echo "✅ Script encoded (${#SCRIPT_BASE64} bytes)"

          # Send SSM Run Command
          echo "🚀 Sending deployment command to EC2 instance..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Monitoring Stack - ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters commands="[
              \"echo '=== Monitoring Stack Deployment Started ===' \",
              \"echo 'Timestamp: '\$(date) \",
              \"echo 'Instance ID: '\$(ec2-metadata --instance-id 2>/dev/null || echo 'N/A') \",
              \"echo 'GitHub SHA: ${{ github.sha }}' \",
              \"echo '' \",
              \"echo '${SCRIPT_BASE64}' | base64 -d > /tmp/deploy-monitoring.sh\",
              \"chmod +x /tmp/deploy-monitoring.sh\",
              \"echo '🚀 Starting deployment script execution...' \",
              \"export PARAMETER_PREFIX='${{ steps.config.outputs.parameter-prefix }}'\",
              \"export AWS_REGION='${{ steps.config.outputs.aws-region }}'\",
              \"export COMPOSE_FILE='${{ steps.config.outputs.compose-file-path }}'\",
              \"export COMPOSE_B64='${COMPOSE_B64}'\",
              \"export PROM_CFG_B64='${PROM_CFG_B64}'\",
              \"/tmp/deploy-monitoring.sh 2>&1 | tee /tmp/deploy-monitoring.log\",
              \"DEPLOY_EXIT_CODE=\${PIPESTATUS[0]}\",
              \"echo '' \",
              \"echo '=== Deployment Script Finished ===' \",
              \"echo 'Exit Code: '\$DEPLOY_EXIT_CODE \",
              \"rm -f /tmp/deploy-monitoring.sh\",
              \"exit \$DEPLOY_EXIT_CODE\"
            ]" \
            --output text \
            --query "Command.CommandId")

          if [ -z "$COMMAND_ID" ]; then
            echo "❌ Failed to send SSM command - no Command ID returned"
            exit 1
          fi

          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Command sent successfully"
          echo "📝 Command ID: ${COMMAND_ID}"

      - name: Monitor Deployment Progress
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command-id }}"
          echo "📊 Monitoring deployment progress for command: ${COMMAND_ID}"
          
          # Wait for command completion
          MAX_WAIT=600  # 10 minutes
          WAIT_TIME=0
          
          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "⏳ Status: $STATUS (${WAIT_TIME}s elapsed)"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment completed successfully!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              echo "📋 Command output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --query "StandardOutputContent" \
                --output text
              echo "📋 Error output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            
            sleep 20
            WAIT_TIME=$((WAIT_TIME + 20))
          done
          
          if [ $WAIT_TIME -ge $MAX_WAIT ]; then
            echo "❌ Deployment timed out after ${MAX_WAIT} seconds"
            exit 1
          fi
          
          echo "📋 Final deployment output:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
            --query "StandardOutputContent" \
            --output text

      - name: Final Health Check Summary
        run: |
          echo "🎉 Monitoring Stack Deployment Summary"
          echo "======================================"
          echo "✅ Prometheus: Metrics collection and alerting"
          echo "✅ Grafana: Visualization dashboards"  
          echo "✅ Node Exporter: System metrics"
          echo "✅ Redis Exporter: Redis metrics"
          echo "✅ Postgres Exporter: Database metrics"
          echo ""
          echo "🔗 Access URLs (replace with your actual domain/IP):"
          echo "   - Prometheus: http://your-server:(port)"
          echo "   - Grafana: http://your-server:(port)"
          echo ""
          echo "📊 All services have passed health checks!"