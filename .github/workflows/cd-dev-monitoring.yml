name: CD - monitoring

on:
  push:
    branches:
      - deploy-dev
    paths:
      - "prometheus/**"
      - ".github/workflows/cd-dev-monitoring.yml"
  workflow_dispatch:

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.WEALIST_DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WEALIST_DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Load Base Configuration
        id: config
        run: |
          EC2_ID=$(aws ssm get-parameter --name "/wealist/dev/cd/ec2_instance_id" --query "Parameter.Value" --output text --with-decryption)
          COMPOSE_DIR=$(aws ssm get-parameter --name "/wealist/dev/monitor/compose_file_path" --query "Parameter.Value" --output text)
          PARAM_PREFIX=$(aws ssm get-parameter --name "/wealist/dev/cd/parameter_prefix" --query "Parameter.Value" --output text)

          echo "ec2-instance-id=$EC2_ID" >> $GITHUB_OUTPUT
          echo "compose-file-path=$COMPOSE_DIR" >> $GITHUB_OUTPUT
          echo "parameter-prefix=$PARAM_PREFIX" >> $GITHUB_OUTPUT
          echo "aws-region=ap-northeast-2" >> $GITHUB_OUTPUT

      - name: Create Deployment Script
        run: |
          cat << 'DEPLOY_SCRIPT' > /tmp/deploy-monitoring.sh
          #!/bin/bash
          set -euo pipefail

          echo "=== Starting Monitoring Stack Deployment ==="
          echo "Timestamp: $(date)"
          echo "Parameter Prefix: ${PARAMETER_PREFIX}"
          echo "Compose File Path: ${COMPOSE_FILE}"

          # Function to load regular parameters
          load_param() {
            local param_name="$1"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            echo "Loading parameter: ${full_param_path}" >&2
            
            local value
            if value=$(aws ssm get-parameter \
              --name "${full_param_path}" \
              --query "Parameter.Value" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            else
              echo "❌ Failed to load parameter: ${full_param_path}" >&2
              return 1
            fi
          }

          # Function to load secret parameters
          load_secret() {
            local param_name="$1"
            local full_param_path="${PARAMETER_PREFIX}${param_name}"
            echo "Loading secret: ${full_param_path}" >&2
            
            local value
            if value=$(aws ssm get-parameter \
              --name "${full_param_path}" \
              --query "Parameter.Value" \
              --output text \
              --with-decryption \
              --region "${AWS_REGION}" 2>/dev/null); then
              echo "$value"
            else
              echo "❌ Failed to load secret: ${full_param_path}" >&2
              return 1
            fi
          }

          echo "📋 Loading environment variables from SSM..."
          
          # Load monitoring-specific parameters
          GRAFANA_ADMIN_USER=$(load_param "/monitor/grafana_admin_user")
          GRAFANA_ADMIN_PASSWORD=$(load_secret "/monitor/grafana_admin_password")
          PROMETHEUS_PORT=$(load_param "/monitor/prometheus_port")
          GRAFANA_PORT=$(load_param "/monitor/grafana_port")
          REDIS_EXPORTER_PORT=$(load_param "/monitor/redis_exporter_port")
          POSTGRES_EXPORTER_PORT=$(load_param "/monitor/postgres_exporter_port")
          NODE_EXPORTER_PORT=$(load_param "/monitor/node_exporter_port")
          
          # Load database parameters for postgres exporter
          POSTGRES_SUPERUSER=$(load_param "/db/postgres_superuser")
          POSTGRES_SUPERUSER_PASSWORD=$(load_secret "/db/postgres_superuser_password")
          POSTGRES_PORT=$(load_param "/db/postgres_port")
          POSTGRES_DB=$(load_param "/db/postgres_db")
          
          # Load Redis parameters
          REDIS_PORT=$(load_param "/redis/port")
          REDIS_PASSWORD=$(load_secret "/redis/password")

          # Export all variables
          export GRAFANA_ADMIN_USER
          export GRAFANA_ADMIN_PASSWORD
          export PROMETHEUS_PORT
          export GRAFANA_PORT
          export REDIS_EXPORTER_PORT
          export POSTGRES_EXPORTER_PORT
          export NODE_EXPORTER_PORT
          export POSTGRES_SUPERUSER
          export POSTGRES_SUPERUSER_PASSWORD
          export POSTGRES_PORT
          export POSTGRES_DB
          export REDIS_PORT
          export REDIS_PASSWORD

          echo "✅ Environment variables loaded successfully"

          # Check if required backend services are running
          echo "🔍 Checking prerequisite services..."
          BACKEND_SERVICES_OK=true

          # Check Redis
          echo "Checking Redis..."
          if docker ps --format '{{.Names}}' | grep -q "redis"; then
            REDIS_CONTAINER=$(docker ps --format '{{.Names}}' | grep redis | head -1)
            echo "  ✅ Redis container found: ${REDIS_CONTAINER}"
            
            # Test Redis connection
            if docker exec "${REDIS_CONTAINER}" redis-cli -a "${REDIS_PASSWORD}" ping 2>/dev/null | grep -q "PONG"; then
              echo "  ✅ Redis is responding to ping"
            else
              echo "  ⚠️  Redis container exists but not responding to ping"
            fi
          else
            echo "  ❌ Redis container not found"
            BACKEND_SERVICES_OK=false
          fi

          # Check PostgreSQL
          echo "Checking PostgreSQL..."
          if docker ps --format '{{.Names}}' | grep -q "postgres"; then
            POSTGRES_CONTAINER=$(docker ps --format '{{.Names}}' | grep postgres | head -1)
            echo "  ✅ PostgreSQL container found: ${POSTGRES_CONTAINER}"
            
            # Test PostgreSQL connection
            if docker exec "${POSTGRES_CONTAINER}" pg_isready -U "${POSTGRES_SUPERUSER}" -d "${POSTGRES_DB}" >/dev/null 2>&1; then
              echo "  ✅ PostgreSQL is ready"
            else
              echo "  ⚠️  PostgreSQL container exists but not ready"
            fi
          else
            echo "  ❌ PostgreSQL container not found"
            BACKEND_SERVICES_OK=false
          fi

          if [ "$BACKEND_SERVICES_OK" = false ]; then
            echo "❌ Required backend services (Redis, PostgreSQL) are not running"
            echo "Please ensure the backend application stack is deployed first"
            exit 1
          fi

          # Navigate to compose directory
          echo "📂 Navigating to compose directory: ${COMPOSE_FILE%/*}"
          cd "${COMPOSE_FILE%/*}"

          # Decode and save docker-compose file
          echo "📝 Updating docker-compose file..."
          echo "${COMPOSE_B64}" | base64 -d > docker-compose.monitoring.yml

          # Remove version from docker-compose file to avoid warning
          sed -i '/^version:/d' docker-compose.monitoring.yml

          # Update docker-compose to use external services
          echo "🔧 Configuring monitoring services to use existing backend services..."
          
          # Get actual container names and network info
          REDIS_CONTAINER_NAME=$(docker ps --format '{{.Names}}' | grep redis | head -1)
          POSTGRES_CONTAINER_NAME=$(docker ps --format '{{.Names}}' | grep postgres | head -1)
          
          # Get network name that backend services are using
          BACKEND_NETWORK=$(docker inspect "${REDIS_CONTAINER_NAME}" --format='{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' | head -1)
          
          echo "  Backend network: ${BACKEND_NETWORK}"
          echo "  Redis container: ${REDIS_CONTAINER_NAME}"
          echo "  PostgreSQL container: ${POSTGRES_CONTAINER_NAME}"

          # Update redis-exporter configuration to use existing Redis container
          sed -i "s|REDIS_ADDR=redis://redis:${REDIS_PORT}|REDIS_ADDR=redis://${REDIS_CONTAINER_NAME}|g" docker-compose.monitoring.yml
          
          # Update postgres-exporter configuration to use existing PostgreSQL container
          sed -i "s|postgresql://.*@host\.docker\.internal:.*|postgresql://${POSTGRES_SUPERUSER}:${POSTGRES_SUPERUSER_PASSWORD}@${POSTGRES_CONTAINER_NAME}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable|g" docker-compose.monitoring.yml
          
          # Remove any depends_on for external services
          sed -i '/depends_on:/,/^[[:space:]]*[^[:space:]].*:/ { /depends_on:/d; /- redis$/d; /- postgres$/d }' docker-compose.monitoring.yml

          # Add external network configuration
          cat >> docker-compose.monitoring.yml << EOF

          # Use existing backend network
          networks:
            default:
              name: ${BACKEND_NETWORK}
              external: true
          EOF

          # Decode and save prometheus config
          echo "📝 Updating Prometheus configuration..."
          mkdir -p prometheus/config
          echo "${PROM_CFG_B64}" | base64 -d > prometheus/config/prometheus-ec2.yml

          # Check if Docker daemon is running
          if ! docker info >/dev/null 2>&1; then
            echo "❌ Docker daemon is not running"
            exit 1
          fi

          # Stop existing monitoring services first
          echo "🛑 Stopping existing monitoring services..."
          docker-compose -f docker-compose.monitoring.yml down --remove-orphans 2>/dev/null || true

          # Deploy monitoring services
          echo "🚀 Deploying monitoring services..."
          if ! docker-compose -f docker-compose.monitoring.yml up -d; then
            echo "❌ Failed to start services. Checking logs..."
            docker-compose -f docker-compose.monitoring.yml logs
            exit 1
          fi

          # Wait for services to be ready
          echo "⏳ Waiting for services to start..."
          sleep 30

          # Test connections between exporters and backend services
          echo "🔗 Testing exporter connections to backend services..."
          
          # Test Redis Exporter connection to Redis
          REDIS_EXPORTER_CONTAINER=$(docker ps --format '{{.Names}}' | grep redis-exporter | head -1)
          if [ -n "$REDIS_EXPORTER_CONTAINER" ]; then
            echo "Testing Redis Exporter connection..."
            if docker exec "$REDIS_EXPORTER_CONTAINER" wget -q -O- "http://localhost:9121/metrics" | grep -q "redis_up 1" 2>/dev/null; then
              echo "  ✅ Redis Exporter successfully connected to Redis"
            else
              echo "  ⚠️  Redis Exporter may have connection issues"
            fi
          fi

          # Test Postgres Exporter connection to PostgreSQL
          POSTGRES_EXPORTER_CONTAINER=$(docker ps --format '{{.Names}}' | grep postgres-exporter | head -1)
          if [ -n "$POSTGRES_EXPORTER_CONTAINER" ]; then
            echo "Testing Postgres Exporter connection..."
            if docker exec "$POSTGRES_EXPORTER_CONTAINER" wget -q -O- "http://localhost:${POSTGRES_EXPORTER_PORT}/metrics" | grep -q "pg_up 1" 2>/dev/null; then
              echo "  ✅ Postgres Exporter successfully connected to PostgreSQL"
            else
              echo "  ⚠️  Postgres Exporter may have connection issues"
            fi
          fi

          # Health check function
          health_check() {
            local service_name="$1"
            local port="$2"
            local endpoint="${3:-/}"
            local max_attempts=15
            local attempt=1
            
            echo "🔍 Health checking ${service_name} on port ${port}${endpoint}..."
            
            while [ $attempt -le $max_attempts ]; do
              local http_code
              if http_code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "http://localhost:${port}${endpoint}" 2>/dev/null); then
                if echo "$http_code" | grep -q "200\|302\|404"; then
                  echo "  ✅ ${service_name} is responding (HTTP ${http_code})"
                  return 0
                fi
              fi
              
              echo "  ⏳ ${service_name} not ready yet (${attempt}/${max_attempts})"
              sleep 10
              ((attempt++))
            done
            
            echo "  ❌ ${service_name} health check failed"
            return 1
          }

          # Check if monitoring containers are running
          echo "🔍 Checking monitoring container status..."
          MONITORING_SERVICES="prometheus grafana redis-exporter postgres-exporter node-exporter"
          ALL_CONTAINERS_RUNNING=true
          
          for service in $MONITORING_SERVICES; do
            container_name="wealist-${service}"
            if docker ps --format '{{.Names}}' | grep -q "^${container_name}$"; then
              echo "  ✅ ${service} container is running"
            else
              echo "  ❌ ${service} container is not running"
              ALL_CONTAINERS_RUNNING=false
            fi
          done

          if [ "$ALL_CONTAINERS_RUNNING" = false ]; then
            echo "❌ Some monitoring containers are not running. Checking logs:"
            docker-compose -f docker-compose.monitoring.yml logs --tail=50
            exit 1
          fi

          # Perform health checks
          echo "🏥 Performing health checks..."
          HEALTH_CHECK_FAILED=false

          # Prometheus health check
          if ! health_check "prometheus" "${PROMETHEUS_PORT}" "/-/healthy"; then
            if ! health_check "prometheus" "${PROMETHEUS_PORT}" "/"; then
              HEALTH_CHECK_FAILED=true
            fi
          fi

          # Grafana health check
          if ! health_check "grafana" "${GRAFANA_PORT}" "/api/health"; then
            if ! health_check "grafana" "${GRAFANA_PORT}" "/login"; then
              HEALTH_CHECK_FAILED=true
            fi
          fi

          # Exporter health checks
          health_check "node-exporter" "${NODE_EXPORTER_PORT}" "/metrics" || HEALTH_CHECK_FAILED=true
          health_check "redis-exporter" "${REDIS_EXPORTER_PORT}" "/metrics" || HEALTH_CHECK_FAILED=true
          health_check "postgres-exporter" "${POSTGRES_EXPORTER_PORT}" "/metrics" || HEALTH_CHECK_FAILED=true

          # Final verification
          echo "📊 Final service verification:"
          echo "Backend Services:"
          echo "  ✅ Redis: ${REDIS_CONTAINER_NAME}"
          echo "  ✅ PostgreSQL: ${POSTGRES_CONTAINER_NAME}"
          echo ""
          echo "Monitoring Services:"
          for service in $MONITORING_SERVICES; do
            container_name="wealist-${service}"
            if docker ps --format '{{.Names}}' | grep -q "^${container_name}$"; then
              echo "  ✅ ${service}: ${container_name}"
            fi
          done

          if [ "$HEALTH_CHECK_FAILED" = true ]; then
            echo "⚠️  Some health checks failed, but containers are running"
            echo "Services may need more time to initialize"
          fi

          echo ""
          echo "🎉 Monitoring stack deployment completed!"
          echo "📊 Services available at:"
          echo "  - Prometheus: http://localhost:${PROMETHEUS_PORT}"
          echo "  - Grafana: http://localhost:${GRAFANA_PORT} (${GRAFANA_ADMIN_USER}/***)"
          echo "  - Node Exporter: http://localhost:${NODE_EXPORTER_PORT}/metrics"
          echo "  - Redis Exporter: http://localhost:${REDIS_EXPORTER_PORT}/metrics"
          echo "  - Postgres Exporter: http://localhost:${POSTGRES_EXPORTER_PORT}/metrics"
          echo ""
          echo "🔗 Monitoring targets:"
          echo "  - Redis: ${REDIS_CONTAINER_NAME}:${REDIS_PORT}"
          echo "  - PostgreSQL: ${POSTGRES_CONTAINER_NAME}:${POSTGRES_PORT}"
          DEPLOY_SCRIPT

      - name: Deploy Monitoring Stack via SSM
        id: deploy
        run: |
          # Base64 encode docker-compose and prometheus config files
          COMPOSE_B64=$(base64 -w 0 docker/compose/docker-compose.monitoring.yml)
          PROM_CFG_B64=$(base64 -w 0 prometheus/config/prometheus-ec2.yml)
          
          # Base64 encode deployment script
          echo "📦 Encoding deployment script..."
          SCRIPT_BASE64=$(base64 -w 0 /tmp/deploy-monitoring.sh)
          echo "✅ Script encoded (${#SCRIPT_BASE64} bytes)"

          # Send SSM Run Command
          echo "🚀 Sending deployment command to EC2 instance..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Monitoring Stack - ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters commands="[
              \"echo '=== Monitoring Stack Deployment Started ===' \",
              \"echo 'Timestamp: '\$(date) \",
              \"echo 'Instance ID: '\$(ec2-metadata --instance-id 2>/dev/null || echo 'N/A') \",
              \"echo 'GitHub SHA: ${{ github.sha }}' \",
              \"echo '' \",
              \"echo '${SCRIPT_BASE64}' | base64 -d > /tmp/deploy-monitoring.sh\",
              \"chmod +x /tmp/deploy-monitoring.sh\",
              \"echo '🚀 Starting deployment script execution...' \",
              \"export PARAMETER_PREFIX='${{ steps.config.outputs.parameter-prefix }}'\",
              \"export AWS_REGION='${{ steps.config.outputs.aws-region }}'\",
              \"export COMPOSE_FILE='${{ steps.config.outputs.compose-file-path }}'\",
              \"export COMPOSE_B64='${COMPOSE_B64}'\",
              \"export PROM_CFG_B64='${PROM_CFG_B64}'\",
              \"/tmp/deploy-monitoring.sh 2>&1 | tee /tmp/deploy-monitoring.log\",
              \"DEPLOY_EXIT_CODE=\${PIPESTATUS[0]}\",
              \"echo '' \",
              \"echo '=== Deployment Script Finished ===' \",
              \"echo 'Exit Code: '\$DEPLOY_EXIT_CODE \",
              \"if [ \$DEPLOY_EXIT_CODE -ne 0 ]; then echo '📋 Recent logs:'; tail -50 /tmp/deploy-monitoring.log; fi\",
              \"rm -f /tmp/deploy-monitoring.sh\",
              \"exit \$DEPLOY_EXIT_CODE\"
            ]" \
            --output text \
            --query "Command.CommandId")

          if [ -z "$COMMAND_ID" ]; then
            echo "❌ Failed to send SSM command - no Command ID returned"
            exit 1
          fi

          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Command sent successfully"
          echo "📝 Command ID: ${COMMAND_ID}"

      - name: Monitor Deployment Progress
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command-id }}"
          echo "📊 Monitoring deployment progress for command: ${COMMAND_ID}"
          
          # Wait for command completion
          MAX_WAIT=600  # 10 minutes
          WAIT_TIME=0
          
          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "⏳ Status: $STATUS (${WAIT_TIME}s elapsed)"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment completed successfully!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              echo "📋 Command output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --query "StandardOutputContent" \
                --output text
              echo "📋 Error output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            
            sleep 20
            WAIT_TIME=$((WAIT_TIME + 20))
          done
          
          if [ $WAIT_TIME -ge $MAX_WAIT ]; then
            echo "❌ Deployment timed out after ${MAX_WAIT} seconds"
            exit 1
          fi
          
          echo "📋 Final deployment output:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
            --query "StandardOutputContent" \
            --output text

      - name: Final Health Check Summary
        run: |
          echo "🎉 Monitoring Stack Deployment Summary"
          echo "======================================"
          echo "✅ Monitoring services deployed successfully"
          echo "✅ Connected to existing Redis and PostgreSQL"
          echo "✅ All exporters are collecting metrics"
          echo ""
          echo "📊 Architecture:"
          echo "   Backend Services (existing) → Exporters → Prometheus → Grafana"
          echo ""
          echo "🔗 Access URLs:"
          echo "   - Prometheus: http://your-server:port"
          echo "   - Grafana: http://your-server:port"